[package]
name = "rvt-rs-mcp"
version = "0.16.0"
edition = "2024"
# rmcp 3.x declares 1.88, so this crate does too. The workspace and the `rvt`
# crate stay at 1.87: nothing in `rvt` depends on this crate.
rust-version = "1.88"
license = "Apache-2.0"
description = "Local, read-only Model Context Protocol server for Autodesk Revit files (.rvt, .rfa, .rte, .rft), over stdio: it links the rvt crate in process, needs no Revit install and makes no network call."
authors = ["Griffin Long <151978260+DrunkOnJava@users.noreply.github.com>"]
repository = "https://github.com/DrunkOnJava/rvt-rs"
documentation = "https://github.com/DrunkOnJava/rvt-rs/blob/main/docs/mcp.md"
readme = "README.md"
keywords = ["revit", "bim", "mcp", "ifc", "autodesk"]
categories = ["command-line-utilities", "parser-implementations"]
# The source, the README crates.io shows and the licence files. The end-to-end
# test reads the committed synthetic fixtures under ../corpus, so it stays in
# the repository, and cargo drops the targets whose files are left out.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[lints]
workspace = true

[dependencies]
# The core library: every answer comes from the model its IFC exporter builds.
rvt = { path = "..", version = "=0.16.0" }
# stdio only: no HTTP transport feature, so the dependency tree carries no HTTP
# client or server (tools/ci/audit-mcp-network.sh checks it). Not
# `transport-io` either: it switches on tokio's `net` (and with it mio and
# socket2) for a non-blocking pipe transport this server does not use, and
# main.rs serves `(tokio::io::stdin(), tokio::io::stdout())`, which needs only
# `server`'s `transport-async-rw` and tokio's `io-std`.
rmcp = { version = "3.8", features = ["server", "macros", "schemars"] }
# The tool schemas rmcp publishes come from this crate's derive.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# One cheap runtime thread: the decoding runs on tokio's blocking pool. No
# `net`: the server opens no socket.
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std"] }
sha2 = "0.11"
# An export is written to a uniquely named file in the target's folder (created
# exclusively, removed on every error path) and then linked or renamed into
# place.
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
# The end-to-end test drives the built binary with rmcp's own client.
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
