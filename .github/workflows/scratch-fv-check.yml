# Scratch: keep-going checks of the whole workspace on pushes to this branch only, so that every
# compile error, clippy finding and rustdoc warning of the graph-value change is listed at once.
# Removed before the pull request is ready.
name: scratch fv check
on:
  push:
    branches: ["perf/1694-fv-graphs"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check everything, keep going
        run: |
          cargo +stable check --keep-going --workspace --all-targets --all-features --message-format short > check.log 2>&1 || true
          echo "log lines: $(wc -l < check.log)"
          echo "errors: $(grep -c -E '(^|: )error' check.log || true)"
          grep -E '(^|: )error|: warning: ' check.log | head -400 || true
      - name: Clippy, keep going
        run: |
          cargo +stable clippy --keep-going --workspace --all-targets --all-features --message-format short -- -D warnings > clippy.log 2>&1 || true
          echo "clippy log lines: $(wc -l < clippy.log)"
          echo "clippy findings: $(grep -c -E '(^|: )(error|warning)' clippy.log || true)"
          grep -E '(^|: )(error|warning)' clippy.log | head -400 || true
      - name: Rustdoc
        run: |
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --lib > doc.log 2>&1 || true
          echo "doc findings: $(grep -c -E '^(error|warning)' doc.log || true)"
          grep -E '^(error|warning)' -A 8 doc.log | head -120 || true
      - name: Graph value tests
        run: |
          cargo +stable test --lib graph_value > test.log 2>&1 || true
          grep -E 'test result|FAILED|panicked|^test .* (FAILED|ok)$|error' test.log | head -60 || true
