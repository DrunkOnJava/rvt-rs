name: CI (pull request)

# A pull request runs ci.yml through here: in full once it is ready, and only
# the fast jobs (fmt, clippy, cargo doc, the PII guard, the env lint, Corpus
# health, the MCP server on Einhoven and the Ubuntu stable and MSRV builds
# with their real-file checks) while it is a draft. Called jobs are named
# after the calling job, so a ready head carries `full / CI passed`, the one
# required check, and a draft head only `fast / ...` checks: GitHub counts a
# skipped required check as a success, so the draft run must not produce one
# of that name at all. In the four hours before this (#1237), runs on drafts
# were 56% of pull-request CI's runner-minutes, with the account at its 40
# concurrent jobs.
on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not in the default set: without it, marking a
    # draft ready would run nothing on its head.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# A newer push supersedes the in-flight run of its own kind: fast and full
# runs are in groups of their own, so marking a draft ready starts the full
# run at once and leaves the draft's fast run to finish. Cancelling it left
# eight cancelled `fast / ...` checks and a failed `fast / CI passed` on the
# head, which the pr-queue mod reads as a failing PR (#1317, 2026-11-04).
# Only a new push cancels; a change of draft state on the same commit waits
# for the run of its kind in flight (ci.yml's group, keyed the same way).
concurrency:
  group: ci-pr-${{ github.ref }}-${{ github.event.pull_request.draft && 'fast' || 'full' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  full:
    if: github.event.pull_request.draft != true
    uses: $/.github/workflows/ci.yml
  fast:
    if: github.event.pull_request.draft == true
    uses: $/.github/workflows/ci.yml
    with:
      fast: true
