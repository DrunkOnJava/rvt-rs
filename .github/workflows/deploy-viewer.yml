name: Deploy viewer

# VW1-18 — build the WASM + the Vite site and publish to
# https://drunkonjava.github.io/rvt-rs/viewer/ via GitHub Pages.
# Runs on every push to main that touches viewer/ or src/ (so the
# WASM stays fresh), plus manual runs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Tier-1 + synthetic demos stage from in-repo corpus/tier1/ and
      # gen-fixture — no Autodesk LFS needed for Playwright MVP coverage.
      # Magnetar project sample powers the optional real-project viewer
      # regression (RVT_VIEWER_SAMPLE / projectSampleTest).
      - name: Checkout public project corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: wasm-pack@0.14.0

      - name: Install wabt (for Import-table audit)
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Build WASM
        # wasm-pack argument parsing is order-sensitive. Everything
        # before `--` goes to wasm-pack; everything after goes to
        # cargo. Default out-dir (`./pkg`) avoids an interaction
        # where `--out-dir` after `--features` is forwarded to
        # `cargo build`, which doesn't recognise it.
        run: |
          wasm-pack build --target web -- --features wasm --no-default-features
          rm -rf viewer/pkg
          mv pkg viewer/pkg

      - name: Verify no network imports in wasm (VW1-21)
        run: |
          if wasm-objdump -j Import -x viewer/pkg/rvt_bg.wasm | \
               grep -iE '"(fetch|XMLHttpRequest|WebSocket|EventSource|sendBeacon)"'; then
            echo "::error::VW1-21 violation: wasm imports a network primitive"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: viewer
        run: npm ci

      - name: Stage redistributable demos
        working-directory: viewer
        run: |
          # gen-fixture is built with the WASM crate above via cargo; ensure release bin exists
          cargo build --release --bin gen-fixture
          npm run stage:demos

      - name: Install Playwright Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: viewer
        run: npm run typecheck

      - name: Build viewer
        working-directory: viewer
        run: npm run build

      - name: Browser regression tests
        working-directory: viewer
        env:
          RVT_VIEWER_SAMPLE: ../_project_corpus/Revit/Revit_IFC5_Einhoven.rvt
        run: npm run test:browser

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: viewer/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
