name: Deploy viewer

# VW1-18 — build the WASM + the Vite site and publish to
# https://drunkonjava.github.io/rvt-rs/ via GitHub Pages (Pages root;
# the old `/viewer/` sub-path 404s).
# Runs on every push to main that touches viewer/, src/ or rvt-wasm/ (so
# the WASM stays fresh), plus manual runs.
#
# C3: the viewer is published only from a commit whose CI passed. The deploy
# job waits for CI's `CI passed` check on the pushed commit; a commit CI's
# push filter skips (only docs, Markdown and the like, such as a demo-catalog
# change) deploys without it. Only the deploy job can write to Pages.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rvt-wasm/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'rvt-wasm/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

# Read-only by default; only the deploy job below can write to Pages (C3).
# The build job runs pnpm dependencies and Playwright, and holds no write
# scope.
permissions:
  contents: read

# One build per ref. A newer push to a pull request supersedes its
# in-flight build; pushes to main queue instead. The deploy job below
# serialises on the Pages group. A single `pages` group shared by every
# PR build and deploy made PR checks cancel each other whenever two
# runs queued.
concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Tier-1 + synthetic demos stage from in-repo corpus/tier1/ and
      # gen-fixture — no Autodesk LFS needed for Playwright MVP coverage.
      # The MIT magnetar project samples (Einhoven 2023, Core Interior
      # 2024) are staged from this checkout as real-project gallery demos
      # (sha256-pinned in docs/viewer-demos.json) and power the
      # real-project viewer regression (RVT_VIEWER_SAMPLE / projectSampleTest).
      - name: Checkout public project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
      # W9: the viewer journey (viewer/tests/journey.spec.ts) also runs on the
      # four RE1 models (Drshelden/IFC-ECS, MIT), pinned by commit and hash
      # as ci.yml fetches them.
      - name: Fetch the RE1 models (Drshelden/IFC-ECS, MIT)
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Drshelden/IFC-ECS/9e8b37175a0fba1397f7011aeee917fe52de7623/data/RE1
          dir="${GITHUB_WORKSPACE}/_project_corpus/Revit"
          while read -r name sum; do
            curl -sSfL --retry 5 --retry-all-errors -o "${dir}/${name}" "${base}/${name}"
            echo "${sum}  ${dir}/${name}" | sha256sum -c -
          done <<'LIST'
          RE1-Architecture.rvt 4a78bdd68e7f4dd7806060db07c222da9a810e20b3f303c17a443294b91c8ce4
          RE1-Mechanical.rvt d559720177aa0ec435133f804e7c45d60da2deb9d5585bb3d55f4830139c014b
          RE1-Plumbing.rvt 03689df2aa426031a216e65051b9f19d3265d6fe96884dd47373b17435f9e54c
          RE1-Electrical.rvt 9875e765c9f47893808c47b845a8379b8777b92510e3e0284f763cb457c9630b
          LIST

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: viewer-wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2.88.0
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        # The bindings are their own crate, rvt-wasm (C6). `--out-dir` is
        # relative to that crate, so `../viewer/pkg` writes straight into the
        # viewer; `--out-name rvt` keeps the files `rvt.js` and
        # `rvt_bg.wasm`.
        run: wasm-pack build rvt-wasm --target web --out-dir ../viewer/pkg --out-name rvt

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          # The pnpm store, keyed on the lockfile (C6).
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      # Every import of the wasm, by name and by the body of its shim in the
      # glue; the script says why a name alone is not enough.
      - name: Verify no network imports in wasm (VW1-21)
        working-directory: viewer
        run: node scripts/audit-wasm-imports.mjs

      - name: Install dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile

      - name: Stage redistributable demos
        working-directory: viewer
        run: |
          # gen-fixture generates the synthetic-mvp demo. Build it with the
          # CI profile, which the viewer-wasm cache above keeps from the last
          # run on main; the release profile's full LTO rebuilt the crate
          # from scratch here (39 s per run). The stager finds the binary on
          # PATH.
          cargo build --profile ci --bin gen-fixture
          PATH="$(pwd)/../target/ci:$PATH" pnpm run stage:demos

      - name: Playwright version
        id: playwright
        working-directory: viewer
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browser download, keyed on the Playwright version (C6); the
      # install below still adds the OS packages, which are not cached.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        working-directory: viewer
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        working-directory: viewer
        run: pnpm run typecheck

      - name: Build viewer
        working-directory: viewer
        run: pnpm run build

      - name: Browser regression tests
        working-directory: viewer
        env:
          RVT_VIEWER_SAMPLE: ../_project_corpus/Revit/Revit_IFC5_Einhoven.rvt
          RVT_VIEWER_REQUIRE_JOURNEYS: "1"
        run: pnpm run test:browser

      # The viewer draws doors and windows from their saved meshes by default,
      # on the condition (Griffin, 2026-10-30) that its memory and load time
      # are measured in Playwright on the reference models. Each is opened
      # with the option on and off; the spec asserts behaviour, not timings,
      # and writes the figures to viewer/measurements/ and the job summary.
      # It runs after the suite, alone, so nothing else competes for the CPU.
      - name: Measure the viewer with and without saved meshes
        if: ${{ !cancelled() }}
        working-directory: viewer
        env:
          RVT_VIEWER_MEASURE: "1"
          RVT_VIEWER_REQUIRE_JOURNEYS: "1"
        run: pnpm exec playwright test --config playwright.config.ts --reporter=list --output=test-results/measure

      - name: Upload the saved-mesh measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: viewer-saved-meshes-measurement
          path: viewer/measurements/
          if-no-files-found: ignore
          retention-days: 30

      # The HTML report and each failed test's trace, kept for 14 days.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: viewer/dist

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      pages: write
      id-token: write
      checks: read
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # C3: wait for CI on this commit. A commit whose every file CI's push
      # filter ignores runs no CI, and deploys at once.
      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh api "repos/${GH_REPO}/commits/${SHA}" --jq '.files[].filename' \
               | grep -qvE '(\.md$|^docs/|^LICENSE|^\.gitignore$|^\.github/ISSUE_TEMPLATE/|^CITATION\.cff$)'; then
            echo "CI's push filter skips this commit; deploying it"
            exit 0
          fi
          for _ in $(seq 1 80); do
            conclusion=$(gh api "repos/${GH_REPO}/commits/${SHA}/check-runs?check_name=CI%20passed" \
              --jq '[.check_runs[] | select(.status == "completed") | .conclusion] | first // ""')
            case "$conclusion" in
              success) echo "CI passed on ${SHA}"; exit 0 ;;
              "") sleep 60 ;;
              *) echo "::error::CI concluded ${conclusion} on ${SHA}; not publishing it"; exit 1 ;;
            esac
          done
          echo "::error::CI did not finish on ${SHA} within 80 minutes"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
