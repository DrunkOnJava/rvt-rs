name: Deploy viewer

# VW1-18 — build the WASM + the Vite site and publish to
# https://drunkonjava.github.io/rvt-rs/ via GitHub Pages (Pages root;
# the old `/viewer/` sub-path 404s).
# Runs on every push to main that touches viewer/, src/ or rvt-wasm/ (so
# the WASM stays fresh), plus manual runs. It builds and publishes the site,
# runs the browser tests and measures the viewer with and without saved meshes,
# on the release build it publishes.
# The browser tests are viewer-test.yml's: ci.yml runs them as part of
# `CI passed` (#1374), so a pull request cannot merge before they have passed
# on its head. To check a draft's viewer, dispatch viewer-test.yml on its
# branch.
#
# C3: the viewer is published only from a commit whose CI passed, the browser
# tests included. The deploy job waits for CI's `CI passed` check on the pushed
# commit; a commit CI's push filter skips (only docs, Markdown and the like,
# such as a demo-catalog change, whose pull request ran the tests) deploys
# without it. Only the deploy job can write to Pages.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rvt-wasm/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

# Read-only by default; only the deploy job below can write to Pages (C3).
# The build job runs pnpm dependencies, and holds no write scope.
permissions:
  contents: read

# One build per ref; pushes to main queue. The deploy job below serialises on
# the Pages group.
concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Longest 8.4 minutes in 15 runs.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Tier-1 + synthetic demos stage from in-repo corpus/tier1/ and
      # gen-fixture. The MIT magnetar project samples (Einhoven 2023, Core
      # Interior 2024) are staged from this checkout as real-project gallery
      # demos (sha256-pinned in docs/viewer-demos.json).
      - name: Checkout public project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: viewer-wasm

      - name: Locked wasm-bindgen version
        # wasm-pack fetches the wasm-bindgen CLI that Cargo.lock pins at build
        # time, from GitHub and then by `cargo install`, which retries for
        # seconds: a 40 s DNS outage failed both and turned main red (CI run 41954251714). The
        # prebuilt binary of the locked version is installed below by
        # install-action, which retries each download for about a minute, and
        # wasm-pack uses the one it finds on PATH.
        id: wasm-bindgen
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no wasm-bindgen version in Cargo.lock (read '${version}')"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install wasm-pack and wasm-bindgen
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: wasm-pack@0.14.0,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build WASM
        # The bindings are their own crate, rvt-wasm (C6). `--out-dir` is
        # relative to that crate, so `../viewer/pkg` writes straight into the
        # viewer; `--out-name rvt` keeps the files `rvt.js` and
        # `rvt_bg.wasm`.
        run: wasm-pack build rvt-wasm --target web --out-dir ../viewer/pkg --out-name rvt

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          # The pnpm store, keyed on the lockfile (C6).
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      # Every import of the wasm, by name and by the body of its shim in the
      # glue; the script says why a name alone is not enough.
      - name: Verify no network imports in wasm (VW1-21)
        working-directory: viewer
        run: node scripts/audit-wasm-imports.mjs

      - name: Install dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile

      - name: Stage redistributable demos
        working-directory: viewer
        run: |
          # gen-fixture generates the synthetic-mvp demo. Build it with the
          # CI profile, which the viewer-wasm cache above keeps from the last
          # run on main; the release profile's full LTO rebuilt the crate
          # from scratch here (39 s per run). The stager finds the binary on
          # PATH.
          cargo build --profile ci --bin gen-fixture
          PATH="$(pwd)/../target/ci:$PATH" pnpm run stage:demos

      - name: Build viewer
        working-directory: viewer
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: viewer/dist

  # The browser tests again, on the release build of the WASM that this
  # workflow publishes: ci.yml's `viewer` job tests the faster build without
  # LTO, which is what a pull request waits for. One leg, since nothing waits
  # for it but the deploy, which waits for `CI passed` as long.
  tests:
    permissions:
      contents: read
    uses: $/.github/workflows/viewer-test.yml
    with:
      legs: '[{"name":"browser tests","files":"/"}]'

  # The viewer draws doors and windows from their saved meshes by default, on
  # the condition (Griffin, 2026-10-30) that its memory and load time are
  # measured in Playwright on the reference models. The figures are for
  # reading and the spec asserts behaviour; `CI passed` does not wait for it
  # (it took 12 minutes of every pull request's), but the deploy does.
  measure:
    permissions:
      contents: read
    uses: $/.github/workflows/viewer-test.yml
    with:
      legs: '[{"name":"saved-mesh measurement","measure":true}]'

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [build, tests, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      pages: write
      id-token: write
      checks: read
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # C3: wait for CI on this commit. A commit whose every file CI's push
      # filter ignores runs no CI, and deploys at once.
      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # Each API call is retried with backoff: a GitHub 5xx (a 502 on
        # 2026-11-04 failed the v0.14.0 deploy) is not a verdict on the
        # commit. A call that still fails ends the step, so the deploy
        # never goes ahead without CI's answer.
        run: |
          api() {
            local try out
            for try in 1 2 3 4 5 6; do
              if out=$(gh api "$@"); then printf '%s\n' "$out"; return 0; fi
              [ "$try" -eq 6 ] && break
              echo "gh api $1 failed (try ${try}); retrying" >&2
              sleep $((try * 10))
            done
            echo "gh api $1 failed 6 times" >&2
            return 1
          }
          # Every page of the commit's files (the endpoint returns 300 a
          # page). A commit that lists no file gives one empty line, which
          # the filter below does not ignore, so it waits for CI: closed.
          files=$(api --paginate "repos/${GH_REPO}/commits/${SHA}" --jq '.files[].filename') || {
            echo "::error::could not list the files of ${SHA}"; exit 1; }
          if ! grep -qvE '(\.md$|^docs/|^LICENSE|^\.gitignore$|^\.github/ISSUE_TEMPLATE/|^CITATION\.cff$)' <<<"$files"; then
            echo "CI's push filter skips this commit; deploying it"
            exit 0
          fi
          for _ in $(seq 1 80); do
            conclusion=$(api "repos/${GH_REPO}/commits/${SHA}/check-runs?check_name=CI%20passed" \
              --jq '[.check_runs[] | select(.status == "completed") | .conclusion] | first // ""') || {
              echo "::error::could not read CI's check run on ${SHA}"; exit 1; }
            case "$conclusion" in
              success) echo "CI passed on ${SHA}"; exit 0 ;;
              "") sleep 60 ;;
              *) echo "::error::CI concluded ${conclusion} on ${SHA}; not publishing it"; exit 1 ;;
            esac
          done
          echo "::error::CI did not finish on ${SHA} within 80 minutes"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
