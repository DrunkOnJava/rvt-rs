name: Deploy viewer

# VW1-18 — build the WASM + the Vite site and publish to
# https://drunkonjava.github.io/rvt-rs/ via GitHub Pages (Pages root;
# the old `/viewer/` sub-path 404s).
# Runs on every push to main that touches viewer/, src/ or rvt-wasm/ (so
# the WASM stays fresh), plus manual runs. It builds and publishes the site,
# runs the browser tests and measures the viewer with and without saved meshes,
# on the release WASM it publishes: `build` builds that WASM once and uploads
# it, `tests` and `measure` download it and test it, and the site is built from
# the same file. All three print its sha256, so a run shows that they match,
# and each checks that the site it builds holds that file (#1457); they used
# to build it three times, and tested builds of their own.
# The browser tests are viewer-test.yml's: ci.yml runs them as part of
# `CI passed` (#1374), so a pull request cannot merge before they have passed
# on its head. To check a draft's viewer, dispatch viewer-test.yml on its
# branch.
#
# C3: the viewer is published only from a commit whose CI passed, the browser
# tests included. The deploy job waits for CI's `CI passed` check on the pushed
# commit; a commit CI's push filter skips (only docs, Markdown and the like,
# such as a demo-catalog change, whose pull request ran the tests) deploys
# without it. Only the deploy job can write to Pages.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rvt-wasm/**'
      - 'viewer/**'
      - 'docs/viewer-demos.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-viewer.yml'
      # viewer-test.yml is what `tests` and `measure` run, and .github/actions
      # holds fetch-corpus, which `build` uses: a change to either changes what
      # this workflow builds or tests, and the run on the release WASM would
      # otherwise wait for the next change to src/ or viewer/.
      - '.github/workflows/viewer-test.yml'
      - '.github/actions/**'
  workflow_dispatch:

# Read-only by default; only the deploy job below can write to Pages (C3).
# The build job runs pnpm dependencies, and holds no write scope.
permissions:
  contents: read

# One build per ref; pushes to main queue. The deploy job below serialises on
# the Pages group.
concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Longest 8.4 minutes in 15 runs.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Tier-1 + synthetic demos stage from in-repo corpus/tier1/ and
      # gen-fixture. The MIT magnetar project samples (Einhoven 2023, Core
      # Interior 2024) are staged from this checkout as real-project gallery
      # demos (sha256-pinned in docs/viewer-demos.json).
      - name: Checkout public project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus

      - name: Install Rust toolchain
        uses: $/.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: viewer-wasm
          cache-directories: target-native

      - name: Install wasm-pack and the locked wasm-bindgen
        uses: $/.github/actions/wasm-tools

      - name: Build WASM, and gen-fixture beside it
        shell: bash
        # The bindings are their own crate, rvt-wasm (C6). `--out-dir` is
        # relative to that crate, so `../viewer/pkg` writes straight into the
        # viewer; `--out-name rvt` keeps the files `rvt.js` and
        # `rvt_bg.wasm`.
        #
        # gen-fixture generates the synthetic-mvp demo, and the browser tests
        # stage it too. It is built with the CI profile (the release profile's
        # full LTO rebuilt the crate from scratch: 39 s) in a target directory
        # of its own, at the same time as the WASM and inside its build time,
        # as viewer-test.yml builds it. The stager finds the binary on PATH.
        # rvt-elements is built with it, for tests/parameters-row.spec.ts (#35).
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-native" cargo build --profile ci --bin gen-fixture --bin rvt-elements &
          fixture=$!
          wasm-pack build rvt-wasm --target web --out-dir ../viewer/pkg --out-name rvt
          wait "${fixture}"
          echo "${GITHUB_WORKSPACE}/target-native/ci" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          # The pnpm store, keyed on the lockfile (C6).
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      # Every import of the wasm, by name and by the body of its shim in the
      # glue; the script says why a name alone is not enough.
      - name: Verify no network imports in wasm (VW1-21)
        working-directory: viewer
        run: node scripts/audit-wasm-imports.mjs

      # The build `tests` and `measure` download: wasm-pack's output, gen-fixture
      # and the WASM's sha256, in the layout viewer-test.yml's `build` job
      # writes. It is uploaded here, before anything is staged or built on it,
      # and the site below is built from this same viewer/pkg.
      - name: Collect the build, and print the WASM's sha256
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/viewer-build"
          mkdir -p "${dir}/bin"
          cp -R viewer/pkg "${dir}/pkg"
          cp target-native/ci/gen-fixture "${dir}/bin/gen-fixture"
          cp target-native/ci/rvt-elements "${dir}/bin/rvt-elements"
          (cd "${dir}" && sha256sum pkg/rvt_bg.wasm > wasm.sha256)
          sha=$(cut -d' ' -f1 "${dir}/wasm.sha256")
          echo "WASM sha256 ${sha}"
          echo "WASM sha256: ${sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the WASM and gen-fixture for the tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: viewer-build-release
          path: ${{ runner.temp }}/viewer-build
          if-no-files-found: error
          # A rerun of every job uploads under the name of the first attempt.
          overwrite: true
          retention-days: 3

      - name: Install dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile

      - name: Stage redistributable demos
        working-directory: viewer
        run: pnpm run stage:demos

      - name: Build viewer
        working-directory: viewer
        run: pnpm run build

      # The site is what gets published: it must hold the bytes that were
      # uploaded for the tests, and this fails the build, and so the deploy,
      # when it does not. The legs check their own site the same way.
      - name: The site holds the WASM that was uploaded
        run: tools/ci/check-wasm-in-site.sh "${RUNNER_TEMP}/viewer-build/wasm.sha256" viewer/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: viewer/dist

  # The browser tests again, on the release WASM that `build` uploaded and
  # this workflow publishes: ci.yml's `viewer` job tests the faster build
  # without LTO, which is what a pull request waits for. One leg, since
  # nothing waits for it but the deploy, which waits for `CI passed` as long.
  # `needs: build` is what makes the artifact exist, and the call builds
  # nothing: it tests the bytes that are published.
  tests:
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/viewer-test.yml
    with:
      legs: '[{"name":"browser tests","files":"/"}]'
      wasm_artifact: viewer-build-release

  # The viewer draws doors and windows from their saved meshes by default, on
  # the condition (Griffin, 2026-10-30) that its memory and load time are
  # measured in Playwright on the reference models. The figures are for
  # reading and the spec asserts behaviour; `CI passed` does not wait for it
  # (it took 12 minutes of every pull request's), but the deploy does.
  measure:
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/viewer-test.yml
    with:
      legs: '[{"name":"saved-mesh measurement","measure":true}]'
      wasm_artifact: viewer-build-release

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [build, tests, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      pages: write
      id-token: write
      checks: read
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # C3: wait for CI on this commit (.github/actions/wait-for-check, which
      # the release preflight uses too). A commit whose every file CI's push
      # filter ignores runs no CI, and deploys at once.
      - name: Wait for CI on the commit
        uses: $/.github/actions/wait-for-check
        with:
          sha: ${{ github.sha }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
