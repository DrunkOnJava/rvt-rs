# CodeQL for every language in the repository, Rust included (C3).
#
# The repository's CodeQL default setup scanned Actions, JavaScript and
# TypeScript, and Python, and could not be pointed at Rust: the API offers no
# `rust` language for default setup. This advanced setup replaces it. Every
# language here builds with `build-mode: none`, so no compile step runs.
#
# A pull request is analysed once it is ready, not on every push of a draft:
# that was 185 runs and 1,630 job-minutes in one day (#1457), Analyze (rust)
# 6.9 minutes of each run. Landing still waits for it (arm.sh does not arm a
# head with a pending check), so `ready_for_review` starts it on the head the
# watcher marks ready, and a push to a ready pull request starts it again.
# A draft's run has every job skipped. A pull request that
# changes only documentation (nothing under these paths is a language
# CodeQL analyses here) starts no run, so it has no CodeQL check to wait for
# and no head analysis; `main` is still analysed on every push, so its
# baseline stays current.
#
# A failed upload of the results is tried once more (#1499). `analyze` used to
# upload its own SARIF, and the upload failed once with no finding, the log
# ending at "Uploading results" (run 42128776536, Analyze (rust), on #1468), as
# Scorecard's and zizmor's did; arm.sh refuses a head with a red check, so the
# landing waited for a hand rerun. Now `analyze` writes the SARIF and does not
# upload it, a step of its own uploads it and may fail without failing the job,
# and the failure leaves the SARIF as an artifact. The retry is the job
# `analyze-retry`: codeql-action refuses a second upload of one category in a
# job (upload-lib.ts exports a sentinel into the job's GITHUB_ENV before it
# sends anything), so a second step in the same job would fail at once whatever
# the first died of. A real rejection of the file fails the retry, and the run.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is not in the default set: without it, marking a
    # draft ready would run nothing on its head.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reports/**"
      - "changelog.d/**"
  schedule:
    # Weekly, as the default setup ran: Mondays at 05:41 UTC.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    # Longest 8.3 minutes (the Rust leg) in 15 runs, the other languages 1.5 or less.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # `upload: failure-only` writes the SARIF to `output`, with the category
      # already in it (analyze passes it to the CLI), and does not upload it: at
      # the pinned commit analyze sends the results only for `always`, and only
      # an upload sets the one-category-per-job sentinel. Unlike `never`, which
      # analyze's own action.yml calls not recommended, it keeps codeql-action's
      # upload of the diagnostics of a run whose analysis itself fails
      # (init-action-post-helper.ts, `prepareFailedSarif`, skips that for
      # `never`). The overlay base database on `main` is still saved by this
      # step.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif
      # The upload analyze did itself, with the same category. It waits for
      # processing as analyze did, so a file code scanning rejects fails here.
      - name: Upload the results to code scanning
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: "/language:${{ matrix.language }}"
      # Only a failed upload leaves one: `analyze-retry` uploads what it finds.
      # The artifact also keeps the file for whoever looks into a rejection.
      # `overwrite` lets "Re-run all jobs" replace the one an earlier attempt of
      # the run left, which would otherwise fail this step (an artifact name is
      # taken once per run).
      - name: Keep the SARIF for the retry
        if: steps.sarif.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Uploads once more the results of each language whose upload failed. A matrix
  # job's outputs are one set shared by its legs, so the legs cannot say which of
  # them failed: the artifacts do. Each carries one SARIF, named by the CodeQL
  # language (javascript-typescript's is javascript.sarif), and the steps below
  # are one per language. The analysis key is held at the one `analyze` has
  # (`CODEQL_ACTION_ANALYSIS_KEY`, which the action reads before it asks the API
  # for it), the category is the leg's, and the matrix input is what the leg's
  # `toJson(matrix)` is (written out: zizmor reads `toJson(fromJSON(..))` as
  # obfuscation), so that the retried upload is the same configuration in code
  # scanning and leaves no second one holding alerts the next run closes.
  # With nothing to retry the job does a checkout and an empty download.
  #
  # Each language's step runs whatever an earlier one did (`!cancelled()`), so a
  # rejected file does not leave the next language's results unuploaded; the job
  # still fails, and so does the run. The last step fails on a SARIF no step
  # uploads, so a language added to `analyze`'s matrix and not here cannot pass
  # with its kept results unsent. A re-run of the run (all jobs) can find an
  # artifact an earlier attempt left and upload that file again: the same commit
  # and category replace it.
  #
  # On a pull request the retried upload skips the post-filter that drops alerts
  # outside the diff (`filterAlertsByDiffRange` reads the leg's own RUNNER_TEMP),
  # which the first attempt, in the leg's job, applies; the query-time
  # `restrictAlertsTo` of the diff-informed analysis still narrows the file.
  analyze-retry:
    name: Analyze upload retry
    needs: analyze
    if: ${{ !cancelled() && needs.analyze.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
      # With the analysis key set, the only call upload-sarif makes about the run
      # (GET .../actions/runs/{id}, in api-client.ts `getWorkflowRelativePath`)
      # is not made, so `actions: read` is not held.
      security-events: write # the upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pattern that matches nothing downloads nothing and is not an error;
      # `merge-multiple` puts the files of every match in one directory whatever
      # their number (one match alone is otherwise not put in a directory of its
      # own).
      - name: Download the SARIF of each failed upload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: codeql-sarif-*
          merge-multiple: true
          path: retry
      - name: Say which uploads failed
        if: hashFiles('retry/*.sarif') != ''
        shell: bash
        run: |
          for file in retry/*.sarif; do
            echo "::warning::the upload of CodeQL's results for $(basename "$file" .sarif) to code scanning failed; trying once more"
          done
      - name: Upload the actions results to code scanning (retry)
        if: ${{ !cancelled() && hashFiles('retry/actions.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
        with:
          sarif_file: retry/actions.sarif
          category: /language:actions
          matrix: |-
            {
              "language": "actions"
            }
      - name: Upload the javascript-typescript results to code scanning (retry)
        if: ${{ !cancelled() && hashFiles('retry/javascript.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
        with:
          sarif_file: retry/javascript.sarif
          category: /language:javascript-typescript
          matrix: |-
            {
              "language": "javascript-typescript"
            }
      - name: Upload the python results to code scanning (retry)
        if: ${{ !cancelled() && hashFiles('retry/python.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
        with:
          sarif_file: retry/python.sarif
          category: /language:python
          matrix: |-
            {
              "language": "python"
            }
      - name: Upload the rust results to code scanning (retry)
        if: ${{ !cancelled() && hashFiles('retry/rust.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
        with:
          sarif_file: retry/rust.sarif
          category: /language:rust
          matrix: |-
            {
              "language": "rust"
            }
      # A kept SARIF is covered when this file has a step that uploads it, which
      # the checkout above holds (the workflow of this run: a pull request's
      # merge commit is both).
      - name: Fail on a SARIF no step above uploads
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          for file in retry/*.sarif; do
            if ! grep -qF "sarif_file: ${file}" .github/workflows/codeql.yml; then
              echo "::error::${file} is kept results that no step of this job uploads: add one for its language, as the steps above do"
              status=1
            fi
          done
          exit "$status"
