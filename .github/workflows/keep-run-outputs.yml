# Keep a Measure run's small scored outputs past the 90 days GitHub keeps its artifacts (#2124).
#
# The evidence pages cite Measure runs by id. This copies what those citations read from a run's
# `measure-head`, `measure-base`, `measure-verdict`, `compare-scorer-diff` and `measure-timing`
# artifacts (scorer outputs, export digests, export diagnostics, timings and the verdict;
# tools/ci/keep-run-outputs.py says which and why) into a commit of their own, with no parent, and
# pushes it to `refs/evidence/<run id>`. A ref outside refs/heads and refs/tags is not fetched by a
# clone, so the kept outputs cost a clone nothing. A citation links to the kept file that holds its
# figure, as plain text: https://raw.githubusercontent.com/DrunkOnJava/rvt-rs/<commit>/<path>
# (Griffin, 2026-11-22). GitHub's own page for a commit on no branch and no tag warns that it "does
# not belong to any branch".
# research/kept-runs.tsv lists each kept run and its commit, added by a pull request after the run.
#
# Trust. Only a workflow_dispatch run of measure.yml in this repository is kept: a pull request
# from a fork runs its own measure.yml and controls its whole artifact, and a kept copy is public
# for as long as its ref exists. The outputs are read as files and passed to no shell. Every file
# kept is scanned, before anything is pushed, with the PII guard's patterns and for the name of any
# model folder left out, and an existing ref is never overwritten: to keep a run again, delete its
# ref first.

name: Keep run outputs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The Measure run whose outputs are kept
        required: true

permissions: {}

concurrency:
  group: keep-run-outputs-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  keep:
    name: Keep the run's outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # the Measure run's artifact
      contents: write # the refs/evidence ref
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci/keep-run-outputs.py
            research/holdout-models.tsv
            research/holdout-archive-models.tsv
          sparse-checkout-cone-mode: false
      - name: Keep the outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a run id"
            exit 1
          fi
          read -r head_repo run_event run_path < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[(.head_repository.full_name // "unknown"), .event, .path] | @tsv')
          if [ "$run_event" != workflow_dispatch ] || [ "$head_repo" != "$REPO" ] || [ "$run_path" != .github/workflows/measure.yml ]; then
            echo "::error::run $RUN_ID is a $run_event run of $run_path in $head_repo: only a workflow_dispatch run of measure.yml in $REPO is kept"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/$REPO"
          if git -c "http.extraheader=$auth" ls-remote --exit-code "$remote" "refs/evidence/$RUN_ID" > /dev/null; then
            echo "::error::refs/evidence/$RUN_ID exists; delete it first to keep the run again"
            exit 1
          fi
          names=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
          found=0
          for name in measure-head measure-base measure-verdict compare-scorer-diff measure-timing; do
            if grep -qx "$name" <<< "$names"; then
              gh run download "$RUN_ID" --repo "$REPO" -n "$name" -D "$RUNNER_TEMP/in/$name"
              found=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::run $RUN_ID has no artifact left to keep"
            exit 1
          fi
          python3 tools/ci/keep-run-outputs.py "$RUNNER_TEMP/in" "$RUNNER_TEMP/out" --run "$RUN_ID" --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/out"
          git init -q -b kept
          git add -A
          GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit -q -m "Measure run $RUN_ID: kept outputs (#2124)"
          commit=$(git rev-parse HEAD)
          echo "files in the commit: $(git ls-tree -r HEAD --name-only | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          git -c "http.extraheader=$auth" push "$remote" "HEAD:refs/evidence/$RUN_ID"
          echo "kept run $RUN_ID as refs/evidence/$RUN_ID, commit $commit: https://raw.githubusercontent.com/$REPO/$commit/KEPT.md" | tee -a "$GITHUB_STEP_SUMMARY"
