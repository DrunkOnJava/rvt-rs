# Keep a Measure run's small scored outputs past the 90 days GitHub keeps its artifacts (#2124).
#
# The evidence pages cite Measure runs by id. This copies what those citations read from a run's
# `measure-head`, `measure-base`, `measure-verdict`, `compare-scorer-diff`, `measure-timing` and
# `measure-pairs` artifacts (scorer outputs, export digests, export diagnostics, timings and the verdict;
# tools/ci/keep-run-outputs.py says which and why) into a commit of their own, with no parent, and
# pushes it to `refs/evidence/<run id>`. A ref outside refs/heads and refs/tags is not fetched by a
# clone, so the kept outputs cost a clone nothing. A citation links to the kept file that holds its
# figure, as plain text: https://raw.githubusercontent.com/DrunkOnJava/rvt-rs/<commit>/<path>
# (Griffin, 2026-11-22). GitHub's own page for a commit on no branch and no tag warns that it "does
# not belong to any branch".
# research/kept-runs.tsv lists each kept run and its commit, added by a pull request after the run.
# With `part: probes` it keeps only the probes' own output, which the first keeping leaves out, as
# `refs/evidence/<run id>-probes` beside it: a figure only a probe prints is cited from there, and
# the first kept commit, which citations already link to, is never replaced. With `part: holdout`
# it keeps each held-out model's `counts.txt`, Measure's own summary counts, as
# `refs/evidence/<run id>-holdout`, so that the held-out figures the evidence pages cite keep a
# source (Griffin, 2026-11-22). With `part: log` it keeps the lines of a run's log that the `lines`
# pattern finds, as `refs/evidence/<run id>-log`, for a figure a run prints only to its log, such as
# a viewer test's measurement (#2148); that part takes a run of any workflow of this repository.
#
# Trust. Only a workflow_dispatch run of measure.yml in this repository is kept: a pull request
# from a fork runs its own measure.yml and controls its whole artifact, and a kept copy is public
# for as long as its ref exists. The log part takes a finished run of this repository that is not a
# pull request's, since a pull request's run prints what its own branch's code chose to. The outputs are read as files and passed to no shell. Every file
# kept is scanned, before anything is pushed, with the PII guard's patterns and for the name of any
# model folder left out, and an existing ref is never overwritten: to keep a run again, delete its
# ref first.

name: Keep run outputs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The run whose outputs are kept (a Measure run, but for the log part)
        required: true
      part:
        description: outputs (the scored outputs), probes (the probes' own output), holdout (the held-out models' summary counts) or log (the log lines `lines` finds), the last three kept beside the first
        type: choice
        options: [outputs, probes, holdout, log]
        default: outputs
      lines:
        description: For the log part only, a Python regular expression; the lines of the run's log it finds are kept
        required: false
        default: ""

permissions: {}

concurrency:
  group: keep-run-outputs-${{ inputs.run_id }}-${{ inputs.part }}
  cancel-in-progress: false

jobs:
  keep:
    name: Keep the run's outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # the Measure run's artifact
      contents: write # the refs/evidence ref
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci/keep-run-outputs.py
            research/holdout-models.tsv
            research/holdout-archive-models.tsv
          sparse-checkout-cone-mode: false
      - name: Keep the outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          PART: ${{ inputs.part }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a run id"
            exit 1
          fi
          case "$PART" in
            outputs) ref="refs/evidence/$RUN_ID"; artifacts="measure-head measure-base measure-verdict compare-scorer-diff measure-timing measure-pairs" ;;
            probes) ref="refs/evidence/$RUN_ID-probes"; artifacts="measure-head measure-base" ;;
            holdout) ref="refs/evidence/$RUN_ID-holdout"; artifacts="measure-head measure-base" ;;
            log) ref="refs/evidence/$RUN_ID-log"; artifacts="" ;;
            *) echo "::error::part must be outputs, probes, holdout or log"; exit 1 ;;
          esac
          if [ "$PART" = log ] && [ -z "$LINES" ]; then
            echo "::error::the log part needs lines, the pattern of the lines to keep"
            exit 1
          fi
          read -r head_repo run_event run_path run_status < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[(.head_repository.full_name // "unknown"), .event, .path, .status] | @tsv')
          if [ "$PART" = log ]; then
            if [ "$head_repo" != "$REPO" ] || [[ "$run_event" == pull_request* ]] || [ "$run_status" != completed ]; then
              echo "::error::run $RUN_ID is a $run_status $run_event run of $run_path in $head_repo: the log part keeps a finished run of $REPO that is not a pull request's"
              exit 1
            fi
          elif [ "$run_event" != workflow_dispatch ] || [ "$head_repo" != "$REPO" ] || [ "$run_path" != .github/workflows/measure.yml ]; then
            echo "::error::run $RUN_ID is a $run_event run of $run_path in $head_repo: only a workflow_dispatch run of measure.yml in $REPO is kept"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/$REPO"
          if git -c "http.extraheader=$auth" ls-remote --exit-code "$remote" "$ref" > /dev/null; then
            echo "::error::$ref exists; delete it first to keep the run again"
            exit 1
          fi
          if [ "$PART" = log ]; then
            mkdir -p "$RUNNER_TEMP/in"
            gh run view "$RUN_ID" --repo "$REPO" --log > "$RUNNER_TEMP/in/run.log"
            python3 tools/ci/keep-run-outputs.py "$RUNNER_TEMP/in" "$RUNNER_TEMP/out" --run "$RUN_ID" --part log --lines "$LINES" --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            names=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
            found=0
            for name in $artifacts; do
              if grep -qx "$name" <<< "$names"; then
                gh run download "$RUN_ID" --repo "$REPO" -n "$name" -D "$RUNNER_TEMP/in/$name"
                found=1
              fi
            done
            if [ "$found" = 0 ]; then
              echo "::error::run $RUN_ID has no artifact left to keep"
              exit 1
            fi
            python3 tools/ci/keep-run-outputs.py "$RUNNER_TEMP/in" "$RUNNER_TEMP/out" --run "$RUN_ID" --part "$PART" --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cd "$RUNNER_TEMP/out"
          git init -q -b kept
          git add -A
          GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit -q -m "Run $RUN_ID: kept $PART (#2124)"
          commit=$(git rev-parse HEAD)
          echo "files in the commit: $(git ls-tree -r HEAD --name-only | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          git -c "http.extraheader=$auth" push "$remote" "HEAD:$ref"
          echo "kept run $RUN_ID's $PART as $ref, commit $commit: https://raw.githubusercontent.com/$REPO/$commit/KEPT.md" | tee -a "$GITHUB_STEP_SUMMARY"
