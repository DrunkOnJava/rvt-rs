name: Publish (crates.io + PyPI + release binaries)

# Triggered on tag pushes matching `v*` (e.g. v0.1.2, v0.2.0) and on
# manual `workflow_dispatch`. NOT on every push to main — this is the
# release path, intentionally separate from CI so day-to-day commits
# don't spin up Windows wheel builds for nothing.
#
# Two publish targets (Q-10):
#
#   1. crates.io — the Rust registry. `cargo publish` uses
#      `CARGO_REGISTRY_TOKEN` (repo secret).
#   2. PyPI — the Python package index. Trusted-publisher OIDC
#      (no secret needed after one-time account setup).
#
# Release publication runs only after wheel install, source install,
# CLI sample, viewer load, and docs preview checks pass. Real PyPI
# publication also waits for crates.io publication so the two package
# channels cannot split-brain on a rejected Rust crate.
#
# Uses PyPI's Trusted Publisher feature (OIDC): no PYPI_API_TOKEN
# secret is stored in the repo. PyPI trusts this specific workflow
# (DrunkOnJava/rvt-rs / publish.yml / environment: pypi) to upload
# releases, and rejects any other source.
#
# One-time PyPI setup (Griffin, after creating the project):
#
#   1. Claim the `rvt` project name at https://pypi.org/manage/account/publishing/
#   2. Add a trusted publisher:
#        - PyPI project name: rvt
#        - Owner: DrunkOnJava
#        - Repo: rvt-rs
#        - Workflow file: publish.yml
#        - Environment: pypi
#   3. Optionally add a TestPyPI trusted publisher the same way so
#      `workflow_dispatch -> test-pypi: true` works for dry runs.
#
# Once that's done: `git tag v0.1.2 && git push origin v0.1.2`
# triggers the full wheel build matrix and uploads to PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test-pypi:
        description: "Also publish to TestPyPI after release verification"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Build release wheels on every target OS. Mirrors the python-wheel
  # matrix in ci.yml so any regression that would fail a push-CI run
  # also fails here, before we publish.
  #
  # One abi3 wheel per platform, the same platforms the CLI archives
  # cover plus musllinux. Linux wheels build inside the manylinux2014 /
  # musllinux_1_2 containers (`manylinux:`), so they need glibc 2.17 or
  # musl 1.2 rather than whatever glibc the runner has: 0.2.0's host-built
  # wheel came out manylinux_2_35 and pip fell back to the Rust sdist on
  # RHEL 9, Amazon Linux 2023 and Debian 11.
  build-wheels:
    name: Build wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    steps:
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: runner.os != 'Linux'
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && matrix.target || '' }}

      # abi3-py38 means one wheel per OS/arch covers every Python
      # >= 3.8. No per-Python-minor-version matrix needed.
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          # Only read on Linux, where it selects the build container.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # SEC-12/13: wheel sources now come from the `rvt-py/`
          # workspace member crate. The `--features python` switch
          # is gone because `rvt-py` is a pyo3-only crate with no
          # optional feature gating.
          args: --release --out dist --manifest-path rvt-py/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # Source distribution — built once on Linux. PyPI recommends always
  # shipping an sdist alongside wheels so downstream packagers (conda,
  # Debian, nixpkgs) can build from source if needed.
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Q-13: smoke-test every built wheel before uploading anywhere.
  # Installs each wheel in a throwaway venv and imports the `rvt`
  # module + instantiates a minimal `RevitFile` object; if any wheel
  # fails to install or the import blows up, the release is aborted
  # before TestPyPI or PyPI sees it. Cheap insurance against a
  # broken release reaching users (TestPyPI round-trip would catch
  # install but not import-time errors).
  validate-wheel-install:
    name: Install + open a model / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [build-wheels]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux wheels are installed in the oldest environment their tag
          # claims: the manylinux2014 image (glibc 2.17) with the oldest
          # CPython it still ships, and Alpine (musl).
          - { name: linux-x86_64, os: ubuntu-latest, image: "quay.io/pypa/manylinux2014_x86_64", python: oldest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux2014_aarch64", python: oldest }
          - { name: musllinux-x86_64, os: ubuntu-latest, image: "python:3.12-alpine", python: python3 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, image: "python:3.12-alpine", python: python3 }
          - { name: macos-arm64, os: macos-latest }
          # The x86_64 macOS wheel is cross-built on arm64; this is the
          # Intel runner that proves it loads.
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            corpus/tier1
            tools/ci/wheel-smoke.py
          sparse-checkout-cone-mode: false
      - name: Download wheel for this platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-${{ matrix.name }}
          path: wheel
      - name: Install and open a model in the target Linux environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e PY="${{ matrix.python }}" "${{ matrix.image }}" sh -c '
            set -e
            if [ "$PY" = oldest ]; then
              # /opt/python holds one directory per CPython; skip the
              # free-threaded builds (cp313-cp313t), which abi3 does not cover.
              PY=$(ls -d /opt/python/cp3*-cp3*[0-9]/bin/python | sort -V | head -n 1)
            fi
            "$PY" -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --quiet wheel/*.whl
            /tmp/venv/bin/python tools/ci/wheel-smoke.py corpus/tier1/architectural-2024/architectural-2024.rvt
          '
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Install and open a model
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/venv/Scripts/python"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install --quiet wheel/*.whl
          "$py" tools/ci/wheel-smoke.py corpus/tier1/architectural-2024/architectural-2024.rvt

  release-source-smoke:
    name: Cargo install + CLI sample smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch sample corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phi-ag/rvt
          path: _corpus
          lfs: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: ci-release
      - name: Install crate from release source
        run: cargo install --path . --locked --root /tmp/rvt-release-install
      - name: Run CLIs on sample file
        env:
          RVT_SAMPLE: ${{ github.workspace }}/_corpus/examples/Autodesk/racbasicsamplefamily-2024.rfa
          RVT_BIN: /tmp/rvt-release-install/bin
        run: |
          set -euo pipefail
          "${RVT_BIN}/rvt-inspect" --version
          "${RVT_BIN}/rvt-info" "${RVT_SAMPLE}"
          "${RVT_BIN}/rvt-inspect" "${RVT_SAMPLE}" --json > /tmp/rvt.inspect.json
          "${RVT_BIN}/rvt-ifc" "${RVT_SAMPLE}" \
            -o /tmp/rvt.ifc \
            --diagnostics /tmp/rvt.diagnostics.json
          test -s /tmp/rvt.inspect.json
          test -s /tmp/rvt.ifc
          test -s /tmp/rvt.diagnostics.json

  docs-rs-preview:
    name: docs.rs build preview
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: ci-docs-rs
      - name: Build docs with warnings denied
        run: cargo +nightly doc --no-deps --all-features -p rvt

  viewer-release-smoke:
    name: Viewer artifact load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same corpus and sample as deploy-viewer.yml: viewer-regression.spec.ts's
      # projectSampleTest asserts Einhoven-specific facts (storey/material
      # counts, level names), so feeding it a family file can never pass.
      - name: Fetch project corpus (magnetar MIT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
          lfs: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: viewer-wasm
      - name: Install wasm-pack
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: wasm-pack@0.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Build WASM package
        run: |
          wasm-pack build --target web --out-dir viewer/pkg -- --features wasm --no-default-features
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci
      - name: Build gen-fixture for the synthetic demo
        run: cargo build --release --bin gen-fixture
      - name: Stage redistributable demos
        working-directory: viewer
        run: npm run stage:demos
      - name: Install Playwright Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium
      # wasm-objdump makes wasm-no-network-imports.spec.ts run instead of
      # skip, so the release path carries the same VW1-21 gate as deploy.
      - name: Install wabt (for Import-table audit)
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Build viewer
        working-directory: viewer
        run: npm run build
      - name: Verify viewer loads sample without network regressions
        working-directory: viewer
        env:
          RVT_VIEWER_SAMPLE: ../_project_corpus/Revit/Revit_IFC5_Einhoven.rvt
        run: npm run test:network

  # Prebuilt CLI archives for Linux (static musl, x86_64 + arm64), macOS
  # (arm64 + x86_64) and Windows (x86_64), checksummed and attached to the
  # tag's GitHub Release — see release-binaries.yml. Gated on the source
  # smoke test only, so a crates.io or PyPI hiccup never withholds the
  # binaries from people who just need to read a Revit file.
  release-binaries:
    name: Release binaries
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - release-source-smoke
    permissions:
      contents: write
      # The image job pushes the container to ghcr.io.
      packages: write
      # Build-provenance attestations for the archives and the image.
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      upload: true
      tag: ${{ github.ref_name }}

  # Q-10: crates.io publish. Runs BEFORE the PyPI publish so if the
  # crate is rejected (yanked name conflict, verify-failure, etc.)
  # the Python side doesn't ship with a mismatched version. Requires
  # the repo secret `CARGO_REGISTRY_TOKEN` (set once via
  # https://github.com/DrunkOnJava/rvt-rs/settings/secrets/actions).
  # On manual workflow_dispatch, the crates.io step is skipped
  # (there's no TestPyPI equivalent for crates.io — the registry
  # doesn't offer a test/staging environment).
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
    # Don't re-publish when the user explicitly asked for TestPyPI-only.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: ci-release
      # Verify the Cargo.toml version matches the git tag — prevents
      # mismatched publishes where the tag says v0.1.3 but the crate
      # goes out as 0.1.2 (or vice versa). Compare `pkgid` output to
      # the tag, strip the leading "v".
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          crate_version=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "::error::tag v$tag_version does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "version match: $tag_version"
      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Default features only. `--all-features` would enable
        # `wasm`, which requires wasm-bindgen / serde-wasm-bindgen
        # in a way that shouldn't be forced on `cargo add rvt`
        # users. The pyo3 bindings are in the separate `rvt-py`
        # member crate (SEC-12/13), which has `publish = false`
        # and ships via maturin to PyPI instead.
        #
        # A missing token is a configuration gap, not a rejected crate:
        # skip with a warning so PyPI and the release still ship, and the
        # release notes record `crates.io: NOT PUBLISHED`
        # (docs/release-0.2.0-plan.md). A crate the registry rejects still
        # fails this job and keeps PyPI from publishing a mismatched version.
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not configured; crates.io publish skipped. Record 'crates.io: NOT PUBLISHED' in the release notes."
            exit 0
          fi
          cargo publish -p rvt

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test-pypi }}
    needs:
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rvt
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the wheel and sdist artifacts. The release-binaries job in this
      # run uploads CLI archives that are also *.tar.gz; a download of every
      # artifact picks them up whenever they finish first (on v0.2.0 the
      # PyPI job downloaded seven seconds before the first one landed).
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Download the sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdist
          path: dist
      - name: List the distributions
        shell: bash
        run: |
          ls -la dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Real PyPI releases are tag-only and wait for crates.io publish to
  # succeed first. This prevents a split-brain release where the Python
  # package ships but the matching Rust crate was rejected.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
      - publish-crate
    environment:
      name: pypi
      url: https://pypi.org/p/rvt
    permissions:
      # `id-token: write` is the OIDC token needed for trusted
      # publishing. `contents: read` is the default. No other perms.
      id-token: write
      contents: read
    steps:
      # Only the wheel and sdist artifacts. The release-binaries job in this
      # run uploads CLI archives that are also *.tar.gz; a download of every
      # artifact picks them up whenever they finish first (on v0.2.0 the
      # PyPI job downloaded seven seconds before the first one landed).
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Download the sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdist
          path: dist
      - name: List the distributions
        shell: bash
        run: |
          ls -la dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # No `password:` — trusted publisher OIDC is auto-detected
          # when `id-token: write` is set and a trusted publisher
          # configuration exists on PyPI for this workflow.
          skip-existing: false
