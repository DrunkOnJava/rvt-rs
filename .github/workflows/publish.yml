name: Publish (crates.io + PyPI + release binaries)

# Triggered on tag pushes matching `v*` (e.g. v0.1.2, v0.2.0) and on
# manual `workflow_dispatch`. NOT on every push to main — this is the
# release path, intentionally separate from CI so day-to-day commits
# don't spin up Windows wheel builds for nothing.
#
# Two publish targets (Q-10):
#
#   1. crates.io — the Rust registry. Trusted Publishing (OIDC, C3):
#      rust-lang/crates-io-auth-action exchanges this run's identity for
#      a short-lived token, in the `crates-io` environment, which only
#      `v*` tags may deploy to. No registry token is stored.
#   2. PyPI — the Python package index. Trusted-publisher OIDC
#      (no secret needed after one-time account setup).
#
# Preflight (#1457) runs first and every other job waits for it, so a bad tag
# fails in seconds, before any wheel builds. For a tag push it requires:
#
#   - the tag is named vX.Y.Z (or vX.Y.Z-prerelease) and is annotated, not
#     lightweight, with a signature GitHub reports as verified for the tag
#     object, which names this tag and the commit this run is for;
#   - that commit is on main or on a hotfix/* branch;
#   - every version file says the tag's version: Cargo.toml, rvt-py, rvt-mcp,
#     rvt-wasm, the `=X.Y.Z` pins on rvt, viewer/package.json, CITATION.cff,
#     both lock files, a CHANGELOG.md section, and pyproject.toml leaving the
#     wheel's version to rvt-py/Cargo.toml (tools/ci/release_preflight.py);
#   - `CI passed` succeeded on that commit. A running CI is waited for, up to
#     80 minutes; a failed, cancelled or missing one stops the release, and
#     so does a commit whose every file CI's push filter skips (docs and the
#     like: CI never ran on it, and it could sit on a red commit). A
#     tag cannot be moved or deleted, so a red tag is fixed in a new commit
#     and a new version, or, for a flaky job, by re-running CI's failed jobs
#     and then this run's failed jobs (RELEASE.md).
#
# A workflow_dispatch run has no tag: the tag, signature, branch and CI checks
# say so and pass, and the version files must still agree with each other.
#
# Release publication runs only after wheel install, source install,
# CLI sample, viewer load, and docs preview checks pass. Real PyPI
# publication and the release binaries wait for crates.io publication, so
# no channel ships a version crates.io lacks. No approval is asked for:
# pushing a `v*` tag, which only a maintainer can create, is the release
# decision.
#
# A run that failed part way can be re-run (re-run failed jobs): the
# crates.io steps skip a version already there, and PyPI skips files already
# uploaded from the second attempt on.
#
# Uses PyPI's Trusted Publisher feature (OIDC): no PYPI_API_TOKEN
# secret is stored in the repo. PyPI trusts this specific workflow
# (DrunkOnJava/rvt-rs / publish.yml / environment: pypi) to upload
# releases, and rejects any other source.
#
# One-time PyPI setup (Griffin, after creating the project):
#
#   1. Claim the `rvt` project name at https://pypi.org/manage/account/publishing/
#   2. Add a trusted publisher:
#        - PyPI project name: rvt
#        - Owner: DrunkOnJava
#        - Repo: rvt-rs
#        - Workflow file: publish.yml
#        - Environment: pypi
#   3. Optionally add a TestPyPI trusted publisher the same way so
#      `workflow_dispatch -> test-pypi: true` works for dry runs.
#
# One-time crates.io setup (Griffin): on https://crates.io/crates/rvt/settings
# add a trusted publisher: GitHub, owner DrunkOnJava, repository rvt-rs,
# workflow publish.yml, environment crates-io. The MCP server's crate,
# `rvt-rs-mcp`, needs the same on https://crates.io/crates/rvt-rs-mcp/settings,
# and crates.io lets a trusted publisher be added only to a crate that
# exists, so that crate's first version is published by hand (RELEASE.md,
# step 8). The workflow publishes it only once the repository variable
# PUBLISH_RVT_RS_MCP is `true`, set after that first publish.
#
# Once both are in place, pushing a signed `v*` tag on main, or on a hotfix
# branch, publishes the release (RELEASE.md, steps 8 to 11, and its hotfix
# process).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test-pypi:
        description: "Also publish to TestPyPI after release verification"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time across every tag, never cancelled: two tags pushed
# together would otherwise run in parallel, and whichever image push finished
# last would take ghcr's `latest`. GitHub keeps one running and one pending
# run per group, and a newer run takes the pending one's place: a third tag
# pushed while two are queued cancels the second, which then needs
# `gh run rerun <id>` (cancel-in-progress: false protects only the running
# one). A dispatch publishes nowhere but TestPyPI, so it has groups of its
# own and can never displace a pending release.
# No job restores a cache: what is released is built from nothing a pull
# request's run could have written (zizmor cache-poisoning, C10).
concurrency:
  group: ${{ github.event_name == 'push' && 'publish-release' || format('publish-dispatch-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # What the header lists: refused in seconds, before a wheel builds, unless
  # the tag, its signature, its branch, the version files and CI on the tagged
  # commit are all right. The decisions are tools/ci/release_preflight.py's
  # (failure-first tests beside it); waiting for CI is the same composite
  # action Deploy viewer uses. The full history is fetched so the branch check
  # can ask whether origin/main or an origin/hotfix/* branch holds the commit.
  preflight:
    name: Preflight (tag, signature, branch, versions, CI)
    runs-on: ubuntu-24.04
    # The CI wait is 80 minutes at most; a bad tag fails long before that.
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag, signature, branch and version files
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 tools/ci/release_preflight.py check \
            --event "$EVENT" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$SHA"
      # A release is never tagged on a commit CI skipped: a docs-only commit
      # after a red one would otherwise read as having nothing to wait for and
      # ship the red commit's tree.
      - name: Wait for CI on the tagged commit
        if: ${{ github.event_name == 'push' }}
        uses: $/.github/actions/wait-for-check
        with:
          sha: ${{ github.sha }}
          docs-only-skips: "false"

  # Build release wheels on every target OS. Mirrors the python-wheel
  # platforms in ci.yml, so a regression that would fail a push-CI run
  # on any of them also fails here, before we publish. ci.yml builds a
  # smoke wheel without LTO; these are the wheels users get, at the
  # release profile (fat LTO, one codegen unit), so a failure that only
  # that profile shows is found here.
  #
  # One abi3 wheel per platform, the same platforms the CLI archives
  # cover plus musllinux. Linux wheels build inside the manylinux2014 /
  # musllinux_1_2 containers (`manylinux:`), so they need glibc 2.17 or
  # musl 1.2 rather than whatever glibc the runner has: 0.2.0's host-built
  # wheel came out manylinux_2_35 and pip fell back to the Rust sdist on
  # RHEL 9, Amazon Linux 2023 and Debian 11.
  build-wheels:
    name: Build wheel / ${{ matrix.name }}
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    # A release job must not die on its limit: each is 5 or more times the longest of its last 9 runs.
    # Windows leg longest 8.8 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64, manylinux: "2014" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: musllinux-x86_64, os: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-26, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-26, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-2025-vs2026, target: x64 }
    steps:
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        if: runner.os != 'Linux'
        uses: $/.github/actions/setup-rust
        with:
          target: ${{ runner.os == 'macOS' && matrix.target || '' }}

      # abi3-py38 means one wheel per OS/arch covers every Python
      # >= 3.8. No per-Python-minor-version matrix needed.
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          # Only read on Linux, where it selects the build container.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # SEC-12/13: wheel sources now come from the `rvt-py/`
          # workspace member crate. The `--features python` switch
          # is gone because `rvt-py` is a pyo3-only crate with no
          # optional feature gating.
          args: --release --out dist --manifest-path rvt-py/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # Source distribution — built once on Linux. PyPI recommends always
  # shipping an sdist alongside wheels so downstream packagers (conda,
  # Debian, nixpkgs) can build from source if needed.
  build-sdist:
    name: Build sdist
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Q-13: smoke-test every built wheel before uploading anywhere.
  # Installs each wheel in a throwaway venv and imports the `rvt`
  # module + instantiates a minimal `RevitFile` object; if any wheel
  # fails to install or the import blows up, the release is aborted
  # before TestPyPI or PyPI sees it. Cheap insurance against a
  # broken release reaching users (TestPyPI round-trip would catch
  # install but not import-time errors).
  validate-wheel-install:
    name: Install + open a model / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [preflight, build-wheels]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux wheels are installed in the oldest environment their tag
          # claims: the manylinux2014 image (glibc 2.17) with the oldest
          # CPython it still ships, and Alpine (musl).
          - { name: linux-x86_64, os: ubuntu-24.04, image: "quay.io/pypa/manylinux2014_x86_64", python: oldest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux2014_aarch64", python: oldest }
          - { name: musllinux-x86_64, os: ubuntu-24.04, image: "python:3.12-alpine", python: python3 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, image: "python:3.12-alpine", python: python3 }
          - { name: macos-arm64, os: macos-26 }
          # The x86_64 macOS wheel is cross-built on arm64; this is the
          # Intel runner that proves it loads.
          # macos-15-intel is GitHub's last Intel macOS image (C5). When it
          # retires, this wheel is cross-built on arm64 macOS
          # (--target x86_64-apple-darwin) and checked under Rosetta.
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2025-vs2026 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            corpus/tier1
            tools/ci/wheel-smoke.py
          sparse-checkout-cone-mode: false
      - name: Download wheel for this platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheel-${{ matrix.name }}
          path: wheel
      - name: Install and open a model in the target Linux environment
        if: runner.os == 'Linux'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          PY: ${{ matrix.python }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e PY "$IMAGE" sh -c '
            set -e
            if [ "$PY" = oldest ]; then
              # /opt/python holds one directory per CPython; skip the
              # free-threaded builds (cp313-cp313t), which abi3 does not cover.
              PY=$(ls -d /opt/python/cp3*-cp3*[0-9]/bin/python | sort -V | head -n 1)
            fi
            "$PY" -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --quiet wheel/*.whl
            /tmp/venv/bin/python tools/ci/wheel-smoke.py corpus/tier1/architectural-2024/architectural-2024.rvt
          '
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Install and open a model
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/venv/Scripts/python"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install --quiet wheel/*.whl
          "$py" tools/ci/wheel-smoke.py corpus/tier1/architectural-2024/architectural-2024.rvt

  release-source-smoke:
    name: Cargo install + CLI sample smoke
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Longest 12.2 minutes (cargo install from crates.io).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch sample corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
          cache: "false"
      - name: Install Rust stable
        uses: $/.github/actions/setup-rust
      - name: Install crate from release source
        run: cargo install --path . --locked --root /tmp/rvt-release-install
      # The MCP server is a crate of its own (rvt-mcp/); `cargo install` of
      # the source builds it too, and it answers server/discover.
      - name: Install the MCP server from release source
        run: cargo install --path rvt-mcp --locked --root /tmp/rvt-release-install
      - name: MCP server answers server/discover
        env:
          RVT_BIN: /tmp/rvt-release-install/bin
        run: |
          set -euo pipefail
          "${RVT_BIN}/rvt-rs-mcp" --version
          discover='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          reply="$({ printf '%s\n' "${discover}"; sleep 3; } | "${RVT_BIN}/rvt-rs-mcp")"
          case "${reply}" in
            *'"supportedVersions"'*'2026-07-28'*) ;;
            *) echo "::error::rvt-rs-mcp did not answer server/discover: ${reply}"; exit 1 ;;
          esac
      - name: Run CLIs on sample file
        env:
          RVT_SAMPLE: ${{ github.workspace }}/_corpus/examples/Autodesk/racbasicsamplefamily-2024.rfa
          RVT_BIN: /tmp/rvt-release-install/bin
        run: |
          set -euo pipefail
          "${RVT_BIN}/rvt-inspect" --version
          "${RVT_BIN}/rvt-info" "${RVT_SAMPLE}"
          "${RVT_BIN}/rvt-inspect" "${RVT_SAMPLE}" --json > /tmp/rvt.inspect.json
          "${RVT_BIN}/rvt-ifc" "${RVT_SAMPLE}" \
            -o /tmp/rvt.ifc \
            --diagnostics /tmp/rvt.diagnostics.json
          test -s /tmp/rvt.inspect.json
          test -s /tmp/rvt.ifc
          test -s /tmp/rvt.diagnostics.json

  # The same dated nightly and checks as ci.yml's docs-rs-preview, which every
  # pull request ran: a floating nightly let a regression no pull request saw
  # stop a release. Move both dates together when docs.rs needs a newer one.
  docs-rs-preview:
    name: docs.rs build preview
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly-2026-10-01
        uses: $/.github/actions/setup-rust
        with:
          toolchain: nightly-2026-10-01
      - name: Build docs with warnings denied
        run: cargo +nightly-2026-10-01 doc --no-deps --all-features -p rvt
      # docs.rs must mark the research modules as needing the feature.
      - name: Research modules carry the unstable-research banner
        run: grep -q 'unstable-research</code>' target/doc/rvt/research/index.html

  viewer-release-smoke:
    name: Viewer artifact load smoke
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Longest 15.8 minutes (v0.16.0's tag run, 42559733687).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same corpus and sample as deploy-viewer.yml: viewer-regression.spec.ts's
      # projectSampleTest asserts Einhoven-specific facts (storey/material
      # counts, level names), so feeding it a family file can never pass.
      - name: Fetch project corpus (magnetar MIT)
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
          cache: "false"
      - name: Install Rust stable
        uses: $/.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack and the locked wasm-bindgen
        uses: $/.github/actions/wasm-tools
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build WASM package
        run: |
          wasm-pack build rvt-wasm --target web --out-dir ../viewer/pkg --out-name rvt
      - name: Install viewer dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile
      # rvt-elements is built in the same invocation and put on PATH, as in
      # viewer-test.yml: tests/parameters-row.spec.ts runs it on the sample and
      # holds the panel's saved parameters to what it prints (#35). Without it
      # v0.16.0's tag run failed here, so that tag was never published.
      - name: Build gen-fixture for the synthetic demo, and rvt-elements
        run: |
          set -euo pipefail
          cargo build --release --bin gen-fixture --bin rvt-elements
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"
          "${GITHUB_WORKSPACE}/target/release/rvt-elements" --help >/dev/null
      - name: Stage redistributable demos
        working-directory: viewer
        run: pnpm run stage:demos
      # Without `--with-deps`, as in viewer-test.yml: its apt step added only
      # fonts to a runner image that carries Chrome and so every library
      # Chromium links, and the mirror stalled on them. A missing library
      # would fail the launch.
      - name: Install Playwright Chromium
        working-directory: viewer
        run: pnpm exec playwright install chromium
      # The same VW1-21 import audit as the viewer deploy.
      - name: Verify no network imports in wasm (VW1-21)
        working-directory: viewer
        run: node scripts/audit-wasm-imports.mjs
      - name: Build viewer
        working-directory: viewer
        run: pnpm run build
      - name: Verify viewer loads sample without network regressions
        working-directory: viewer
        env:
          RVT_VIEWER_SAMPLE: ../_project_corpus/Revit/Revit_IFC5_Einhoven.rvt
        run: pnpm run test:network

  # Prebuilt CLI archives for Linux (static musl, x86_64 + arm64), macOS
  # (arm64 + x86_64) and Windows (x86_64), checksummed and attached to the
  # tag's GitHub Release — see release-binaries.yml. The release page also
  # gets the wheels and the sdist built above, the very files the PyPI job
  # uploads (the `wheel-*` and `sdist` artifacts of this run), listed in
  # SHA256SUMS and covered by the same attestation (#1466). Gated on the
  # source smoke test and on the crates.io publish, so the GitHub release and
  # the container image never carry a version crates.io lacks. It does not wait
  # for PyPI, so a PyPI hiccup never withholds the binaries from people who
  # just need to read a Revit file.
  release-binaries:
    name: Release binaries
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - preflight
      - build-wheels
      - build-sdist
      - release-source-smoke
      - publish-crate
    permissions:
      contents: write
      # The image job pushes the container to ghcr.io.
      packages: write
      # Build-provenance attestations for the archives and the image.
      id-token: write
      attestations: write
    uses: $/.github/workflows/release-binaries.yml
    with:
      upload: true
      tag: ${{ github.ref_name }}

  # Q-10: crates.io publish. Runs BEFORE the PyPI publish so if the
  # crate is rejected (yanked name conflict, verify-failure, etc.)
  # the Python side doesn't ship with a mismatched version. It
  # authenticates by Trusted Publishing in the `crates-io` environment
  # (C3), and a tag release fails when crates.io cannot publish, so
  # PyPI never ships a version crates.io lacks. On manual
  # workflow_dispatch, the crates.io step is skipped (there's no
  # TestPyPI equivalent for crates.io — the registry doesn't offer a
  # test/staging environment).
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - preflight
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
    # Don't re-publish when the user explicitly asked for TestPyPI-only.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: crates-io
      url: https://crates.io/crates/rvt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: $/.github/actions/setup-rust
      # The tag's version was matched against every version file in the
      # preflight, which is also where this job gets it. A version crates.io
      # already has is skipped, so a release whose rvt-rs-mcp publish failed
      # after rvt went out can be re-run instead of failing at `cargo publish
      # -p rvt`; one that is there but yanked, or that crates.io will not
      # answer for, fails.
      - name: Is rvt already on crates.io
        id: rvt-state
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 tools/ci/release_preflight.py crate-state rvt "$VERSION"
      # Trusted Publishing (C3): a token for this run alone, issued to
      # DrunkOnJava/rvt-rs / publish.yml / environment crates-io. A failed
      # exchange fails the job, and with it PyPI's publish.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Cargo publish
        if: ${{ steps.rvt-state.outputs.state == 'publish' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        # Default features only (`dhat-heap` is a profiling switch for
        # the examples). The pyo3 bindings are the separate `rvt-py`
        # member crate (SEC-12/13), which ships to PyPI through maturin,
        # and the wasm bindings are `rvt-wasm` (C6); both have
        # `publish = false`.
        run: cargo publish -p rvt
      # The MCP server (rvt-mcp/, `rvt-rs-mcp`) depends on the `rvt` just
      # published (`=X.Y.Z`), which `cargo publish` waits to see in the index
      # before it verifies this package. A new crate's first publish is
      # manual, and its trusted publisher (DrunkOnJava/rvt-rs, publish.yml,
      # environment crates-io) is added on crates.io after it. Until then a
      # publish here would fail after `rvt` is already on crates.io and leave
      # the tag half published, so the steps run only once the repository
      # variable PUBLISH_RVT_RS_MCP is `true`, which is set after the first
      # manual publish (RELEASE.md, step 8). The binary is in the release
      # archives either way.
      - name: Is the MCP server already on crates.io
        id: mcp-state
        if: ${{ vars.PUBLISH_RVT_RS_MCP == 'true' }}
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 tools/ci/release_preflight.py crate-state rvt-rs-mcp "$VERSION"
      - name: Cargo publish the MCP server
        if: ${{ vars.PUBLISH_RVT_RS_MCP == 'true' && steps.mcp-state.outputs.state == 'publish' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p rvt-rs-mcp

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test-pypi }}
    needs:
      - preflight
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rvt
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the wheel and sdist artifacts. The release-binaries job in this
      # run uploads CLI archives that are also *.tar.gz; a download of every
      # artifact picks them up whenever they finish first (on v0.2.0 the
      # PyPI job downloaded seven seconds before the first one landed).
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdist
          path: dist
      - name: List the distributions
        shell: bash
        run: |
          ls -la dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Real PyPI releases are tag-only and wait for crates.io publish to
  # succeed first. This prevents a split-brain release where the Python
  # package ships but the matching Rust crate was rejected.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - preflight
      - build-wheels
      - build-sdist
      - validate-wheel-install
      - release-source-smoke
      - docs-rs-preview
      - viewer-release-smoke
      - publish-crate
    environment:
      name: pypi
      url: https://pypi.org/p/rvt
    permissions:
      # `id-token: write` is the OIDC token needed for trusted
      # publishing. `contents: read` is the default. No other perms.
      id-token: write
      contents: read
    steps:
      # Only the wheel and sdist artifacts. The release-binaries job in this
      # run uploads CLI archives that are also *.tar.gz; a download of every
      # artifact picks them up whenever they finish first (on v0.2.0 the
      # PyPI job downloaded seven seconds before the first one landed).
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdist
          path: dist
      - name: List the distributions
        shell: bash
        run: |
          ls -la dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # No `password:` — trusted publisher OIDC is auto-detected
          # when `id-token: write` is set and a trusted publisher
          # configuration exists on PyPI for this workflow.
          #
          # A file PyPI already has fails the first attempt, since a version
          # on PyPI before this release's first upload is not this release's.
          # From the second attempt on (a re-run after a partial upload, with
          # the same artifacts: re-run the failed jobs, not all of them) the
          # files already there are skipped and the rest uploaded.
          skip-existing: ${{ github.run_attempt != '1' }}
