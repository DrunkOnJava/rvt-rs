# Scratch: which stable item hands out the compact graph value (the default-features step of CI fails on it).
name: scratch unnameable
on:
  push:
    branches: ["scratch/1800-unnameable"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: The default-features CI step
        run: |
          RUSTFLAGS="-D warnings -D unnameable_types" cargo +stable check --lib --bins > a.log 2>&1 || true
          echo "A: errors $(grep -c '^error' a.log || true)"
          grep -E '^error' -A 3 a.log | head -40 || true
      - name: Clippy, every target and feature
        run: |
          rustup component add clippy --toolchain stable
          cargo +stable clippy --keep-going --workspace --all-targets --all-features --message-format short -- -D warnings > c.log 2>&1 || true
          echo "C: findings $(grep -c -E '(^|: )(error|warning)' c.log || true)"
          grep -E '(^|: )(error|warning)' c.log | head -60 || true
      - name: Rustdoc and the module tests
        run: |
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --lib > d.log 2>&1 || true
          echo "D: doc findings $(grep -c -E '^(error|warning)' d.log || true)"
          cargo +stable test --lib graph_value > t.log 2>&1 || true
          grep -E 'test result|FAILED|panicked' t.log | head -10 || true
