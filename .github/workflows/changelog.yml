name: Changelog

# Q-11 / #348 — git-cliff changelog rendering, on demand (C7).
#
# rvt-rs' CHANGELOG.md is hand-curated with rich narrative per release, so
# nothing here writes it. A manual run renders git-cliff's view for whoever
# curates a release: from main, the unreleased commits as
# `CHANGELOG-UNRELEASED.md`; from a `v*` tag, that release's notes as
# `RELEASE_NOTES.md`. Both are uploaded as artifacts.
#
# It used to run on every push to main (111 runs in five days) and on every
# tag, and nothing consumed either artifact: the release step writes its
# notes with `--generate-notes`.

on:
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-24.04
    # No contents:write needed — we upload artifacts, never push.
    # Default read-only token is sufficient for git-cliff to walk
    # the history.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so git-cliff can walk every tag back to the
          # initial commit. `fetch-depth: 0` is the documented way.
          fetch-depth: 0

      # Unreleased-only render for main pushes. The output file is
      # `CHANGELOG-UNRELEASED.md`, intentionally separate from the
      # hand-curated CHANGELOG.md (see RELEASE.md §Workflow).
      - name: Render unreleased section
        if: github.ref == 'refs/heads/main'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --verbose
        env:
          OUTPUT: CHANGELOG-UNRELEASED.md

      - name: Upload CHANGELOG-UNRELEASED artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-unreleased
          path: CHANGELOG-UNRELEASED.md
          if-no-files-found: error
          retention-days: 30

      # From a tag, that release's notes.
      - name: Render release notes on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose --current
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Upload release notes artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
