name: CI

on:
  push:
    # A hotfix branch is cut from a release tag (RELEASE.md, "Hotfix
    # process"), so no pull request into main tests what it releases.
    branches: [main, "hotfix/**"]
    # Docs-only changes don't need to spin up the Windows wheel
    # matrix. Keep the fast Ubuntu jobs (fmt / clippy / doc / pii)
    # for any commit that actually touches code, including tests
    # or workflow files. `paths-ignore` is a whole-run filter so
    # this skips ALL jobs when only ignored paths changed.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE*"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - "CITATION.cff"
  pull_request:
    branches: [main]

# Supersede a pull request's in-flight run when a new push arrives, so
# back-to-back pushes do not burn runner-minutes on stale matrices. A run
# on main is never cancelled: two merges in a row used to cancel the first
# one's run, and that commit never got a full result. The group key is per
# ref, so a pull request and main never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege at the workflow level. No CI job here modifies the
# repo, opens issues, comments on PRs, or otherwise needs write
# access; `contents: read` is enough. Individual jobs can request
# additional scopes with a per-job `permissions:` block if that
# ever changes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Linux jobs run on ubuntu-24.04, not ubuntu-latest (C5): ubuntu-latest moves
# to Ubuntu 26 from 2026-10-19, which would change apt packages, Playwright's
# system dependencies and the preinstalled tools under every job without a
# commit here. Moving to 26.04 is a deliberate edit of this label.
jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The stable API as `cargo install` and every downstream build compile
      # it: without `unstable-research`, so research modules are private.
      # `unnameable_types` fails on any research type that a stable item
      # still hands out (RELEASE.md, "What 1.0 keeps stable"). rustc's lints
      # only: clippy's exported-API exemptions do not apply to the private
      # research modules, and the line above already runs clippy on them.
      - name: Default features keep research types out of the stable API
        env:
          RUSTFLAGS: "-D warnings -D unnameable_types"
        run: cargo check --lib --bins
      # The wasm bindings are their own crate (C6); it builds natively too.
      # `--no-deps`: the line above lints `rvt` with every feature, and
      # linting it again through rvt-wasm's default-features dependency
      # would apply clippy's exported-API rules to research items that are
      # private there.
      - run: cargo clippy -p rvt-wasm --all-targets --no-deps -- -D warnings
      # The pyo3 bindings and the stream-evidence harness are workspace
      # members the lines above do not lint.
      - run: cargo clippy -p rvt-py -p stream-evidence --all-targets --no-deps -- -D warnings
      # The RE probes are their own crate (probes/), so the `rvt` builds above
      # and in the test matrix no longer compile them; this is where they are
      # checked. `--no-deps`: `rvt` is linted with every feature above.
      - run: cargo clippy -p rvt-probes --examples --no-deps -- -D warnings

  test:
    # Unit tests are banned (maintainer directive, 2026-09-23): this job
    # builds every target and runs only what tools/ci/test-targets.txt
    # classes as real-file, CLI or contract verification. Corpus LFS clones
    # dominate wall-clock, so the Autodesk family corpus is fetched on
    # ubuntu-stable (primary) and windows-stable (CFB path-separator
    # regression); elsewhere the corpus checks skip and the CLI and
    # contract checks still run. The MSRV entry is labelled `msrv`, so its
    # check name does not change when `rust-version` does.
    name: build + real files / ${{ matrix.os }} / ${{ matrix.label || matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: stable
            with_corpus: true
          - os: windows-latest
            rust: stable
            with_corpus: true
          - os: macos-latest
            rust: stable
            with_corpus: false
          - os: ubuntu-24.04
            rust: "1.87"  # MSRV, `rust-version` in Cargo.toml
            label: msrv
            with_corpus: false
    steps:
      # Windows' git default `core.autocrlf=true` mangles binary files
      # that aren't explicitly marked `binary` in `.gitattributes`.
      # The phi-ag/rvt corpus stores some `.rfa` files outside LFS
      # without binary attribution — Windows checkout therefore
      # silently CRLF-converts them and CFB parsing fails on affected
      # streams. Disable autocrlf globally before any checkout runs.
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows runners have slow disk I/O on C:. Putting the cargo home
      # and target directories on a ReFS dev drive is the single biggest
      # Windows speed-up (the job took ~12 min vs ~7 on Ubuntu before).
      - name: Set up dev drive (Windows)
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      # Fetch the Autodesk-owned `rac_basic_sample_family` corpus from
      # phi-ag/rvt. rvt-rs intentionally does not redistribute these
      # files (see SECURITY.md §Scope); they're pulled at build time and
      # cached across runs keyed on the corpus repository's HEAD.
      - name: Fetch phi-ag/rvt sample corpus
        if: matrix.with_corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      - name: Install Rust
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      # sccache on Windows only (C2). There rust-cache saves the checkout's
      # target directory while the dev drive builds into its own, so sccache
      # is what keeps compiled units (95% hits). On Linux and macOS it hit 0
      # of 303 requests, filled the Actions cache with small objects, and
      # its RUSTC_WRAPPER changed rust-cache's key, so the jobs sharing
      # `ci-release` never restored it. It is set through GITHUB_ENV so the
      # variable does not exist at all off Windows.
      - name: Set up sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # The cache backend can refuse sccache (2026-10-30: "ServerBusy: Egress
      # is over the account limit"), and then every rustc call through the
      # wrapper fails. So the server is started here, kept up for the job,
      # and the wrapper set only if it starts; otherwise the build runs
      # without it. A later I/O error with the server compiles locally.
      - name: Use sccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true SCCACHE_IDLE_TIMEOUT=0
          if sccache --start-server; then
            {
              echo "SCCACHE_GHA_ENABLED=true"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
              echo "RUSTC_WRAPPER=sccache"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start (its Actions cache backend refused it); building without it"
          fi
      # The platform test matrix owns the shared release caches. Compatible
      # fan-out jobs restore them without racing to save partial targets.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-release
      - name: Build
        if: matrix.label != 'msrv'
        # Linux owns the shared `ci-release` cache and compiles every
        # target so benches and examples stay green. macOS and Windows
        # never run benches or examples in this job, so they skip them:
        # on windows-latest the all-targets build was 181 s of a 4.1 min
        # job.
        run: cargo build --profile ci ${{ runner.os == 'Linux' && '--all-targets' || '--lib --bins --tests' }}
      # The MSRV entry checks that every target compiles on the oldest
      # supported release; the stable entries run the checks (C6). It took
      # 2 min 48 s to build and run them again for 5 s of tests.
      - name: Check every target on the MSRV
        if: matrix.label == 'msrv'
        run: cargo check --profile ci --all-targets
      # The API examples docs.rs shows, run against the committed synthetic
      # fixture (corpus/tier1/), so a documented call cannot drift from the
      # code (1.0 criteria S3, #872). Linux only: the examples do not depend
      # on the platform.
      - name: Run the API documentation's examples
        if: runner.os == 'Linux' && matrix.label != 'msrv'
        run: cargo test --profile ci --doc
      # Real-file, end-to-end CLI and contract checks only; the manifest
      # names every tests/*.rs target and the script fails on one it does
      # not classify, so a new target cannot run or skip unnoticed (#206).
      # With the family corpus present, a missing release fails the
      # coverage and ElemTable gates instead of skipping them.
      # cargo-nextest runs the manifest's test binaries in parallel (C6).
      - name: Install cargo-nextest
        if: matrix.label != 'msrv'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146
      - name: Real-file, CLI and contract verification
        if: matrix.label != 'msrv'
        shell: bash
        env:
          RVT_SAMPLES_DIR: ${{ matrix.with_corpus && format('{0}/_corpus/examples/Autodesk', github.workspace) || '' }}
          RVT_REQUIRE_CORPUS: ${{ matrix.with_corpus && '1' || '' }}
        run: tools/ci/verify-real-files.sh --profile ci --no-fail-fast
      # The synthetic IFC pair the integration tests write
      # (tests/common, write_synthetic_output): each release pull request
      # refreshes the viewer's download copies in tests/fixtures/ from it.
      # The IfcOpenShell job validates the same output.
      - name: Upload the synthetic IFC pair
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.label != 'msrv' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-fixtures
          path: target/tmp/synthetic-fixtures/
          if-no-files-found: ignore
      # The user examples the README links (examples/README.md), run on the
      # committed synthetic project so they cannot drift from the API
      # (#872). Linux only: they do not depend on the platform.
      - name: Run the user examples
        if: runner.os == 'Linux' && matrix.label != 'msrv'
        shell: bash
        run: |
          out="$RUNNER_TEMP/basics-export"
          cargo run --profile ci --example basics_inspect
          cargo run --profile ci --example basics_elements
          cargo run --profile ci --example basics_export -- corpus/tier1/architectural-2024/architectural-2024.rvt "$out"
          for f in model.ifc model.glb elements.csv diagnostics.json; do
            test -s "$out/$f" || { echo "::error::basics_export wrote no $f"; exit 1; }
          done

  # #836: a sum or product of file-derived lengths in `usize` that a 64-bit
  # build cannot overflow can still wrap on a 32-bit target, and pass a
  # bounds check it should fail (#835 found one that panicked the browser
  # viewer, which runs on wasm32). Every other job builds for 64 bits, so
  # this one runs the same real-file, CLI, contract and hardening targets,
  # the fuzz regressions among them, on i686 with overflow checks on: a
  # wrap panics there instead of passing.
  i686-overflow:
    name: 32-bit overflow checks (i686)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_CI_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch phi-ag/rvt sample corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      - name: Install Rust and the i686 target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target i686-unknown-linux-gnu
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          rustc --version
      # The 32-bit C runtime and libgcc the i686 test binaries link against.
      - name: Install gcc-multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-i686
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146
      - name: Real-file, CLI, contract and hardening checks on i686
        shell: bash
        env:
          RVT_SAMPLES_DIR: ${{ github.workspace }}/_corpus/examples/Autodesk
          RVT_REQUIRE_CORPUS: "1"
        run: tools/ci/verify-real-files.sh --profile ci --no-fail-fast --target i686-unknown-linux-gnu

  corpus-tier2:
    # M2-03 Tier 2: optional external project corpus. Clones the MIT
    # magnetar-io/revit-test-datasets tree (not Autodesk-owned samples)
    # and runs lightweight health + known-count checks. Local runs skip
    # when RVT_PROJECT_CORPUS_DIR is unset.
    name: Corpus health (tier 2 — external)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch project corpus (magnetar MIT)
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
      # RE-32 / RE-33: the Revit 2025 oracles, projects and Revit's own IFC
      # exports of them (Drshelden/IFC-ECS, MIT), pinned by commit and checked by hash,
      # placed beside the magnetar projects so tests/element_records_2025.rs
      # runs here instead of skipping.
      - name: Fetch the Revit 2025 oracle (Drshelden/IFC-ECS RE1, MIT)
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Drshelden/IFC-ECS/9e8b37175a0fba1397f7011aeee917fe52de7623/data/RE1
          dir="${GITHUB_WORKSPACE}/_project_corpus/Revit"
          while read -r name sum; do
            curl -sSfL --retry 5 --retry-all-errors -o "${dir}/${name}" "${base}/${name}"
            echo "${sum}  ${dir}/${name}" | sha256sum -c -
          done <<'LIST'
          RE1-Architecture.rvt 4a78bdd68e7f4dd7806060db07c222da9a810e20b3f303c17a443294b91c8ce4
          RE1-Architecture.ifc a9b5d36677aa6a8bb91b77d8bc354ed9028a7ca3e9e2491a47ba14cfd8e26200
          RE1-Mechanical.rvt d559720177aa0ec435133f804e7c45d60da2deb9d5585bb3d55f4830139c014b
          RE1-Mechanical.ifc 9e56cf7246ce86ef73646dd588a1efb8a4756e5e102b30e28b3b58577a454db0
          RE1-Plumbing.rvt 03689df2aa426031a216e65051b9f19d3265d6fe96884dd47373b17435f9e54c
          RE1-Plumbing.ifc 294490b222632509779910345f27a4eeda3645956138a593298c241495f7b8b6
          RE1-Electrical.rvt 9875e765c9f47893808c47b845a8379b8777b92510e3e0284f763cb457c9630b
          RE1-Electrical.ifc c7002a10c8e10ab2fca64ff61dcf38db04da652924f65ce53c2064827dfa9e16
          LIST
      # #766: four Revit 2024 models of VTT's BIM4LCA example buildings and
      # Revit's IFC export of one (CC BY-SA 4.0), read by byte range from the
      # 1.58 GB ARCH.zip by tools/ci/fetch-bim4lca.py and checked against
      # research/bim4lca-models.tsv, so the targets that read
      # RVT_NORDIC_LCA_DIR run here instead of skipping. Saved on main and
      # restored by pull requests. RVT_NORDIC_LCA_DIR is set only once every
      # file verified: an unreachable host leaves it unset, the targets skip
      # and the step says NOT MEASURED, while a file that no longer matches
      # its pin fails the job.
      - name: Restore the BIM4LCA models
        id: bim4lca-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _bim4lca
          key: bim4lca-${{ hashFiles('research/bim4lca-models.tsv') }}
      - name: Fetch the BIM4LCA models (VTT, CC BY-SA 4.0)
        shell: bash
        run: |
          set +e
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-models.tsv _bim4lca
          status=$?
          set -e
          case "$status" in
            0) echo "RVT_NORDIC_LCA_DIR=${GITHUB_WORKSPACE}/_bim4lca" >> "$GITHUB_ENV" ;;
            2) echo "::warning::BIM4LCA models NOT MEASURED: the host was unreachable, so the targets that read them skip" ;;
            *) echo "::error::the BIM4LCA models no longer match research/bim4lca-models.tsv"; exit 1 ;;
          esac
      - name: Save the BIM4LCA models
        if: github.ref == 'refs/heads/main' && steps.bim4lca-cache.outputs.cache-hit != 'true' && env.RVT_NORDIC_LCA_DIR != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _bim4lca
          key: ${{ steps.bim4lca-cache.outputs.cache-primary-key }}
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: ci-release
      # #206: targets that read RVT_PROJECT_CORPUS_DIR used to be listed
      # here by name, and any target left off the list took its skip path
      # on every CI run — `elem_table_corpus` hid a real decoder bug that
      # way (26424 of 26425 declared records on the 2024 project). Every
      # tests/*.rs now runs against the project corpus, so a new
      # corpus-reading target is gated the moment it exists.
      # cargo-nextest runs the manifest's test binaries in parallel (C6).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146
      - name: Tier-two gates (real-file, CLI and contract targets against the project corpus)
        shell: bash
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
          RVT_CORPUS_TIER1_DIR: ${{ github.workspace }}/corpus/tier1
          RVT_CORPUS_TIER2_LIMIT: "8"
        run: tools/ci/verify-real-files.sh --profile ci --no-fail-fast

  writer-patch-corpus:
    # M9-01: stream-level writer coverage for real family + project
    # fixtures. Keeps grow/shrink/multi-stream/missing-stream cases
    # from silently regressing while semantic editing remains out of
    # scope.
    name: Writer patch corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch family corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      - name: Fetch project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: ci-release
      - name: Run stream patch corpus tests
        env:
          RVT_SAMPLES_DIR: ${{ github.workspace }}/_corpus/examples/Autodesk
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: 'cargo test --profile ci --test integration -- cfb_roundtrip_delta:: --nocapture'
      - name: Run project known-count fixture tests
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: 'cargo test --profile ci --test integration -- project_count_fixtures:: --nocapture'
      # The user examples on a real project (#872): the tier-1 fixture the
      # test job runs them on has no element records, so only a real file
      # shows them listing and exporting elements. Einhoven (Revit 2023,
      # MIT) exports 37 building elements.
      - name: Run the user examples on a real project
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        shell: bash
        run: |
          set -euo pipefail
          model="${RVT_PROJECT_CORPUS_DIR}/Revit_IFC5_Einhoven.rvt"
          cargo run --profile ci --example basics_inspect -- "$model"
          cargo run --profile ci --example basics_elements -- "$model" > "$RUNNER_TEMP/elements.txt"
          cat "$RUNNER_TEMP/elements.txt"
          grep -qE '^[1-9][0-9]* building elements$' "$RUNNER_TEMP/elements.txt" \
            || { echo "::error::basics_elements listed no building element of Einhoven"; exit 1; }
          out="$RUNNER_TEMP/einhoven-export"
          cargo run --profile ci --example basics_export -- "$model" "$out"
          rows=$(($(wc -l < "$out/elements.csv") - 1))
          echo "elements.csv: $rows rows"
          test "$rows" -gt 0 || { echo "::error::basics_export wrote an empty schedule for Einhoven"; exit 1; }

  ifcopenshell-validate:
    # IFC-41 / C9: the independent-validator gate. IfcOpenShell parses what
    # the exporter writes through the full IFC4 schema, so errors a
    # substring count can't see (dangling refs, wrong attribute arity,
    # enum values outside the spec vocabulary) fail here. It used to check
    # the committed tests/fixtures/synthetic-*.ifc, which only a test that
    # never runs regenerates, so it checked a fixed file rather than the
    # current exporter (CI audit, 2026-10-05); it now exports the three
    # tier-1 projects and real projects and validates those, and the
    # synthetic pair as the integration tests write it now. The tier-1
    # exports are small (24 instances each); the real projects carry most of
    # what this job validates.
    name: IfcOpenShell validates exports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: ci-release
      - name: Install IfcOpenShell (prebuilt wheel)
        run: |
          # ifcopenshell ships prebuilt wheels on PyPI for Linux, macOS
          # and Windows x64. tools/ci/requirements-ifc.txt pins an exact
          # version and every dependency, with their hashes, since
          # IfcOpenShell is one of the witnesses below; an update lands as
          # tools/ci/requirements-ifc.in says.
          python -m pip install --require-hashes -r tools/ci/requirements-ifc.txt
      # #817: the IFC4 property set table is generated from buildingSMART's
      # definitions (pinned by commit and sha256) and IfcOpenShell's IFC4
      # schema; the committed file must be the generator's output.
      - name: The IFC4 property set table is the generator's output
        run: |
          rustup component add rustfmt
          python tools/ci/gen_standard_property_sets.py > /tmp/standard_property_sets_table.rs
          rustfmt --edition 2024 /tmp/standard_property_sets_table.rs
          diff -u src/ifc/standard_property_sets/table.rs /tmp/standard_property_sets_table.rs
      # C9: what the exporter writes now for the three tier-1 projects
      # (architectural 2024, MEP 2024, structural 2023; synthetic files
      # made by gen-fixture, in the repository), validated against the IFC4
      # schema and its declared attribute counts.
      - name: Export and validate the tier-1 projects
        run: |
          set -euo pipefail
          cargo build --profile ci --bin rvt-ifc
          for f in corpus/tier1/*/*.rvt; do
            out="/tmp/tier1-$(basename "$f" .rvt).ifc"
            ./target/ci/rvt-ifc "$f" -o "$out"
            python -m ifcopenshell.validate "$out"
          done
          python tools/ci/ifc_schema_arity.py /tmp/tier1-*.ifc
      # The synthetic project and structural frame as the writer produces
      # them now (tests/ifc_synthetic_*.rs, written at a fixed timestamp to
      # target/tmp/synthetic-fixtures/). They reach writer paths the tier-1
      # exports do not (IfcMember routing, representation maps, stairs), and
      # ifc_schema_arity.py's placement probes pin their walls, slab and
      # column. Validated rather than compared with tests/fixtures/, so a
      # change to the writer's output fails only when it is wrong.
      - name: Write and validate the synthetic IFC pair
        run: |
          set -euo pipefail
          cargo test --profile ci --test integration -- ifc_synthetic_
          for f in target/tmp/synthetic-fixtures/synthetic-project.ifc target/tmp/synthetic-fixtures/synthetic-structural.ifc; do
            test -s "$f"
            python -m ifcopenshell.validate "$f"
          done
          python tools/ci/ifc_schema_arity.py target/tmp/synthetic-fixtures/synthetic-project.ifc target/tmp/synthetic-fixtures/synthetic-structural.ifc

      # M5-03: real-project walker → IFC end-to-end gate. Emit a
      # fresh IFC4 STEP from the small 2023 Einhoven project via
      # `rvt-ifc`, then load it in IfcOpenShell and cross-check
      # entity counts, spatial containment, unit assignment, and
      # current geometry/material limitations against diagnostics.
      # This makes the real-file gate non-vacuous in CI instead of
      # silently skipping when no local corpus happens to exist.
      - name: Build rvt-ifc + validate real-project IFC
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          cargo build --profile ci --bin rvt-ifc
          SAMPLE="${RVT_PROJECT_CORPUS_DIR}/Revit_IFC5_Einhoven.rvt"
          test -f "$SAMPLE"
          ./target/ci/rvt-ifc "$SAMPLE" \
            -o /tmp/walker-real-project.ifc \
            --diagnostics /tmp/walker-real-project.diagnostics.json
          python tools/ci/validate-real-ifc.py \
            /tmp/walker-real-project.ifc \
            /tmp/walker-real-project.diagnostics.json
      # The committed fixtures carry no IfcBoolean, so a malformed
      # `IFCBOOLEAN(.F)` shipped in every real export until the schema
      # validator ran on one. Validate real exports in full: Einhoven
      # above and the Core Interior element-record export, which carries
      # thousands of property values.
      - name: Schema-validate real-project exports
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          ./target/ci/rvt-ifc "${RVT_PROJECT_CORPUS_DIR}/2024_Core_Interior.rvt" \
            -o /tmp/core-interior.ifc
          python -m ifcopenshell.validate /tmp/walker-real-project.ifc
          python -m ifcopenshell.validate /tmp/core-interior.ifc
          python tools/ci/ifc_schema_arity.py /tmp/walker-real-project.ifc /tmp/core-interior.ifc
      # #908: doors and windows are drawn from their saved graphics by
      # default (2026-10-29); every other class only with --saved-meshes, so
      # no other job reads theirs. Export both real projects with it, fail
      # unless each draws some body from them, and validate both exports.
      - name: Export and validate real projects with their saved meshes
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          set -euo pipefail
          for m in Revit_IFC5_Einhoven 2024_Core_Interior; do
            status=0
            ./target/ci/rvt-ifc "${RVT_PROJECT_CORPUS_DIR}/$m.rvt" --saved-meshes \
              -o "/tmp/$m-saved.ifc" 2> "/tmp/$m-saved.log" || status=$?
            cat "/tmp/$m-saved.log"
            test "$status" -eq 0
            # attach() reports "0 of 0" without reading anything when a
            # model has no box-bodied candidates, so the count must be
            # positive: Einhoven draws 11 and Core Interior 138.
            replaced=$(sed -nE 's/^rvt-ifc: ([0-9]+) of [0-9]+ bounding-box bodies drawn from their saved graphics.*/\1/p' "/tmp/$m-saved.log")
            test "${replaced:-0}" -gt 0 \
              || { echo "::error::$m: no body was drawn from its saved graphics"; exit 1; }
            python -m ifcopenshell.validate "/tmp/$m-saved.ifc"
          done
          python tools/ci/ifc_schema_arity.py /tmp/Revit_IFC5_Einhoven-saved.ifc /tmp/2024_Core_Interior-saved.ifc
      # Cross-witness gate (docs/verification-protocol.md): an independent
      # IFC reader parses the Revit-authored reference export and must agree
      # with the same manifest counts the rvt-rs decoder is gated against.
      - name: Cross-witness gate — IfcOpenShell vs Revit-authored reference IFC
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          mkdir -p /tmp/witness/observations
          python tools/ci/witness-ifcopenshell.py \
            tests/fixtures/project-counts/2024-core-interior.json \
            "${RVT_PROJECT_CORPUS_DIR}" \
            --observation /tmp/witness/observations/ifcopenshell.json
      # Third implementation lineage on the same edge (OctetProof §9.3):
      # IFClite reads the same reference IFC with its own hand-rolled STEP
      # scanner — Rust, MPL-2.0, no IfcOpenShell code. It builds from
      # tools/ci/witness-ifc-lite, which is its own workspace root, so the
      # MPL dependency is never linked into the Apache-2.0 `rvt` tree, and
      # `--locked` plus the `=7.1.1` pin keeps the witness version exact
      # (§9.6). Two unrelated bridge readers must now report the same counts.
      - name: Cross-witness gate — IFClite vs Revit-authored reference IFC
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          cargo run --release --locked \
            --manifest-path tools/ci/witness-ifc-lite/Cargo.toml -- \
            tests/fixtures/project-counts/2024-core-interior.json \
            "${RVT_PROJECT_CORPUS_DIR}" \
            --observation /tmp/witness/observations/ifc-lite.json
      # OctetProof verdict (docs/octetproof-spec-draft.md §6–§10): the source
      # witness (rvt-rs reading the .rvt) and the two bridge witnesses
      # (IfcOpenShell and IFClite reading Revit's .ifc) each emit a canonical
      # observation; the verdict must PASS on the claimed surface with the
      # §9.3 independence set — three lineages — and the fresh observations
      # must replay byte-for-byte against the committed ones under
      # research/witness/. Fail-closed.
      - name: OctetProof verdict — source witness vs two bridge witnesses, replayed
        id: witness_full
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          ./target/ci/rvt-ifc "${RVT_PROJECT_CORPUS_DIR}/2024_Core_Interior.rvt" \
            -o /tmp/witness/core-interior.rvt-rs.ifc \
            --observation /tmp/witness/observations/rvt-rs.json \
            --artifact-id magnetar-2024-core-interior
          python tools/ci/witness-verdict.py \
            tests/fixtures/project-counts/2024-core-interior.json \
            /tmp/witness/observations \
            --out /tmp/witness/verdict.json \
            --registry research/witness-registry.json \
            --compare-committed research/witness/magnetar-2024-core-interior/observations
      # #214: same schema-arity gate as the fixtures above, on the IFC
      # a real Revit 2024 project just produced — the file that carried
      # 338 short instances (256 IFCCOLUMN, 64 IFCSLAB, 18 IFCSPACE)
      # before the fix.
      #
      # `--witness-agreement` is passed only here: this is the recorded
      # artifact, so every written PredefinedType must be the value
      # Revit's own exporter writes for that type on
      # 2024_Core_Interior_slim.ifc (#220). The same run also composes
      # ObjectPlacement x Position for two pinned elements, which is
      # what keeps the #232 double-translation from coming back.
      - name: Validate IFC4 schema arity of the real-project IFC
        run: |
          python tools/ci/ifc_schema_arity.py --witness-agreement \
            /tmp/witness/core-interior.rvt-rs.ifc
      # Second recorded edge on the same source .rvt: the full project export
      # (IFC Exports/2024_Core_Interior_slim.ifc, 19879 entities) instead of
      # the 20 KB element fixture. Same three witnesses, same verdict shape;
      # the surface is deliberately narrow — five fields since #204 — because
      # the full export exposes 360 walls / 132 doors / 116 spaces that rvt-rs
      # cannot claim yet, and those are excluded first-class with their
      # tracking issues. Columns joined the claimed surface when the count
      # became exact (256/256, tolerance 0).
      #
      # It runs whenever the step above ran, failed included: a change that
      # moves rvt-rs's observation drifts both edges, and running this one
      # too publishes both fresh observations in the same run (B27). The job
      # still fails if either verdict does.
      - name: OctetProof verdict — full-project export (slim), three witnesses
        if: ${{ !cancelled() && (steps.witness_full.outcome == 'success' || steps.witness_full.outcome == 'failure') }}
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: |
          mkdir -p /tmp/witness-slim/observations
          python tools/ci/witness-ifcopenshell.py \
            tests/fixtures/project-counts/2024-core-interior-slim.json \
            "${RVT_PROJECT_CORPUS_DIR}" \
            --observation /tmp/witness-slim/observations/ifcopenshell.json
          cargo run --release --locked \
            --manifest-path tools/ci/witness-ifc-lite/Cargo.toml -- \
            tests/fixtures/project-counts/2024-core-interior-slim.json \
            "${RVT_PROJECT_CORPUS_DIR}" \
            --observation /tmp/witness-slim/observations/ifc-lite.json
          ./target/ci/rvt-ifc "${RVT_PROJECT_CORPUS_DIR}/2024_Core_Interior.rvt" \
            -o /tmp/witness-slim/core-interior-slim.rvt-rs.ifc \
            --observation /tmp/witness-slim/observations/rvt-rs.json \
            --artifact-id magnetar-2024-core-interior-slim
          python tools/ci/witness-verdict.py \
            tests/fixtures/project-counts/2024-core-interior-slim.json \
            /tmp/witness-slim/observations \
            --out /tmp/witness-slim/verdict.json \
            --registry research/witness-registry.json \
            --compare-committed research/witness/magnetar-2024-core-interior-slim/observations
      # §10.6: publish observations + verdict for human review of any
      # disagreement without re-running the gate.
      - name: Publish witness observations and verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octetproof-core-interior
          path: |
            /tmp/witness/
            /tmp/witness-slim/
          # Ninety days on `main`, where the verdict is the record; two weeks
          # on a pull request's run, which nobody reads after it merges.
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}
          if-no-files-found: ignore

  doc:
    name: cargo doc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --lib
      # The published crate carries only what Cargo.toml's `include` lists.
      # Build it as crates.io will, so a file the source embeds and the list
      # misses fails here rather than at release (publish.yml).
      - name: crate package
        run: cargo package -p rvt --locked

  # S2 (#873): a pull request that breaks the stable Rust API says so.
  # tools/ci/semver-gate.sh compares the crate's public API (default
  # features, so neither `unstable-research` nor `dhat-heap`) with the pull
  # request's base, not the last release: main can already hold breaking
  # changes that were announced when they landed. It runs cargo-semver-checks
  # and a cargo-public-api listing diff, and passes a breaking change only
  # when the title carries `!` or the body a `BREAKING CHANGE:` footer.
  # cargo-public-api 0.52 reads the rustdoc JSON of nightlies from
  # 2025-11-22, so its nightly is pinned near its release.
  semver:
    name: semver checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      PUBLIC_API_TOOLCHAIN: nightly-2026-05-20
      # Both trees are built only to compare their APIs. A warning a newer
      # stable Rust finds in the unchanged baseline must not fail the
      # comparison, or no pull request could fix it.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust stable and the public API listing's nightly
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup toolchain install "$PUBLIC_API_TOOLCHAIN" --profile minimal --no-self-update
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - name: Install cargo-semver-checks and cargo-public-api
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-semver-checks@0.51.0,cargo-public-api@0.52.0
      - name: The stable API breaks nothing the pull request does not announce
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: tools/ci/semver-gate.sh

  # Q-09: benchmark-build regression gate.
  #
  # Runs `cargo bench --no-run` to compile every benchmark target
  # against the current library API. Without this job, a PR that
  # renames a public item or changes a function's signature can
  # break the benchmarks silently — `cargo test` doesn't build the
  # `[[bench]]` targets, and nobody runs benches on every push.
  #
  # A full runtime regression gate (compare wallclock numbers to a
  # baseline, fail on >X% slowdown) would need a dedicated runner
  # class with stable performance characteristics — GitHub's shared
  # runners have variable load, so wallclock comparisons need wide
  # tolerances to avoid false positives. Compile-gate is the
  # high-value, low-noise version we can enforce on every push.
  bench-build:
    name: cargo bench --no-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: ci-release
      # `--no-run` compiles the benches but doesn't execute them.
      # This catches API drift (renamed public items, changed
      # function signatures, missing traits on types used in
      # benches) that `cargo test` doesn't, since benches live in
      # their own `[[bench]]` targets.
      # `--profile ci` so the shared cache, populated by the Linux test
      # job's `--all-targets` build, serves every dependency. The default
      # `bench` profile inherits release LTO and rebuilt the whole graph
      # from scratch: 207 s per pull request for a compile-only check.
      - run: cargo bench --no-run --profile ci

  # Q-12: reproduce the docs.rs build locally in CI.
  # docs.rs runs `cargo doc` on nightly with `--all-features` and the
  # `--cfg docsrs` flag set; broken rustdoc (invalid links, missing
  # items, syntax errors in code examples) breaks the docs.rs page —
  # catching it in CI means every PR validates that rvt-rs will render
  # properly on docs.rs before the release cut.
  docs-rs-preview:
    name: docs.rs build preview
    runs-on: ubuntu-24.04
    env:
      # Same flags docs.rs passes, plus -D warnings so this job fails
      # instead of silently publishing broken docs.
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs.rs builds with nightly — any `#[cfg_attr(docsrs, ...)]`
      # attributes + `#![feature(...)]` gates must be available.
      # A dated nightly (C2): the toolchain is part of rust-cache's key, so
      # a floating nightly saved a new cache every day and restored none.
      # Move the date forward when docs.rs needs a newer feature.
      - name: Install Rust nightly-2026-10-01
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-01 --profile minimal --no-self-update
          rustup default nightly-2026-10-01
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-docs-rs
      # Mirror the [package.metadata.docs.rs] settings from Cargo.toml
      # (`all-features = true`) — if these drift, update both.
      - run: cargo +nightly-2026-10-01 doc --no-deps --all-features
      # docs.rs must mark the research modules as needing the feature.
      - name: Research modules carry the unstable-research banner
        run: grep -q 'unstable-research</code>' target/doc/rvt/research/index.html

  # The fuzz targets are a workspace of their own that no other job builds,
  # so a field added to a type a target constructs broke the nightly run
  # after merge, twice (#236 -> #259, #934 -> #965).
  fuzz-check:
    name: fuzz targets build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly-2026-10-01
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-01 --profile minimal --no-self-update
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-fuzz-check
          workspaces: fuzz
      - run: cargo +nightly-2026-10-01 check --manifest-path fuzz/Cargo.toml --bins

  python-wheel:
    name: Python wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build the Linux wheel only; the full platform
        # matrix runs on pushes to main, where the wheels are consumed.
        # Frees two scarce macOS/Windows runners per PR without loosening
        # the merge gate, which never required the wheel jobs.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-latest", "windows-latest"]') }}
    steps:
      # Windows CFB stream names need the same autocrlf=false guard
      # we use for the Rust Windows integration job, or LFS-bound
      # corpus bytes get CRLF-mangled. Keeping this idempotent.
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wheel smoke opens a real Autodesk family on Linux; macOS and
      # Windows skip the multi-hundred-MB fetch and smoke the tier-one
      # project file only.
      - name: Fetch phi-ag/rvt sample corpus
        if: runner.os == 'Linux'
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: ci-release
      # Build the abi3 wheel. SEC-12/13: wheel sources live in the
      # `rvt-py/` workspace member crate; maturin follows the
      # `manifest-path` in pyproject.toml. `--release` produces an
      # optimised binary matching what users get via `pip install rvt`.
      # Linux builds inside the manylinux2014 container, as the release
      # does (publish.yml), so a change that breaks the glibc 2.17 build
      # fails here rather than at tag time.
      #
      # maturin-action installs maturin inside that container from a download
      # off GitHub releases, which answered once with a page that was not a
      # gzip (2026-09-30: "gzip: stdin: not in gzip format") and failed the
      # job on a change that touched no code. So a failed build is retried
      # once, below, with the identical inputs; a build that really fails
      # fails both times and fails the job.
      - name: Build wheel via maturin
        id: maturin
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist
      - name: Build wheel via maturin (retry)
        if: steps.maturin.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist
      # Install into this runner's Python and run the installed wheel end
      # to end: open a Revit file and export IFC through the Python API
      # (tools/ci/wheel-smoke.py, the same smoke the release runs), then
      # the pytest suite in tests/python: integration tests of the public
      # Python API on the tier-1 fixtures and, with the corpus fetched,
      # the eleven Autodesk families (B25).
      - name: Install the built wheel
        shell: bash
        run: |
          python3 -m pip install --force-reinstall dist/*.whl
      - name: Wheel smoke on Revit files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/wheel-smoke.py corpus/tier1/architectural-2024/architectural-2024.rvt
          family="_corpus/examples/Autodesk/racbasicsamplefamily-2024.rfa"
          if [ -f "$family" ]; then python3 tools/ci/wheel-smoke.py "$family"; fi
      - name: Python API integration tests on Revit files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r tools/ci/requirements-test.txt
          if [ -d _corpus/examples/Autodesk ]; then
            export RVT_SAMPLES_DIR="$PWD/_corpus/examples/Autodesk"
          fi
          python3 -m pytest tests/python -q -rs
      # S2 (#873): the type stubs are the Python API's listing, and
      # tools/ci/python-api-compat.py judges a breaking change by diffing
      # them. stubtest keeps them true: it fails when the installed wheel and
      # python/rvt/__init__.pyi disagree on a name, a parameter or a default.
      - name: The type stubs match the built wheel
        if: runner.os == 'Linux'
        run: python3 -m mypy.stubtest rvt
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rvt-wheel-${{ matrix.os }}
          path: dist/*.whl
          # A smoke build; the release wheels are built by publish.yml.
          retention-days: 7
          if-no-files-found: error

  # Supply-chain hardening. `cargo-deny check` enforces our deny.toml:
  # permissive-license allowlist, RustSec advisory deny, crates.io-only
  # source, no wildcards. Keeps the dependency tree auditable as the
  # project grows.
  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      # install-action retries the download and verifies its checksum;
      # cargo-deny-action's image fetched the release with a bare
      # `curl --silent -L` and failed the check when GitHub returned an
      # error page ("gzip: invalid magic").
      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Fails CI on any RustSec advisory published against the current
  # dependency set. Complements cargo-deny's coverage — deny has the
  # per-advisory `ignore` list for triage flexibility, audit catches
  # fresh advisories the moment they land.
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit

  viewer-dependencies:
    name: viewer dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version `packageManager` pins in viewer/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        working-directory: viewer
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-x64-${{ hashFiles('viewer/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-x64-
      - name: Install viewer dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile
      - name: Audit viewer dependencies
        working-directory: viewer
        shell: bash
        # The registry advisory endpoint answers 503 during maintenance
        # windows, and `pnpm audit` then exits non-zero without having
        # measured anything. Retry with backoff, and if the endpoint is still
        # unreachable record the audit as NOT MEASURED instead of failing the
        # job on infrastructure. A measured high or critical advisory still
        # fails it: a measured run always prints valid JSON with
        # `metadata.vulnerabilities`, an endpoint failure does not.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm audit --audit-level high --json > audit.json 2> audit.err; then
              echo "pnpm audit: no high or critical advisories"
              exit 0
            fi
            if python3 -c 'import json, sys; sys.exit(0 if "vulnerabilities" in json.load(open("audit.json")).get("metadata", {}) else 1)' 2>/dev/null; then
              pnpm audit --audit-level high || true
              echo "::error::viewer dependency audit found high or critical advisories"
              exit 1
            fi
            echo "pnpm audit endpoint unavailable (attempt ${attempt}/4): $(head -c 300 audit.err)"
            sleep $((attempt * 20))
          done
          echo "::warning::viewer dependency audit NOT MEASURED: the advisory endpoint was unreachable after 4 attempts"
          exit 0
      - name: Save pnpm store
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  pii-guard:
    name: PII guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for PII-shaped leak patterns
        run: |
          set -e
          echo "Scanning repo for patterns that must never be committed..."
          # Each regex catches a *class* of PII without spelling out
          # any specific sensitive value. The patterns are intentionally
          # broad — they're belt-and-suspenders on top of src/redact.rs.
          # The backslashes in the Windows patterns are regex escapes.
          # shellcheck disable=SC1003
          PATTERNS=(
            # Absolute home paths (macOS, Linux, Windows).
            '/Users/[a-z][a-z0-9._-]+/'
            '/home/[a-z][a-z0-9._-]+/'
            'C:\\Users\\[a-z][a-z0-9._-]+\\'
            # Autodesk employee-owned OneDrive authoring paths.
            'OneDrive - Autodesk\\[^\\]*\\Revit - [0-9]{3,}'
            # Autodesk build-server paths baked into DLLs.
            'F:\\Ship\\[0-9]{4}_'
          )
          failed=0
          for p in "${PATTERNS[@]}"; do
            if git grep -I -n -P "$p" -- ':!.github/workflows/' ':!src/redact.rs' 2>/dev/null; then
              echo "::error::PII-shaped pattern matched: $p"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "PII guard: clean."
      - name: Scan for committed merge-conflict markers
        run: |
          # A resolved rebase can still leave a diff3 base marker behind;
          # three of them sat in CHANGELOG.md for weeks. `=======` alone is
          # also a Markdown underline, so only the three unambiguous markers
          # are matched.
          if git grep -I -n -E '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)( |$)' -- .; then
            echo "::error::merge-conflict marker committed"
            exit 1
          fi
          echo "Conflict-marker guard: clean."
      # Changelog entries are fragments (#938); a malformed one would be
      # lost or misplaced when a release assembles them.
      - name: Changelog fragments are in a section and start an item
        run: python3 tools/release/changelog.py check
      # The crate root tells docs.rs readers that every `RE-NN` is a report
      # under reports/, and that RE and issue numbers are the only tracker
      # ids the docs use; this keeps both true for the Rust and Python API
      # docs.
      - name: API docs cite only reported RE findings and no planning labels
        run: python3 tools/ci/api-doc-ids.py
      - name: Reports cite only commits the repository has
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/cited-commits.py
      # The README's count and docs/viewer-api.md's table name exactly the
      # bindings rvt-wasm exports.
      - name: The docs list every wasm binding
        run: python3 tools/ci/wasm-api.py docs rvt-wasm/src/lib.rs README.md docs/viewer-api.md

  # Guards the development environments' config: shellcheck the Cursor
  # install script and the devcontainer's scripts, install the
  # devcontainer's tools from their lock, and validate
  # `.cursor/environment.json` against the published Cursor environment
  # schema. Keeps the env setup from silently drifting into an invalid state
  # on any PR.
  env-config:
    name: env config lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-24.04 runners.
      - name: ShellCheck .cursor/install.sh and the devcontainer's scripts
        run: shellcheck .cursor/install.sh .devcontainer/*.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The devcontainer's onCreateCommand, run as Codespaces runs it: Codex,
      # Claude Code and pnpm installed from their lock, each run, and pnpm
      # checked against viewer/package.json. The runner's npm is older than
      # the devcontainer's 12.2.0, so the `allowScripts` policy is not what
      # is checked here; the lock, the install and the three tools are.
      - name: Provision the devcontainer's tools from their lock
        run: PATH="$HOME/.local/bin:$PATH" bash .devcontainer/provision.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Against a copy of https://cursor.com/schemas/environment.schema.json
      # taken 2026-10-05 (C8): downloading it on every pull request made the
      # check depend on cursor.com. Refresh the copy by hand when Cursor
      # changes the schema.
      - name: Validate .cursor/environment.json against the Cursor schema
        run: |
          python -m pip install --require-hashes -r tools/ci/requirements-test.txt
          python - <<'PY'
          import json
          import jsonschema

          schema = json.load(open("tools/ci/cursor-environment.schema.json"))
          config = json.load(open(".cursor/environment.json"))
          jsonschema.validate(config, schema)
          print(".cursor/environment.json validates against the Cursor environment schema")
          PY

  # The one check the main-protection ruleset requires (C1). It passes only
  # when every job above passed or was skipped, so a pull request cannot
  # merge while Corpus health, the writer corpus or IfcOpenShell is still
  # running or has failed, and renaming a job never touches the ruleset.
  ci-ok:
    name: CI passed
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - i686-overflow
      - corpus-tier2
      - writer-patch-corpus
      - ifcopenshell-validate
      - doc
      - bench-build
      - docs-rs-preview
      - fuzz-check
      - python-wheel
      - deny
      - audit
      - viewer-dependencies
      - pii-guard
      - env-config
      - semver
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) echo "::error::a CI job failed or was cancelled"; exit 1 ;;
          esac
