name: Viewer tests

# The viewer's browser tests (VW1, W9; #1374): the WASM build, the type check
# and the Playwright suite against the built viewer, on the public project
# corpus and the four RE1 models. ci.yml calls this as its `viewer` job in the
# full set (a ready pull request, or a push to main), so `CI passed` waits for
# them: a pull request cannot merge before they have passed on its head, which
# Deploy viewer's own pull-request run could not guarantee (#1370 merged
# before it had finished). It can also be dispatched on a branch, to check a
# draft's viewer by hand. Deploy viewer builds and publishes the site, and runs
# the saved-mesh measurement through this workflow; its deploy job waits for
# `CI passed`, so a commit is published only after the tests have passed on it.
#
# The WASM and gen-fixture are built once per run (#1457), by the `build` job,
# and handed to the legs as an artifact. Each leg used to build both itself,
# about 2 minutes of its 5.5 to 6.6. A caller that has built them already
# passes the artifact's name as `wasm_artifact`, and `build` is skipped: Deploy
# viewer uploads the release WASM it publishes, and its `tests` and `measure`
# jobs test those bytes, where each used to test a build of its own. Every leg
# prints the sha256 of the WASM it tests and fails if it differs from the one
# recorded when the artifact was made, and again for the site it builds and
# serves (tools/ci/check-wasm-in-site.sh).
#
# A skipped leg must never read as a pass: `CI passed` counts a skipped job as
# passing, and a workflow call whose jobs were all skipped is skipped itself.
# The legs run whenever the run is not cancelled, and their first step fails
# when `build` did not succeed (or was skipped with no `wasm_artifact`), so
# every leg either runs its tests or fails the call, and the call's own result
# (what `CI passed` and Deploy viewer read) already aggregates them. There is
# no job after the legs to say so again: it was a job of its own that waited
# for a runner (4.6 minutes of #1481's landing run) to guard only against a
# `legs` list that yields no leg, which would skip `test` and let the call
# pass. tools/ci/check-workflows.py checks that instead, in the env config job:
# the default `legs` and the `legs` of every caller are a non-empty JSON list of
# legs, written out, not computed.
#
# `legs` is the list of jobs that run at once, each testing that build: for
# ci.yml, the suite in three groups of spec files; for Deploy viewer, the
# saved-mesh measurement, which runs alone so nothing else competes for the
# CPU. One job of all of it took 12 to 20 minutes, which the rest of CI (6 to
# 9 minutes) would have waited for. The groups are by file, not by Playwright's
# `--shard`, which cuts the tests in file order into runs of equal length in
# tests: with four shards the four Core Interior tests of
# viewer-regression.spec.ts, 26 to 34 s each, landed in two of them, whose
# tests took 140 and 165 s against 75 s for the others. The longest single
# test, the toggle in saved-meshes-measure.spec.ts, is 114 s and sits in a
# group with short files, and the group with viewer-regression.spec.ts (four
# Core Interior opens) has no other long file: it took 213 to 227 s in four
# runs while the others took 77 to 143. The groups are by the sum of each file's
# time in a run of all three (2026-11-08: 8.0, 2.9 and 2.3 minutes before this,
# the first the last job of 8 of 15 full CI runs); parameters-row.spec.ts, at
# 572 s, stands nearly alone. Every spec file must be in a group: the first step
# of a leg fails on one that is not.
#
# `release_wasm: false` builds the WASM without LTO, at 16 codegen units: 55 s
# warm against 150 to 225 s for the release profile (fat LTO, one codegen
# unit), and every leg waits for the build job before it tests anything.
# ci.yml tests that build, so that `CI passed` does not wait for the release
# one; Deploy viewer runs the suite and the measurement again on the release
# build it publishes.

on:
  workflow_call:
    inputs:
      legs:
        description: JSON list of the legs to run, each with a `name` and either `files` (the spec files of the suite it runs, as Playwright path filters) or `measure` true (the saved-mesh measurement)
        type: string
        default: '[{"name":"browser tests 1/3","files":"/parameters-row\\.spec /wasm-no-network-imports\\.spec /worker-failures\\.spec"},{"name":"browser tests 2/3","files":"/export-phase\\.spec /folded-pieces\\.spec /journey\\.spec /memory-ceiling\\.spec /tree-rows\\.spec"},{"name":"browser tests 3/3","files":"/large-model-retry\\.spec /load-progress\\.spec /memory-ceiling-capped\\.spec /no-network\\.spec /saved-meshes-measure\\.spec /viewer-regression\\.spec"}]'
      release_wasm:
        description: Build the WASM as Deploy viewer publishes it (fat LTO, one codegen unit); false builds it in a third of the time, with no LTO and 16 codegen units
        type: boolean
        default: true
      # Not a dispatch input: a dispatched run has no artifact to name, so it
      # builds its own.
      wasm_artifact:
        description: Name of an artifact of this run that holds a build of the WASM, laid out as the `build` job writes it (pkg/ from wasm-pack, bin/gen-fixture, bin/rvt-elements, wasm.sha256), for a caller that built it already; `build` is then skipped and `release_wasm` is ignored
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      legs:
        description: JSON list of the legs to run, each with a `name` and either `files` (the spec files of the suite it runs, as Playwright path filters) or `measure` true (the saved-mesh measurement)
        type: string
        default: '[{"name":"browser tests 1/3","files":"/parameters-row\\.spec /wasm-no-network-imports\\.spec /worker-failures\\.spec"},{"name":"browser tests 2/3","files":"/export-phase\\.spec /folded-pieces\\.spec /journey\\.spec /memory-ceiling\\.spec /tree-rows\\.spec"},{"name":"browser tests 3/3","files":"/large-model-retry\\.spec /load-progress\\.spec /memory-ceiling-capped\\.spec /no-network\\.spec /saved-meshes-measure\\.spec /viewer-regression\\.spec"}]'
      release_wasm:
        description: Build the WASM as Deploy viewer publishes it (fat LTO, one codegen unit); false builds it in a third of the time, with no LTO and 16 codegen units
        type: boolean
        default: true

# Read-only. The jobs run pnpm dependencies and Playwright, and hold no write
# scope. The caller passes `contents: read` through.
permissions:
  contents: read

jobs:
  # The WASM and gen-fixture, built once for every leg and uploaded as an
  # artifact. Skipped when the caller passes `wasm_artifact`.
  build:
    name: build the WASM
    if: ${{ !inputs.wasm_artifact }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: $/.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown

      # The two builds are cached apart: the faster WASM has other profile
      # settings, so none of the release build's dependencies would be reused.
      # `target-native` is gen-fixture's, below. Only this job compiles; the
      # legs restore no Rust cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ inputs.release_wasm && 'viewer-wasm' || 'viewer-wasm-fast' }}
          cache-directories: target-native

      - name: Install wasm-pack and the locked wasm-bindgen
        uses: $/.github/actions/wasm-tools

      - name: Build WASM, and gen-fixture beside it
        shell: bash
        env:
          RELEASE_WASM: ${{ inputs.release_wasm }}
        # The bindings are their own crate, rvt-wasm (C6). `--out-dir` is
        # relative to that crate, so `../viewer/pkg` writes straight into the
        # viewer; `--out-name rvt` keeps the files `rvt.js` and
        # `rvt_bg.wasm`.
        #
        # gen-fixture generates the synthetic-mvp demo. It is built with the CI
        # profile (the release profile's full LTO rebuilt the crate: 39 s) in a
        # target directory of its own, so that it does not wait for the WASM
        # build's lock on target/, and at the same time: it finishes well
        # inside the WASM build, which took 150 to 225 s while the two
        # builds in turn took 200 to 290 s.
        #
        # rvt-elements is built in the same invocation (a link of the library
        # gen-fixture already compiled): tests/parameters-row.spec.ts runs it
        # on the sample and holds the panel's saved parameters to what it prints
        # (#35).
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-native" cargo build --profile ci --bin gen-fixture --bin rvt-elements &
          fixture=$!
          if [ "${RELEASE_WASM}" != true ]; then
            export CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          wasm-pack build rvt-wasm --target web --out-dir ../viewer/pkg --out-name rvt
          wait "${fixture}"

      # An artifact name is taken once per run, and Deploy viewer calls this
      # workflow twice: the name follows the call's own inputs, which differ
      # between them.
      - name: Name the artifact
        id: name
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
          RELEASE: ${{ inputs.release_wasm }}
        run: |
          set -euo pipefail
          digest=$(printf '%s %s' "${LEGS}" "${RELEASE}" | sha256sum | cut -c1-12)
          echo "artifact=viewer-build-${digest}" >> "$GITHUB_OUTPUT"

      # What the legs install: wasm-pack's output, gen-fixture, and the WASM's
      # sha256, which each leg prints and checks against its own copy.
      - name: Collect the build, and print the WASM's sha256
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/viewer-build"
          mkdir -p "${dir}/bin"
          cp -R viewer/pkg "${dir}/pkg"
          cp target-native/ci/gen-fixture "${dir}/bin/gen-fixture"
          cp target-native/ci/rvt-elements "${dir}/bin/rvt-elements"
          (cd "${dir}" && sha256sum pkg/rvt_bg.wasm > wasm.sha256)
          sha=$(cut -d' ' -f1 "${dir}/wasm.sha256")
          echo "WASM sha256 ${sha}"
          echo "WASM sha256: ${sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/viewer-build
          if-no-files-found: error
          # A rerun of every job uploads under the name of the first attempt.
          overwrite: true
          retention-days: 3

  test:
    name: ${{ matrix.name }}
    needs: build
    # Not `success()`, which a skipped `build` (a caller passed the artifact)
    # would fail: the first step decides, and fails the leg rather than
    # skipping it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    steps:
      # A failed build is a failed leg. The build is skipped only when a caller
      # passed the artifact; anything else that is not a success fails here.
      - name: The WASM comes from a build that passed
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          GIVEN: ${{ inputs.wasm_artifact }}
        run: |
          case "${BUILD}" in
            success) ;;
            skipped)
              if [ -z "${GIVEN}" ]; then
                echo "::error::the build job was skipped and no wasm_artifact was passed"
                exit 1
              fi ;;
            *)
              echo "::error::the build job ended ${BUILD}; there is no WASM to test"
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The build of the WASM and gen-fixture, from the `build` job or from the
      # caller. An artifact is a zip, which drops the executable bit. The
      # stager would build gen-fixture itself if it found none (cargo is on
      # the runner image), taking minutes and passing: the binary is run here,
      # so a missing or broken one fails the leg instead.
      - name: Download the WASM and gen-fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.wasm_artifact || needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/viewer-build
      - name: Install the WASM and gen-fixture, and print the WASM's sha256
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/viewer-build"
          cp -R "${dir}/pkg" viewer/pkg
          chmod +x "${dir}/bin/gen-fixture" "${dir}/bin/rvt-elements"
          echo "${dir}/bin" >> "$GITHUB_PATH"
          "${dir}/bin/gen-fixture" --help >/dev/null
          "${dir}/bin/rvt-elements" --help >/dev/null
          expected=$(cut -d' ' -f1 "${dir}/wasm.sha256")
          actual=$(sha256sum viewer/pkg/rvt_bg.wasm | cut -d' ' -f1)
          echo "WASM sha256 ${actual}"
          echo "WASM sha256: ${actual}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the WASM differs from the one the artifact was made with (${expected})"
            exit 1
          fi

      # A spec file that no leg lists would run nowhere, and `CI passed` would
      # be green without it.
      - name: Every spec file is in a leg
        if: ${{ matrix.files }}
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          mapfile -t patterns < <(jq -r '.[].files // empty | split(" ")[]' <<<"${LEGS}")
          status=0
          for spec in viewer/tests/*.spec.ts; do
            covered=false
            for pattern in "${patterns[@]}"; do
              if [[ "/$(basename "${spec}")" =~ ${pattern} ]]; then covered=true; fi
            done
            if [ "${covered}" = false ]; then
              echo "::error::${spec} is in no leg of the viewer tests"
              status=1
            fi
          done
          exit "${status}"

      # Tier-1 + synthetic demos stage from in-repo corpus/tier1/ and
      # gen-fixture — no Autodesk LFS needed for Playwright MVP coverage.
      # The MIT magnetar project samples (Einhoven 2023, Core Interior
      # 2024) are staged from this checkout as real-project gallery demos
      # (sha256-pinned in docs/viewer-demos.json) and power the
      # real-project viewer regression (RVT_VIEWER_SAMPLE / projectSampleTest).
      - name: Checkout public project corpus
        uses: $/.github/actions/fetch-corpus
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
      # W9: the viewer journey (viewer/tests/journey.spec.ts) also runs on the
      # four RE1 models (Drshelden/IFC-ECS, MIT), pinned by commit and hash in
      # research/re1-models.tsv. fetch-re1 restores them from one Actions cache
      # entry, checks every file against its pin and downloads only a missing
      # or changed one (#1457).
      - name: Fetch the RE1 models (Drshelden/IFC-ECS, MIT)
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Architecture.rvt RE1-Mechanical.rvt RE1-Plumbing.rvt RE1-Electrical.rvt
          path: _project_corpus/Revit

      # folded-pieces.spec.ts and parameters-row.spec.ts open the BIM4LCA office as
      # built, the one model with a piece folded into another element's body and a
      # read larger than its open (CC BY-SA 4.0). A file restored
      # is checked against its pin like a fetched one, and only main saves a file
      # that was verified. The host being unreachable says nothing about the
      # viewer, so that test is then not measured, and says so: `timeout`, since
      # this host has held a job for 27 minutes (#1237). A file that no longer
      # matches its pin fails. Deploy viewer's leg runs every file ("/").
      - name: Restore the BIM4LCA office as built
        id: office-cache
        if: ${{ contains(matrix.files, 'folded-pieces') || contains(matrix.files, 'parameters-row') || matrix.files == '/' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: _bim4lca-viewer
          key: bim4lca-viewer-${{ hashFiles('research/bim4lca-measure.tsv', 'tools/ci/fetch-bim4lca.py') }}
      - name: Fetch the BIM4LCA office as built
        id: office
        if: ${{ contains(matrix.files, 'folded-pieces') || contains(matrix.files, 'parameters-row') || matrix.files == '/' }}
        shell: bash
        run: |
          name=ARK_NordicLCA_Office_Concrete_As-Built.rvt
          awk -F'\t' -v tail="/${name}" '$1 != "entry" || substr($2, length($2) - length(tail) + 1) == tail' \
            research/bim4lca-measure.tsv > "${RUNNER_TEMP}/office-pin.tsv"
          set +e
          timeout 240 python3 tools/ci/fetch-bim4lca.py "${RUNNER_TEMP}/office-pin.tsv" _bim4lca-viewer
          status=$?
          set -e
          case "$status" in
            0) echo "path=${GITHUB_WORKSPACE}/_bim4lca-viewer/${name}" >> "$GITHUB_OUTPUT" ;;
            2|124) echo "::warning::folded-pieces.spec.ts NOT MEASURED: the host of the BIM4LCA office was unreachable" ;;
            *) echo "::error::the BIM4LCA office no longer matches research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      - name: Save the BIM4LCA office as built
        if: ${{ steps.office.outputs.path != '' && steps.office-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: _bim4lca-viewer
          key: bim4lca-viewer-${{ hashFiles('research/bim4lca-measure.tsv', 'tools/ci/fetch-bim4lca.py') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          # The pnpm store, keyed on the lockfile (C6).
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      # Every import of the wasm, by name and by the body of its shim in the
      # glue; the script says why a name alone is not enough. It runs in each
      # leg, on the copy the leg tests, and takes seconds.
      - name: Verify no network imports in wasm (VW1-21)
        working-directory: viewer
        run: node scripts/audit-wasm-imports.mjs

      - name: Install dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile

      - name: Stage redistributable demos
        working-directory: viewer
        run: pnpm run stage:demos

      - name: Playwright version
        id: playwright
        working-directory: viewer
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browser download, keyed on the Playwright version (C6).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Without `--with-deps`: its apt step added only fonts (CJK, Thai,
      # Unifont) to a runner image that carries Chrome and so every library
      # Chromium links, and the mirror stalled on them for four minutes in
      # two of three legs of one run. A missing library would fail the launch.
      - name: Install Playwright Chromium
        working-directory: viewer
        run: pnpm exec playwright install chromium

      - name: Typecheck
        working-directory: viewer
        run: pnpm run typecheck

      - name: Build viewer
        working-directory: viewer
        run: pnpm run build

      # The tests serve this site, not viewer/pkg, and Deploy viewer publishes
      # it: a bundler that re-encoded or renamed the WASM would pass the
      # sha256 check above and fail on a copy nobody tested.
      - name: The site holds the WASM that was downloaded
        run: tools/ci/check-wasm-in-site.sh "${RUNNER_TEMP}/viewer-build/wasm.sha256" viewer/dist

      - name: Browser regression tests
        if: ${{ !matrix.measure }}
        working-directory: viewer
        env:
          RVT_VIEWER_SAMPLE: ../_project_corpus/Revit/Revit_IFC5_Einhoven.rvt
          RVT_VIEWER_REQUIRE_JOURNEYS: "1"
          RVT_VIEWER_FULLY_PARALLEL: "1"
          RVT_VIEWER_OFFICE: ${{ steps.office.outputs.path }}
          FILES: ${{ matrix.files }}
        # `pnpm run test:browser`, on this leg's spec files.
        run: |
          read -ra files <<<"${FILES}"
          pnpm exec playwright test --config playwright.config.ts "${files[@]}"

      # The viewer draws every boxed element from its saved mesh by default
      # (doors and windows alone until #1191), on the condition (Griffin,
      # 2026-10-30 and 2026-11-09) that its memory and load time
      # are measured in Playwright on the reference models. Each is opened
      # with the option on and off; the spec asserts behaviour, not timings,
      # and writes the figures to viewer/measurements/ and the job summary.
      # It runs in a leg of its own, alone, so nothing else competes for the
      # CPU. Its one assertion about the toggle that gates a merge, on Core
      # Interior, is in the suite.
      - name: Measure the viewer with and without saved meshes
        if: ${{ matrix.measure && !cancelled() }}
        working-directory: viewer
        env:
          RVT_VIEWER_MEASURE: "1"
          RVT_VIEWER_REQUIRE_JOURNEYS: "1"
        run: pnpm exec playwright test --config playwright.config.ts --reporter=list --output=test-results/measure

      - name: Upload the saved-mesh measurement
        if: ${{ matrix.measure && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: viewer-saved-meshes-measurement
          path: viewer/measurements/
          if-no-files-found: ignore
          # A rerun of every job uploads under the name of the first attempt.
          overwrite: true
          retention-days: 30

      # The HTML report and each failed test's trace, kept for 14 days. The
      # name follows the leg's, with its `/` and spaces replaced: the job index
      # is 0 in each of Deploy viewer's two calls, and an artifact name is
      # taken once per run.
      - name: Name the Playwright report
        id: report
        if: failure()
        shell: bash
        env:
          LEG: ${{ matrix.name }}
        run: echo "name=playwright-report-$(tr -c 'A-Za-z0-9\n' - <<<"${LEG}")" >> "$GITHUB_OUTPUT"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.report.outputs.name }}
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
