# M2-03: nightly corpus coverage beyond the always-on PR CI surface.
#
# PR CI already runs every real-file, CLI, contract and hardening target
# (tools/ci/test-targets.txt) against both corpora, the writer patch and
# IfcOpenShell real-project gates, and the bench compile. This workflow runs
# only what goes wider: Tier 2 health over 32 projects (PR CI reads 8) and
# the project corpus smoke. Its former tier 3 (a subset of the IfcOpenShell
# job) and tier 4 (field-type coverage, samples, IFC roundtrip and the bench
# compile, all in PR CI) are gone (C7). It builds with the `ci` profile, so
# the `ci-release` cache CI saves on main serves it (C2).

name: Corpus nightly

on:
  schedule:
    # 06:15 UTC — after fuzz.yml's early window, before US morning.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  tier2-wide:
    name: Tier 2 — wider project corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch project corpus (magnetar MIT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: magnetar-io/revit-test-datasets
          path: _project_corpus
          lfs: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: ci-release
      - name: Tier-two open / schema health (wider limit)
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
          # PR CI uses 8; nightly walks a larger slice of the MIT tree.
          RVT_CORPUS_TIER2_LIMIT: "32"
        run: cargo test --profile ci --test corpus_tier2_health -- --nocapture
      - name: Tier-two project corpus smoke
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
        run: cargo test --profile ci --test project_corpus_smoke -- --nocapture
