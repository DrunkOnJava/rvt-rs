name: Fuzz

# Runs every cargo-fuzz target nightly for a bounded wall-clock budget, on
# a corpus that persists from night to night. See `fuzz/README.md` for how
# to run the same targets locally.
#
# Budget: 11 targets × 300 s of libFuzzer time per run (SEC-24 minimum),
# each target forked across the runner's four cores (`-fork=4`). A crash
# fails the target's job, uploads the crashing input and the corpus, and on
# a nightly run opens (or comments on) a `fuzz-crash` issue.
#
# Each target's corpus is restored from the previous run's cache, seeded
# with the tier-1 Revit files and the IFC fixtures, minimised with
# `cargo fuzz cmin` after the run and saved again (C4). Before, every night
# started from an empty corpus, so `fuzz_open_bytes` spent its five minutes
# getting past the compound file header.
#
# SEC-24: minimum 5-minute (300s) per-target run per the security task
# board. Increase via `workflow_dispatch` → `duration_seconds` when doing a
# focused investigation of one target.

on:
  schedule:
    # Nightly at 07:17 UTC — staggered off the top of the hour so
    # we don't fight for runners with the world's :00 cron jobs.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Single target to run (empty = all)"
        required: false
        default: ""
      duration_seconds:
        description: "libFuzzer wall-clock budget per target (seconds)"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  # A dated nightly (C2): a floating one made a new 110 MB cache every night
  # that the next night could not restore.
  NIGHTLY: nightly-2026-10-01
  # install-action's cargo-fuzz is a static musl binary, and cargo-fuzz
  # builds targets for its own host triple by default; the sanitizers need
  # glibc, so the triple is named.
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  # The targets this run fuzzes: all of them, or the one a manual run names.
  # A manual run for one target starts one job, not eleven.
  targets:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: Pick the targets
        id: pick
        env:
          WANTED: ${{ inputs.target }}
        run: |
          all='["fuzz_open_bytes","fuzz_gzip_header_len","fuzz_inflate_at_with_limits","fuzz_parse_schema","fuzz_find_chunks","fuzz_basic_file_info","fuzz_part_atom","fuzz_walker_entry_detect","fuzz_step_writer","fuzz_elem_table","fuzz_public_byte_parsers"]'
          if [ -z "$WANTED" ]; then
            echo "targets=$all" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$all" | grep -q "\"${WANTED}\""; then
            echo "targets=[\"${WANTED}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unknown fuzz target: ${WANTED}"
            exit 1
          fi

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        shell: bash
        env:
          TOOLCHAIN: ${{ env.NIGHTLY }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz

      # A prebuilt, checksummed binary: compiling cargo-fuzz from source took
      # a large part of each job's setup (C4).
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed the corpus
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/${TARGET}"
          cp corpus/tier1/*/*.rvt tests/fixtures/synthetic-*.ifc "fuzz/corpus/${TARGET}/"
          echo "corpus: $(find "fuzz/corpus/${TARGET}" -type f | wc -l) inputs"

      # Built on its own, so a target that no longer compiles fails here and
      # is reported as a build failure, not a crash (#965).
      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +"$NIGHTLY" fuzz build --target "$FUZZ_TARGET_TRIPLE" "$TARGET"

      - name: Run ${{ matrix.target }}
        id: run
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ inputs.duration_seconds || '300' }}
        run: |
          cargo +"$NIGHTLY" fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" -- \
            -max_total_time="$BUDGET" \
            -rss_limit_mb=2048 \
            -timeout=30 \
            -fork=4

      - name: Minimise the corpus
        if: ${{ !cancelled() }}
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +"$NIGHTLY" fuzz cmin --target "$FUZZ_TARGET_TRIPLE" "$TARGET"
          echo "corpus after cmin: $(find "corpus/${TARGET}" -type f | wc -l) inputs"

      - name: Save the corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash corpus on failure
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30

  # A nightly crash opens a `fuzz-crash` issue, or comments on the open one,
  # with the run that found it (C4). A run in which no target crashed but one
  # failed to build opens a `fuzz-build` issue instead (#965): only a target
  # whose run step failed uploads a `crash-` artifact.
  report:
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the fuzz-crash issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          crashes=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '[.artifacts[].name | select(startswith("crash-"))] | length')
          if [ "${crashes:-0}" -gt 0 ]; then
            label=fuzz-crash
            title="Nightly fuzz run found a crash"
            body="The nightly fuzz run ${RUN_URL} found a crash. Each failed target's job uploads \`crash-<target>-<run>\` with the crashing input; reproduce it with \`cargo +nightly fuzz run <target> <input>\` in \`fuzz/\`, then add the input to \`tests/fuzz_regressions.rs\`."
            gh label create fuzz-crash --color B60205 --description "A crash found by the nightly fuzz run" 2>/dev/null || true
          else
            label=fuzz-build
            title="Nightly fuzz targets failed to build"
            body="The nightly fuzz run ${RUN_URL} found no crash, but a target failed before fuzzing, most often because it no longer compiles against the crate (a field added to a type it builds). Reproduce with \`cargo +nightly check --manifest-path fuzz/Cargo.toml\`."
            gh label create fuzz-build --color FBCA04 --description "A fuzz target the nightly run could not build" 2>/dev/null || true
          fi
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
