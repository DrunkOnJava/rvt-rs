# Measure a ref against Revit's own exports of the redistributable reference
# models (Core Interior, RE1, Einhoven), on GitHub's hosted runners.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f probe=probe_re70_wall_join_lists
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f probe=probe_re133_class_ordinals -f families=true
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f families=true
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f samples=true -f timing=true
#
# Each side builds rvt-ifc, rvt-gltf and rvt-info at its ref and runs
# tools/ci/measure-reference-models.sh (taken from the workflow's own ref,
# so both sides are scored by the same scorers). The results are uploaded
# as artifacts, and the compare job writes the differences between the two
# sides to the run summary. Local-only models (Snowdon Towers and others
# without a redistribution licence) are never fetched here. rvt-info also
# reads every model, and the compare job diffs what it printed: that is what
# measures the PartAtom parser, which the IFC export does not reach (none of
# the six reference models has a PartAtom stream; their ProjectInformation
# stream goes through the same parser). The Autodesk family corpus (phi-ag/rvt)
# is fetched when `families` is set, and on every run of a change to this
# workflow, so rvt-info reads each family's PartAtom too and the probe runs on
# it. The corpus is scored against nothing and never stored. Autodesk's sample
# projects (2015 to 2027, pinned in research/autodesk-sample-projects.tsv) are
# fetched the same way when `samples` is set, and the two versions of the
# BIM4LCA office, and its terrain variants in concrete and timber, with Revit's
# exports of them (research/bim4lca-measure.tsv, CC BY-SA 4.0) when `nordic` is
# set; those are scored like the reference models (#763, #1262).
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f nordic=true
#
# puzzbobb's 23 purpose-made Revit 2025 models with Revit's exports of all but
# one (research/r2025-models.tsv, Apache-2.0, #356) are scored the same way
# when `r2025` is set.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f r2025=true
#
# BIMcollab's example structural model, a Revit 2015 project, with Revit 2015's
# own IFC2X3 export of it (research/bimcollab-models.tsv, no redistribution
# licence, RE-198) is scored the same way when `bimcollab` is set: the one
# Revit release from 2015 to 2022 with its own export measured (#421).
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f bimcollab=true
#
# With `holdout`, the held-out models (research/holdout-models.tsv, RE-252,
# and research/holdout-archive-models.tsv, #1261), for checking a rule against
# files it was not derived on: only their summary counts are uploaded
# (tools/ci/scrub-holdout-results.sh). The archive list's spent pairs, no
# longer held out, are measured in full.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f holdout=true -f models="holdout-*"
#
# `sample_years` narrows the samples to a range of releases, and
# `probe_pair_release` also runs a two-file probe on each sample and the same
# project saved by that release, the sample first, for the cross-release
# comparisons of #740 and #742:
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f samples=true -f sample_years="2026 2027" -f probe=probe_re179_revit_2027 -f probe_pair_release=2026
#
# `models` keeps only the models whose names match its patterns, and
# `scorers` runs only the steps it names on them (tools/re scorers, and info,
# gltf, schema and witness; "none" for none), so a probe's run spends nothing
# on the full scorer suite. `probe` and `probe_scorer` may each name several,
# in the same order ("-" for no scorer); each probe then writes
# probe-<probe>.txt and probe_score-<probe>.txt:
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f nordic=true -f models="nordic-office-*" -f scorers=none -f probe="probe_a probe_b" -f probe_scorer="a_vs_ifc -"

name: Measure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to measure (default the dispatched ref)
        required: false
        default: ""
      base:
        description: Ref to compare against, or none
        required: false
        default: main
      probe:
        description: probes (probes/examples, or examples/ on an older ref) to run on each model as well (e.g. probe_re70_wall_join_lists), space-separated, empty for none
        required: false
        default: ""
      keep_ifc:
        description: Upload each model's exported IFC with the results
        type: boolean
        required: false
        default: false
      probe_scorer:
        description: tools/re scorer (no .py) for each probe, in the same order ("-" for none), run on its output and Revit's export, from the measured ref; empty for none
        required: false
        default: ""
      probe_pair_release:
        description: With samples, also run the probe on each sample of another release and the same project saved by this one (e.g. 2026), the sample first; empty for none
        required: false
        default: ""
      families:
        description: Also read every file of the phi-ag/rvt family corpus and the makers' public families (research/public-families.tsv) with rvt-info, and run the probe on them (fetched for the run and never stored)
        type: boolean
        required: false
        default: false
      ifc_flags:
        description: Further rvt-ifc flags for every export (e.g. --saved-meshes), empty for none
        required: false
        default: ""
      samples:
        description: Also read Autodesk's sample projects of every release 2015 to 2027 (research/autodesk-sample-projects.tsv) with rvt-info, rvt-ifc diagnostics and the probe (Autodesk-owned, fetched for the run and never stored)
        type: boolean
        required: false
        default: false
      sample_years:
        description: With samples, only the releases from the first year to the last (e.g. "2026 2027"; one year reads from it on), empty for every release
        required: false
        default: ""
      psets_missing:
        description: "tools/re/psets_vs_ifc.py's PSETS_MISSING: <set>.<property>[,...] whose missing objects the census lists by key, entity and value (e.g. Pset_ColumnCommon.Slope); empty for none"
        required: false
        default: ""
      timing:
        description: Also time rvt-ifc at base and head on one runner, in turn, three rounds per file (the base and head jobs run on different runners, whose speed alone moves an export's time by up to about 1.7x)
        type: boolean
        required: false
        default: false
      nordic:
        description: Also score the BIM4LCA office as built and at building permit, and its two terrain variants, against Revit's exports of them (research/bim4lca-measure.tsv, CC BY-SA 4.0, read by byte range for the run and never stored)
        type: boolean
        required: false
        default: false
      r2025:
        description: Also score puzzbobb's 23 purpose-made Revit 2025 models against Revit's exports of them (research/r2025-models.tsv, Apache-2.0, fetched for the run and never stored)
        type: boolean
        required: false
        default: false
      bimcollab:
        description: Also score BIMcollab's example structural model (Revit 2015) against Revit 2015's export of it (research/bimcollab-models.tsv, no licence stated, fetched for the run; only its summary counts are uploaded)
        type: boolean
        required: false
        default: false
      holdout:
        description: Also score the held-out models against Revit's exports of them (research/holdout-models.tsv and research/holdout-archive-models.tsv, fetched for the run; only their summary counts are uploaded)
        type: boolean
        required: false
        default: false
      models:
        description: Only the models whose names match these patterns (e.g. "nordic-office-* core-interior"), empty for every model fetched
        required: false
        default: ""
      scorers:
        description: Only these steps on the models, tools/re scorers and info, gltf, schema, witness (e.g. "qtos_vs_ifc witness"; a tools/re script in no scorer list runs as an IFC scorer), none for none, empty for all; every model is still exported and hashed
        required: false
        default: ""
  # A change to the measurement itself measures its own PR against main.
  pull_request:
    paths:
      - .github/workflows/measure.yml
      - tools/ci/measure-reference-models.sh
      # #822: the IFC4 property set check schema() runs, and the pinned
      # definitions it imports.
      - tools/ci/ifc4_property_sets.py
      - tools/ci/gen_standard_property_sets.py

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The work is CPU-bound (run 41748430211: 164 task-minutes in a 43-minute
  # Measure step on one 4-core runner), so each side runs as shards on runners
  # of their own: each BIM4LCA office file, Autodesk's samples in two halves
  # by release, the held-out and spent models, and every other model with
  # the families (six jobs a side). In run 41761654404, with four a side, the
  # samples took 11.7 minutes to score and the rest, held-out models
  # included, 14.7, against 6.1 and 9.0 for the office files. A run given
  # `models`, `sample_years` or `probe_pair_release` keeps one shard, since a
  # pair probe needs both releases' samples on one runner. Compare merges the
  # shards back into the measure-head and measure-base artifacts.
  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.plan.outputs.base }}
      head_sha: ${{ steps.refs.outputs.head }}
      base_sha: ${{ steps.refs.outputs.base }}
    steps:
      # Each ref is resolved to a full SHA once, here, so every shard of a side
      # checks out the same commit even when its branch moves during the run
      # (shards start up to minutes apart). A ref the commits API cannot
      # resolve (a pull request's refs/pull/N/head) is passed on as given. The
      # timing job, which saves its cache from the code it checks out, keeps
      # the inputs as given (CodeQL's cache-poisoning rule flags a checkout of
      # a step's output there), so it takes full SHAs.
      - name: Resolve the refs
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ inputs.ref || github.sha }}
          BASE_REF: ${{ inputs.base || 'main' }}
        run: |
          full() {
            if [[ "$1" =~ ^[0-9a-f]{40}$ || "$1" == none ]]; then
              echo "$1"
            elif sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .sha 2>/dev/null) && [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$sha"
            else
              echo "::warning::$1 is not a commit the API resolves; every shard checks it out as given" >&2
              echo "$1"
            fi
          }
          head=$(full "$HEAD_REF")
          base=$(full "$BASE_REF")
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head ${HEAD_REF} -> ${head}; base ${BASE_REF} -> ${base}"
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
          MODELS: ${{ inputs.models }}
          YEARS: ${{ inputs.sample_years }}
          PAIR: ${{ inputs.probe_pair_release }}
          NORDIC: ${{ inputs.nordic && 'true' || 'false' }}
          SAMPLES: ${{ inputs.samples && 'true' || 'false' }}
          R2025: ${{ inputs.r2025 && 'true' || 'false' }}
          HOLDOUT: ${{ inputs.holdout && 'true' || 'false' }}
          BIMCOLLAB: ${{ inputs.bimcollab && 'true' || 'false' }}
          FAMILIES: ${{ (inputs.families || github.event_name == 'pull_request') && 'true' || 'false' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          e = os.environ
          def flag(name):
              return e[name] == "true"
          base = e["EVENT"] == "pull_request" or e["BASE"] not in ("", "none")
          def shard(name, models="", skip="", families=False, samples=False,
                    years="", nordic=False, r2025=False, holdout=False, bimcollab=False):
              return dict(shard=name, models=models, skip=skip, families=families,
                          samples=samples, years=years, nordic=nordic, r2025=r2025,
                          holdout=holdout, bimcollab=bimcollab)
          rest = dict(families=flag("FAMILIES"), nordic=flag("NORDIC"),
                      r2025=flag("R2025"), holdout=flag("HOLDOUT"),
                      bimcollab=flag("BIMCOLLAB"))
          offices = {"office-as-built": "nordic-office-as-built",
                     "office-permit": "nordic-office-permit"}
          if e["MODELS"] or e["YEARS"] or e["PAIR"]:
              shards = [shard("all", models=e["MODELS"], samples=flag("SAMPLES"),
                              years=e["YEARS"], **rest)]
          else:
              shards = []
              if flag("NORDIC"):
                  shards += [shard(name, models=model, nordic=True)
                             for name, model in offices.items()]
              if flag("SAMPLES"):
                  # "-" is a pattern no model's name matches, so these shards
                  # measure samples only.
                  shards += [shard("samples-" + years.replace(" ", "-"), models="-",
                                   samples=True, years=years)
                             for years in ("2008 2021", "2022 2099")]
              if flag("HOLDOUT"):
                  # The held-out fetch brings the spent pairs too.
                  shards.append(shard("held-out", models="holdout-* spent-*", holdout=True))
              skip = " ".join(offices.values()) if flag("NORDIC") else ""
              shards.append(shard("rest", skip=skip, **dict(rest, holdout=False)))
          sides = ["head", "base"] if base else ["head"]
          include = [dict(side=side, **s) for side in sides for s in shards]
          print("matrix=" + json.dumps({"include": include}))
          print("base=" + ("true" if base else "false"))
          PY

  measure:
    name: Measure ${{ matrix.side }} ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
          path: measured
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: measured
          shared-key: measure
          # Runs dispatched from a feature branch saved caches no other run
          # could restore (C2). A run from main that measures other code
          # (`ref` or `base` naming a branch, a SHA or a contributor's pull
          # request) does not save either: that code's build scripts run
          # here, and a cache they wrote would be restored by every later
          # main run.
          # One shard of a side saves it; the others build the same code.
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.shard == 'rest' || matrix.shard == 'all') && (matrix.side == 'base' && (inputs.base == '' || inputs.base == 'main') || matrix.side != 'base' && inputs.ref == '') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install IfcOpenShell
        run: python -m pip install --require-hashes -r tools/ci/requirements-ifc.txt
      - name: Build
        working-directory: measured
        run: |
          git log -1 --format='%H %s' > ../measured-commit.txt
          cargo build --profile ci --bin rvt-ifc --bin rvt-gltf --bin rvt-info
          # A base older than a probe has no such example; it is skipped there.
          # Probes live in the rvt-probes crate (probes/examples) since it was
          # split out; a ref from before that has them in examples/. Both build
          # into the workspace's target/ci/examples.
          examples=()
          probes=()
          for probe in $PROBE; do
            if [ -f "probes/examples/$probe.rs" ]; then
              probes+=(--example "$probe")
            elif [ -f "examples/$probe.rs" ]; then
              examples+=(--example "$probe")
            fi
          done
          if [ "${#examples[@]}" -gt 0 ]; then
            cargo build --profile ci "${examples[@]}"
          fi
          if [ "${#probes[@]}" -gt 0 ]; then
            cargo build --profile ci -p rvt-probes "${probes[@]}"
          fi
        env:
          PROBE: ${{ inputs.probe }}
      - name: Fetch the reference models
        run: tools/fetch-reference-models.sh models
      # The office models' host being down is NOT MEASURED; a file that no
      # longer matches its pin fails the run.
      - name: Fetch the BIM4LCA office models
        if: matrix.nordic
        shell: bash
        run: |
          set +e
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-measure.tsv models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIM4LCA office models NOT MEASURED: the host was unreachable" ;;
            *) echo "::error::the BIM4LCA office models no longer match research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      # The archive being unreachable is NOT MEASURED; an archive that no
      # longer matches its pin fails the run.
      - name: Fetch the R2025 models
        if: matrix.r2025
        shell: bash
        run: |
          set +e
          tools/ci/fetch-r2025-models.sh research/r2025-models.tsv models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::R2025 models NOT MEASURED: the archive could not be downloaded" ;;
            *) echo "::error::an R2025 archive no longer matches research/r2025-models.tsv"; exit 1 ;;
          esac
      # BIMcollab's host being unreachable is NOT MEASURED; a file that no
      # longer matches its pin fails the run.
      - name: Fetch the BIMcollab example model
        if: matrix.bimcollab
        shell: bash
        run: |
          set +e
          tools/ci/fetch-bimcollab.sh research/bimcollab-models.tsv models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIMcollab example model NOT MEASURED: an archive could not be downloaded" ;;
            *) echo "::error::the BIMcollab example model no longer matches research/bimcollab-models.tsv"; exit 1 ;;
          esac
      # A held-out model's host being unreachable is NOT MEASURED; a file
      # that no longer matches its pin fails the run.
      - name: Fetch the held-out models
        if: matrix.holdout
        shell: bash
        run: |
          set +e
          tools/ci/fetch-holdout-models.sh research/holdout-models.tsv models
          status=$?
          if [ "$status" = 0 ]; then
            tools/ci/fetch-holdout-archives.sh research/holdout-archive-models.tsv models
            status=$?
          fi
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::held-out models NOT MEASURED: a file could not be downloaded" ;;
            *) echo "::error::a held-out model no longer matches its pin in research/holdout-models.tsv or research/holdout-archive-models.tsv"; exit 1 ;;
          esac
      - name: Fetch the family corpus
        if: matrix.families
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      # Families their makers publish (research/public-families.tsv, #152),
      # read with the family corpus. An unreachable host is NOT MEASURED.
      - name: Fetch the makers' public families
        if: matrix.families
        run: tools/fetch-public-families.sh _corpus/examples/Autodesk
      - name: Fetch Autodesk's sample projects
        if: matrix.samples
        env:
          SAMPLE_YEARS: ${{ matrix.years }}
        run: |
          # shellcheck disable=SC2086 # SAMPLE_YEARS is the first and last year.
          tools/fetch-autodesk-samples.sh _samples $SAMPLE_YEARS
      - name: Measure
        env:
          PROBE: ${{ inputs.probe }}
          RVT_IFC_FLAGS: ${{ inputs.ifc_flags }}
          PROBE_SCORER: ${{ inputs.probe_scorer }}
          PROBE_PAIR_RELEASE: ${{ inputs.probe_pair_release }}
          PROBE_SCORER_DIR: measured/tools/re
          MEASURE_MODELS: ${{ matrix.models }}
          MEASURE_SKIP: ${{ matrix.skip }}
          MEASURE_SCORERS: ${{ inputs.scorers }}
          PSETS_MISSING: ${{ inputs.psets_missing }}
          KEEP_IFC: ${{ inputs.keep_ifc && '1' || '' }}
          FAMILY_DIR: ${{ matrix.families && format('{0}/_corpus/examples/Autodesk', github.workspace) || '' }}
          SAMPLE_DIR: ${{ matrix.samples && format('{0}/_samples', github.workspace) || '' }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The runner's CPU and memory use every 10 s, so a run shows how much
          # of the machine it used.
          vmstat -n -t 10 > "$RUNNER_TEMP/vmstat.log" &
          sampler=$!
          tools/ci/measure-reference-models.sh measured/target/ci models results
          kill "$sampler"
          cp "$RUNNER_TEMP/vmstat.log" "results/vmstat-$SHARD.log"
          cp measured-commit.txt results/commit.txt
          # The runner's CPU, so the compare job can say which machines the
          # wall times came from.
          grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs > "results/runner-$SHARD.txt"
      # The held-out models and BIMcollab's carry no licence: only their
      # counts leave the runner (RE-252).
      - name: Keep only the unlicensed models' counts
        shell: bash
        run: tools/ci/scrub-holdout-results.sh results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.side }}-${{ matrix.shard }}
          path: results
          if-no-files-found: error
          # Compare re-uploads them merged as measure-head and measure-base.
          retention-days: 7

  compare:
    name: Compare
    needs: [plan, measure]
    runs-on: ubuntu-24.04
    steps:
      # Each side's shards hold disjoint models; merged, they are the
      # measure-head and measure-base directories one runner used to write.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-head-*
          path: measure-head
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.plan.outputs.base == 'true'
        with:
          pattern: measure-base-*
          path: measure-base
          merge-multiple: true
      # The merged sides, under the names every reader downloads
      # (`gh run download -n measure-head`), uploaded before the summary so a
      # summary over GitHub's limit cannot lose them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-head
          path: measure-head
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.base == 'true'
        with:
          name: measure-base
          path: measure-base
          if-no-files-found: error
          overwrite: true
      - name: Summary
        run: |
          {
            echo "## Measured"
            echo
            echo "head: $(cat measure-head/commit.txt)"
            [ -d measure-base ] && echo "base: $(cat measure-base/commit.txt)"
            echo
            if [ -d measure-base ]; then
              echo "### Models and samples whose IFC differs (export time ignored)"
              echo
              for d in measure-head/*/; do
                m=$(basename "$d")
                [ -f "$d/ifc.sha256" ] || continue
                if [ ! -f "measure-base/$m/ifc.sha256" ]; then echo "- $m: no base hash"
                elif cmp -s "$d/ifc.sha256" "measure-base/$m/ifc.sha256"; then echo "- $m: identical"; else echo "- $m: **differs**"; fi
              done
              echo
              echo "### Files whose rvt-info output differs (models and families)"
              echo
              for d in measure-head/*/; do
                f=$(basename "$d")
                [ -f "$d/info.json" ] || continue
                if cmp -s "$d/info.json" "measure-base/$f/info.json" && cmp -s "$d/info.exit" "measure-base/$f/info.exit"; then echo "- $f: identical ($(cat "$d/info.exit"))"; else echo "- $f: **differs**"; fi
              done
              echo
              echo "### Times"
              echo
              echo "These jobs check what the exports hold. They run exports and scorers several at once, on several runners whose speed alone differs by up to about 1.7x, so their times are not benchmarks. Dispatch with \`timing\` to time both refs' exports on one runner (tools/ci/measure-timing.sh)."
              echo
              echo "### Scorer differences (base → head)"
              echo
              # The kept IFCs and GLBs are compared by hash above; diffed as
              # text they made a 3 GB summary GitHub refused (run
              # 41537426493). The whole diff is the compare-scorer-diff
              # artifact; the summary shows its start, under GitHub's 1 MiB.
              diff -r -U0 -x commit.txt -x 'runner*.txt' -x '*.log' -x ifc.sha256 -x diagnostics.json \
                -x '*.ifc' -x '*.glb' measure-base measure-head > scorer-diff.txt || true
              limit=$((640 * 1024))
              size=$(stat -c %s scorer-diff.txt)
              echo '```diff'
              head -c "$limit" scorer-diff.txt
              echo
              echo '```'
              if [ "$size" -gt "$limit" ]; then
                echo
                echo "**Truncated:** the scorer diff is $size bytes and this shows its first $limit; the whole diff is the \`compare-scorer-diff\` artifact."
              fi
            else
              echo "No base; the scores are in the measure-head artifact."
            fi
          } > summary.md
          size=$(stat -c %s summary.md)
          if [ "$size" -gt 1000000 ]; then
            echo "::error::the summary is $size bytes, over GitHub's 1 MiB step summary limit"
            exit 1
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the summary failed for its size: the diff is then the
        # only place the scorer differences are.
        if: ${{ !cancelled() && hashFiles('scorer-diff.txt') != '' }}
        with:
          name: compare-scorer-diff
          path: scorer-diff.txt

  # B81: the base and head jobs above run on different runners, so their wall
  # times compare machines as much as code. With `timing`, one runner builds
  # rvt-ifc at both refs and exports every model (and sample, with `samples`)
  # with each in turn (tools/ci/measure-timing.sh).
  timing:
    name: Timing (one runner)
    if: inputs.timing && inputs.base != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Head source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          path: head
      - name: Base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.base || 'main' }}
          path: base
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            head
            base
          shared-key: measure
          # As in the measure job: only main's own code saves the cache.
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' && (inputs.base == '' || inputs.base == 'main') }}
      - name: Build both
        run: |
          (cd head && git log -1 --format='%H %s' > ../head-commit.txt && cargo build --profile ci --bin rvt-ifc)
          (cd base && git log -1 --format='%H %s' > ../base-commit.txt && cargo build --profile ci --bin rvt-ifc)
      - name: Fetch the reference models
        run: tools/fetch-reference-models.sh models
      # The office models land beside the reference models, so they are timed
      # with them. The host being down is NOT MEASURED, as for the other jobs.
      - name: Fetch the BIM4LCA office models
        if: inputs.nordic
        shell: bash
        run: |
          set +e
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-measure.tsv models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIM4LCA office models NOT MEASURED: the host was unreachable" ;;
            *) echo "::error::the BIM4LCA office models no longer match research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      - name: Fetch Autodesk's sample projects
        if: inputs.samples
        env:
          SAMPLE_YEARS: ${{ inputs.sample_years }}
        run: |
          # shellcheck disable=SC2086 # SAMPLE_YEARS is the first and last year.
          tools/fetch-autodesk-samples.sh _samples $SAMPLE_YEARS
      - name: Time
        env:
          RVT_IFC_FLAGS: ${{ inputs.ifc_flags }}
        run: |
          tools/ci/measure-timing.sh base/target/ci head/target/ci timing.md models/*.rvt _samples/*.rvt
          {
            echo "## rvt-ifc time on one runner, base → head"
            echo
            echo "head: $(cat head-commit.txt)"
            echo "base: $(cat base-commit.txt)"
            echo "runner: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo
            echo "Median of three exports each, in turn on the same runner, with each export's peak resident memory."
            echo
            cat timing.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-timing
          path: timing.md
          if-no-files-found: error
