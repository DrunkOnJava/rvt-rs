# Measure a ref against Revit's own exports of the redistributable reference
# models (Core Interior, RE1, Einhoven), on GitHub's hosted runners.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f probe=probe_re70_wall_join_lists
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f probe=probe_re133_class_ordinals -f families=true
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f families=true
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f samples=true -f timing=true
#
# Each side is built once, in a job of its own (Build), at its ref: rvt-ifc,
# rvt-gltf and rvt-info, and the MCP server and the probes where the run needs
# them. They go to the side's shards as the artifact measure-bin-head or
# measure-bin-base, and each shard runs tools/ci/measure-reference-models.sh
# on them (the script is taken from the workflow's own ref, so both sides are
# scored by the same scorers). The results are uploaded
# as artifacts, and the compare job writes the differences between the two
# sides to the run summary. Local-only models (Snowdon Towers and others
# without a redistribution licence) are never fetched here. rvt-info also
# reads every model, and the compare job diffs what it printed: that is what
# measures the PartAtom parser, which the IFC export does not reach (none of
# the six reference models has a PartAtom stream; their ProjectInformation
# stream goes through the same parser). The Autodesk family corpus (phi-ag/rvt)
# is fetched when `families` is set, and on every run of a change to this
# workflow, so rvt-info reads each family's PartAtom too and the probe runs on
# it. The corpus is scored against nothing and never stored. Autodesk's sample
# projects (2015 to 2027, pinned in research/autodesk-sample-projects.tsv) are
# fetched the same way when `samples` is set, and the BIM4LCA buildings with
# Revit's exports of them (research/bim4lca-measure.tsv, CC BY-SA 4.0) when
# `nordic` is set: the office in concrete and timber, as built and at building
# permit, the housing in concrete and timber, as built and at building permit,
# and the terrain variants of both; those are scored like the reference models
# (#763, #1262, #1636).
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f nordic=true
#
# puzzbobb's 23 purpose-made Revit 2025 models with Revit's exports of all but
# one (research/r2025-models.tsv, Apache-2.0, #356) are scored the same way
# when `r2025` is set.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f r2025=true
#
# BIMcollab's example structural model, a Revit 2015 project, with Revit 2015's
# own IFC2X3 export of it (research/bimcollab-models.tsv, no redistribution
# licence, RE-198) is scored the same way when `bimcollab` is set: the one
# Revit release from 2015 to 2022 with its own export measured (#421).
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f bimcollab=true
#
# Autodesk's rac_advanced sample project of the releases 2015 to 2020 is scored
# against the one public IFC2X3 export of it, from the three.js repository
# (research/rac-advanced-export.tsv, no licence of its own, #1354, RE-330)
# when `racadv` is set, as models racadv-2015 to racadv-2020; the export and the
# files are fetched for the run and never stored or cached, only their summary
# counts are uploaded (tools/ci/scrub-holdout-results.sh), as for BIMcollab's
# example, and the export is counted apart as IFC2X3 everywhere. Name the
# scorers, since most of the suite says nothing of an IFC2X3 export; the kept
# IFC of a model is deleted with the rest of its files:
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f racadv=true -f models="racadv-*" -f scorers=space_profiles_vs_ifc
#
# With `holdout`, the held-out models (research/holdout-models.tsv, RE-252,
# and research/holdout-archive-models.tsv, #1261), for checking a rule against
# files it was not derived on: only their summary counts are uploaded
# (tools/ci/scrub-holdout-results.sh). The archive list's spent pairs, no
# longer held out, are measured in full.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f holdout=true -f models="holdout-*"
#
# `sample_years` narrows the samples to a range of releases, and
# `probe_pair_release` also runs a two-file probe on each sample and the same
# project saved by that release, the sample first, for the cross-release
# comparisons of #740 and #742:
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f samples=true -f sample_years="2026 2027" -f probe=probe_re179_revit_2027 -f probe_pair_release=2026
#
# That run holds no 2024 or 2025 sample, so the check of the 2025, 2026 and 2027
# bodies against the same project's earlier saves (tools/re/bodies_across_saves.py,
# RE-341, RE-345) compares nothing: it prints a notice and a line in the run summary,
# and is not a pass. A change to a reader of Revit 2024 to 2027 is measured with
# `samples=true` and every year (or "2024 2027"), which runs that check and
# turns the run red on a difference; without `samples=true` it does not run,
# and the summary says so.
#
# `models` keeps only the models whose names match its patterns, and
# `scorers` runs only the steps it names on them (tools/re scorers, and info,
# gltf, schema and witness; "none" for none), so a probe's run spends nothing
# on the full scorer suite. `probe` and `probe_scorer` may each name several,
# in the same order ("-" for no scorer); each probe then writes
# probe-<probe>.txt and probe_score-<probe>.txt:
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f nordic=true -f models="nordic-office-*" -f scorers=none -f probe="probe_a probe_b" -f probe_scorer="a_vs_ifc -"
#
# A scorer or schema step whose every input is as it was in an earlier run is
# not run again: its output comes from the score cache (tools/ci/measure-cache.py;
# its key, what is never cached and how it is saved are in docs/maintaining.md).
# Exports, rvt-info, rvt-gltf, the witness exports, diagnostics and probes always
# run. `score_cache=off` runs every step, as before.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=main -f score_cache=off
#
# The MCP server's answers are scored on every model (#1327): the built
# rvt-rs-mcp is started by a scripted client with no language model
# (tools/re/mcp_client.py), asked a fixed query set about the model (summary,
# levels, every element's row, rooms with areas, get_element for a spread of
# each entity, diagnostics, export_ifc), and its answers are compared with the
# model's own IFC export (a difference is a bug in the server or the export:
# the step's output ends `exit 1`, and the run summary lists each model's
# verdict) and, where Revit gave an export, with Revit's, with the pairing and
# tolerances of the class sets, storeys, space profiles, property sets and
# quantities scorers (tools/re/mcp_answers_vs_ifc.py). The server is built only
# when the run names no scorers or names this one; mcp-dump.json, each model's
# answers as the deterministic semantic dump, is in the artifact. Autodesk's
# sample projects are not asked.
#
#   gh workflow run measure.yml -f ref=my-branch -f base=none -f models="core-interior einhoven" -f scorers=mcp_answers_vs_ifc
#
# A run with a base also diffs the two sides' dumps (#1334): for each openly
# licensed model with a dump on both sides, tools/re/semantic_diff.py writes the
# semantic diff (elements added, removed and changed, offsets that moved for
# unrelated reasons dropped, identical changes collapsed) into the
# `semantic-diff` artifact. The Semantic check workflow (semantic-check.yml)
# scores that artifact with Jev and writes the `semantic diff (advisory)`
# check run on the measured head commit. A model that is not openly licensed
# has no dump and gets no diff; a dump in one fails the compare job. Only a run
# of every open model writes the check: no `models` filter, and the office and
# the Revit 2025 models on (the BIM4LCA office is where most output changes
# land). A run with a filter gets its diffs in the artifact and no check run.
# `scorers=mcp_answers_vs_ifc` keeps every model and leaves the other scorers out.
#
#   gh workflow run measure.yml -f ref=<pull request head> -f base=main -f nordic=true -f r2025=true -f scorers=mcp_answers_vs_ifc
#
# `fine_mesh=true` sets RVT_SCORER_FINE_MESH for the scorers: the three body
# scorers then also mesh both IFC files at one equal, fine deflection and print
# their `fine` rows after the output they always print (tools/re/fine_mesh.py,
# #1355, RE-331). The score cache keys on the variable.

name: Measure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to measure (default the dispatched ref)
        required: false
        default: ""
      base:
        description: Ref to compare against, or none
        required: false
        default: main
      probe:
        description: probes (probes/examples, or examples/ on an older ref) to run on each model as well (e.g. probe_re70_wall_join_lists), space-separated, empty for none
        required: false
        default: ""
      keep_ifc:
        description: Upload each model's exported IFC with the results
        type: boolean
        required: false
        default: false
      probe_scorer:
        description: tools/re scorer (no .py) for each probe, in the same order ("-" for none), run on its output and Revit's export, from the measured ref; empty for none
        required: false
        default: ""
      probe_pair_release:
        description: With samples, also run the probe on each sample of another release and the same project saved by this one (e.g. 2026), the sample first; empty for none
        required: false
        default: ""
      families:
        description: Also read every file of the phi-ag/rvt family corpus and the makers' public families (research/public-families.tsv) with rvt-info, export each and hash its IFC (so the two sides' exports are compared), and run the probe on them (fetched for the run and never stored)
        type: boolean
        required: false
        default: false
      ifc_flags:
        description: Further rvt-ifc flags for every export (e.g. --saved-meshes), empty for none
        required: false
        default: ""
      samples:
        description: Also read Autodesk's sample projects of every release 2015 to 2027 (research/autodesk-sample-projects.tsv) with rvt-info, rvt-ifc diagnostics and the probe (Autodesk-owned, fetched for the run and never stored)
        type: boolean
        required: false
        default: false
      sample_years:
        description: With samples, only the releases from the first year to the last (e.g. "2026 2027"; one year reads from it on), empty for every release
        required: false
        default: ""
      psets_missing:
        description: "tools/re/psets_vs_ifc.py's PSETS_MISSING: <set>.<property>[,...] whose missing objects the census lists by key, entity and value (e.g. Pset_ColumnCommon.Slope); empty for none"
        required: false
        default: ""
      timing:
        description: Also time rvt-ifc at base and head, in turn, three rounds per file, each file on one runner, in shards of about equal time (the base and head jobs run on different runners, whose speed alone moves an export's time by up to about 1.7x)
        type: boolean
        required: false
        default: false
      nordic:
        description: Also score the BIM4LCA office and housing buildings (concrete and timber, as built and at building permit) and their terrain variants against Revit's exports of them (research/bim4lca-measure.tsv, CC BY-SA 4.0, read by byte range and kept in the Actions cache, never committed); each large model has a shard of its own
        type: boolean
        required: false
        default: false
      r2025:
        description: Also score puzzbobb's 23 purpose-made Revit 2025 models against Revit's exports of them (research/r2025-models.tsv, Apache-2.0, fetched for a run and kept in the Actions cache, never committed)
        type: boolean
        required: false
        default: false
      bimcollab:
        description: Also score BIMcollab's example structural model (Revit 2015) against Revit 2015's export of it (research/bimcollab-models.tsv, no licence stated, fetched for the run; only its summary counts are uploaded)
        type: boolean
        required: false
        default: false
      racadv:
        description: Also score Autodesk's rac_advanced sample project of 2015 to 2020 (models racadv-2015 to racadv-2020) against the IFC2X3 export of it from the three.js repository (research/rac-advanced-export.tsv, no licence stated, fetched for the run, never stored or cached; only the summary counts are uploaded)
        type: boolean
        required: false
        default: false
      holdout:
        description: Also score the held-out models against Revit's exports of them (research/holdout-models.tsv and research/holdout-archive-models.tsv, fetched for the run; only their summary counts are uploaded)
        type: boolean
        required: false
        default: false
      models:
        description: Only the models whose names match these patterns (e.g. "nordic-office-* core-interior"), empty for every model fetched
        required: false
        default: ""
      scorers:
        description: Only these steps on the models, tools/re scorers and info, gltf, schema, witness, mcp_answers_vs_ifc (e.g. "qtos_vs_ifc witness"; a tools/re script in no scorer list runs as an IFC scorer), none for none, empty for all; every model is still exported and hashed
        required: false
        default: ""
      score_cache:
        description: 'The score cache (tools/ci/measure-cache.py, docs/maintaining.md): empty for the shared one, off to run every step, or a name for a cache of its own that this run saves to from any ref (the shared one is read as well)'
        required: false
        default: ""
      fine_mesh:
        description: 'The body scorers (mesh_bodies_vs_ifc, saved_meshes_vs_ifc, family_extrusion_bodies_vs_ifc) also mesh both IFC files at one equal, fine deflection and print `fine` rows after their own (tools/re/fine_mesh.py, #1355); their other output is as it was'
        type: boolean
        required: false
        default: false
  # A change to the measurement itself measures its own PR against main.
  pull_request:
    paths:
      - .github/workflows/measure.yml
      - tools/ci/measure-reference-models.sh
      # #822: the IFC4 property set check schema() runs, and the pinned
      # definitions it imports.
      - tools/ci/ifc4_property_sets.py
      - tools/ci/gen_standard_property_sets.py

permissions:
  contents: read

# A push to a pull request replaces that pull request's run in progress, which is
# measuring a head that is gone (2026-11-05: run 42038588757 ran 8 minutes after a
# push 16 seconds later). A dispatched run is in a group of its own, so one never
# cancels another: each was asked for its own commit and inputs.
concurrency:
  group: measure-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The work is CPU-bound (run 41748430211: 164 task-minutes in a 43-minute
  # Measure step on one 4-core runner), so each side runs as shards on runners
  # of their own: each BIM4LCA office file, Autodesk's samples in two halves
  # by release (2008 to 2023 and 2024 on: 477 and 658 MB, 2024 alone 328),
  # the held-out and spent models, and every other model with the families
  # (six jobs a side). In run 41761654404, with four a side, the
  # samples took 11.7 minutes to score and the rest, held-out models
  # included, 14.7, against 6.1 and 9.0 for the office files. A run given
  # `models`, `sample_years` or `probe_pair_release` keeps one shard, since a
  # pair probe needs both releases' samples on one runner. Compare merges the
  # shards back into the measure-head and measure-base artifacts. The build job
  # builds each side once for all its shards.
  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sides: ${{ steps.plan.outputs.sides }}
      timing: ${{ steps.plan.outputs.timing }}
      base: ${{ steps.plan.outputs.base }}
      head_sha: ${{ steps.refs.outputs.head }}
      base_sha: ${{ steps.refs.outputs.base }}
      head_on_main: ${{ steps.refs.outputs.head_on_main }}
      base_on_main: ${{ steps.refs.outputs.base_on_main }}
    steps:
      # Each ref is resolved to a full SHA once, here, so every shard of a side
      # checks out the same commit even when its branch moves during the run
      # (shards start up to minutes apart). A ref the commits API cannot
      # resolve (a pull request's refs/pull/N/head) is passed on as given. The
      # timing job, which saves its cache from the code it checks out, keeps
      # the inputs as given (CodeQL's cache-poisoning rule flags a checkout of
      # a step's output there), so it takes full SHAs.
      - name: Resolve the refs
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ inputs.ref || github.sha }}
          BASE_REF: ${{ inputs.base || 'main' }}
        run: |
          full() {
            if [[ "$1" =~ ^[0-9a-f]{40}$ || "$1" == none ]]; then
              echo "$1"
            elif sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .sha 2>/dev/null) && [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$sha"
            else
              echo "::warning::$1 is not a commit the API resolves; every shard checks it out as given" >&2
              echo "$1"
            fi
          }
          head=$(full "$HEAD_REF")
          base=$(full "$BASE_REF")
          # Whether a commit is main's own code: main's tip or an ancestor of it
          # (the compare API says `identical` or `behind`). The score cache is
          # saved only by a side whose code is main's, whichever way the commit
          # was named: a run that pins its base or head to a main SHA, as every
          # run that compares two commits does, saved nothing before this, so
          # the cache stayed cold (0 of 4,548 lookups hit in run 42980660819).
          on_main() {
            local status
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] || { echo false; return; }
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$1" --jq .status 2>/dev/null || true)
            case "$status" in identical | behind) echo true ;; *) echo false ;; esac
          }
          {
            echo "head=$head"
            echo "base=$base"
            echo "head_on_main=$(on_main "$head")"
            echo "base_on_main=$(on_main "$base")"
          } >> "$GITHUB_OUTPUT"
          echo "head ${HEAD_REF} -> ${head}; base ${BASE_REF} -> ${base}"
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
          MODELS: ${{ inputs.models }}
          YEARS: ${{ inputs.sample_years }}
          PAIR: ${{ inputs.probe_pair_release }}
          TIMING: ${{ inputs.timing && 'true' || 'false' }}
          NORDIC: ${{ inputs.nordic && 'true' || 'false' }}
          SAMPLES: ${{ inputs.samples && 'true' || 'false' }}
          R2025: ${{ inputs.r2025 && 'true' || 'false' }}
          HOLDOUT: ${{ inputs.holdout && 'true' || 'false' }}
          BIMCOLLAB: ${{ inputs.bimcollab && 'true' || 'false' }}
          RACADV: ${{ inputs.racadv && 'true' || 'false' }}
          FAMILIES: ${{ (inputs.families || github.event_name == 'pull_request') && 'true' || 'false' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import fnmatch, json, os
          e = os.environ
          def flag(name):
              return e[name] == "true"
          base = e["EVENT"] == "pull_request" or e["BASE"] not in ("", "none")
          def shard(name, models="", skip="", families=False, samples=False,
                    years="", nordic=False, r2025=False, holdout=False, bimcollab=False,
                    racadv=False):
              return dict(shard=name, models=models, skip=skip, families=families,
                          samples=samples, years=years, nordic=nordic, r2025=r2025,
                          holdout=holdout, bimcollab=bimcollab, racadv=racadv)
          rest = dict(families=flag("FAMILIES"), nordic=flag("NORDIC"),
                      r2025=flag("R2025"), holdout=flag("HOLDOUT"),
                      bimcollab=flag("BIMCOLLAB"), racadv=flag("RACADV"))
          # The large BIM4LCA models, a shard each, so that a shard fetches and
          # measures its own pair and the longest shard sets the run (#1636).
          offices = {"office-as-built": "nordic-office-as-built",
                     "office-permit": "nordic-office-permit",
                     "office-timber-as-built": "nordic-office-timber-as-built",
                     "office-timber-permit": "nordic-office-timber-permit",
                     "housing-concrete-as-built": "nordic-housing-concrete-as-built",
                     "housing-concrete-permit": "nordic-housing-concrete-permit",
                     "housing-timber-as-built": "nordic-housing-timber-as-built",
                     "housing-timber-permit": "nordic-housing-timber-permit"}
          terrain = ("nordic-office-terrain-concrete", "nordic-office-terrain-timber",
                     "nordic-housing-terrain-concrete", "nordic-housing-terrain-timber")
          patterns = e["MODELS"].split()
          def kept(model):
              return any(fnmatch.fnmatchcase(model, pattern) for pattern in patterns)
          # A filter that names only BIM4LCA models gets a shard for each large
          # one it keeps (and one for the terrain files), not one runner for all.
          nordic_only = (flag("NORDIC") and patterns and not e["YEARS"] and not e["PAIR"]
                         and not flag("SAMPLES")
                         and all(any(fnmatch.fnmatchcase(model, pattern)
                                     for model in list(offices.values()) + list(terrain))
                                 for pattern in patterns))
          if nordic_only:
              shards = [shard(name, models=model, nordic=True)
                        for name, model in offices.items() if kept(model)]
              small = [model for model in terrain if kept(model)]
              if small:
                  shards.append(shard("terrain", models=" ".join(small), nordic=True))
          elif e["MODELS"] or e["YEARS"] or e["PAIR"]:
              shards = [shard("all", models=e["MODELS"], samples=flag("SAMPLES"),
                              years=e["YEARS"], **rest)]
          else:
              shards = []
              if flag("NORDIC"):
                  shards += [shard(name, models=model, nordic=True)
                             for name, model in offices.items()]
              if flag("SAMPLES"):
                  # "-" is a pattern no model's name matches, so these shards
                  # measure samples only.
                  shards += [shard("samples-" + years.replace(" ", "-"), models="-",
                                   samples=True, years=years)
                             for years in ("2008 2023", "2024 2099")]
              # The held-out models and racadv-* are never cached (RE-252, #1354), so
              # each is measured in full on every run, and as one shard each they
              # set the length of the run: 770 and 899 seconds on the head side of
              # run 42980660819, where a shard whose steps hit the cache takes 3 to
              # 5 minutes. Each is cut by name (the held-out ones in four, the
              # 64 MB single-dwelling house of the flowbim.ee export a shard of its
              # own, as the remainder still took 454 s of the 10.2 minutes of run
              # 42997978043); a model that matches none of the named shards falls
              # into the last, so a model added to a list is measured whatever its
              # name.
              if flag("HOLDOUT"):
                  # The held-out fetch brings the spent pairs too.
                  shards += [
                      shard("held-out-offices", models="holdout-rvt-holdout-office-*",
                            holdout=True),
                      shard("held-out-rvt", models="holdout-rvt-holdout-[0-9]*",
                            holdout=True),
                      shard("held-out-house", models="holdout-AA-*", holdout=True),
                      shard("held-out", models="holdout-* spent-*",
                            skip="holdout-rvt-holdout-office-* holdout-rvt-holdout-[0-9]* holdout-AA-*",
                            holdout=True),
                  ]
              if flag("RACADV"):
                  shards += [
                      shard("racadv-2015-2016", models="racadv-2015 racadv-2016",
                            racadv=True),
                      shard("racadv-2017-2018", models="racadv-2017 racadv-2018",
                            racadv=True),
                      shard("racadv", models="racadv-*",
                            skip="racadv-2015 racadv-2016 racadv-2017 racadv-2018",
                            racadv=True),
                  ]
              skip = " ".join(offices.values()) if flag("NORDIC") else ""
              shards.append(shard("rest", skip=skip, **dict(rest, holdout=False, racadv=False)))
          sides = ["head", "base"] if base else ["head"]
          include = [dict(side=side, **s) for side in sides for s in shards]
          print("matrix=" + json.dumps({"include": include}))
          print("sides=" + json.dumps(sides))
          print("base=" + ("true" if base else "false"))
          # The timing jobs' files, in shards of about equal time. A unit's
          # seconds are its files' medians, base plus head, times the three
          # rounds, summed from the table of Measure run 41797994751 (the
          # reference models, the four office files, Autodesk's samples; the
          # housing and the timber office from that of run 42976698994). The
          # weights were taken again from the tables of runs 42977559276 and
          # 42983436373 (the mean of base and head, six times): the 2024 samples had
          # grown to 696 seconds and the 2026 and 2027 ones to about 296, where
          # four shards of the old weights took 546 to 1,014 seconds, and a fifth
          # shard takes the longest from 986 to 727 seconds. The
          # four shards of that run ran on four CPUs (two Intel Xeons, an
          # Intel Xeon Platinum and an AMD EPYC), and no runner's rows skew
          # clearly (its units took 0.98 to 1.21 of their time on the one
          # runner of run 41793618569), so the weights are not normalised.
          # Code that changes every file moves them alike, so the split stays
          # about even. A sample unit is a range of years, cut to the
          # `sample_years` input.
          housing = ["ARK_NordicLCA_Housing_Concrete_As-Built.rvt",
                     "ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt",
                     "ARK_NordicLCA_Housing_Timber_As-Built.rvt",
                     "ARK_NordicLCA_Housing_Timber_BuildingPermit.rvt"]
          timber_office = ["ARK_NordicLCA_Office_Timber_As-Built.rvt",
                           "ARK_NordicLCA_Office_Timber_BuildingPermit.rvt"]
          units = [("reference models", 68, dict(reference=True))]
          if flag("NORDIC"):
              units.append(("offices", 382, dict(offices=True)))
              # The second project's files, scored in the same run (#1694: the
              # timing table left them out, and a change to what the saved-mesh
              # pass reads moves them).
              units.append(("housing", 554, dict(bim4lca=" ".join(housing))))
              units.append(("timber office", 437, dict(bim4lca=" ".join(timber_office))))
          if flag("SAMPLES"):
              years = e["YEARS"].split()
              low = int(years[0]) if years else 0
              high = int(years[1]) if len(years) > 1 else 9999
              for label, first, last, seconds in (
                  ("samples to 2023", 0, 2023, 421),
                  ("samples 2024", 2024, 2024, 696),
                  ("samples 2025", 2025, 2025, 296),
                  ("samples 2026", 2026, 2026, 296),
                  ("samples 2027 on", 2027, 9999, 290),
              ):
                  if max(first, low) <= min(last, high):
                      ranges = f"{max(first, low)} {min(last, high)}"
                      units.append((label, seconds, dict(ranges=ranges)))
          bins = [dict(seconds=0, units=[]) for _ in range(min(5, len(units)))]
          for unit in sorted(units, key=lambda unit: -unit[1]):
              target = min(bins, key=lambda bin: bin["seconds"])
              target["seconds"] += unit[1]
              target["units"].append(unit)
          timing = [
              dict(shard=str(number),
                   what=", ".join(unit[0] for unit in bin["units"]),
                   reference=any(unit[2].get("reference") for unit in bin["units"]),
                   offices=any(unit[2].get("offices") for unit in bin["units"]),
                   bim4lca=" ".join(unit[2]["bim4lca"] for unit in bin["units"] if "bim4lca" in unit[2]),
                   ranges=";".join(unit[2]["ranges"] for unit in bin["units"] if "ranges" in unit[2]))
              for number, bin in enumerate(bins, 1)
          ]
          if not flag("TIMING") or not base:
              # The timing jobs are skipped; a matrix still needs a row.
              timing = [dict(shard="none", what="", reference=False, offices=False, bim4lca="", ranges="")]
          print("timing=" + json.dumps({"include": timing}))
          PY

  # Each side is built once, here, and every shard of the side takes the
  # binaries from the artifact measure-bin-head or measure-bin-base. Before
  # this, every shard installed Rust, restored rust-cache and, all of them at
  # once on a commit the binary cache had not seen, built the same binaries:
  # over 36 dispatched runs Build was 150 of 720 job-minutes (#1457), and a run
  # of 12 shards built 12 times. A shard now runs no cargo, no rustc and no
  # build script of the measured ref. A side whose build fails fails the run:
  # that side's shards fail at the artifact download, the other side's still
  # run, Compare (which needs every shard) is skipped, and the gates' job
  # writes NOT MEASURED.
  build:
    name: Build ${{ matrix.side }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # The other side's build still finishes, and saves the binary cache.
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    steps:
      - name: Measured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
          path: measured
      - name: Install Rust stable
        uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: measured
          shared-key: measure
          # Runs dispatched from a feature branch saved caches no other run
          # could restore (C2). A run from main that measures other code
          # (`ref` or `base` naming a branch, a SHA or a contributor's pull
          # request) does not save either: that code's build scripts run
          # here, and a cache they wrote would be restored by every later
          # main run.
          # This job is the only one of a side, so it saves.
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.side == 'base' && (inputs.base == '' || inputs.base == 'main') || matrix.side != 'base' && inputs.ref == '') }}
      # The three binaries every run of a commit builds alike (about 70 s of a
      # cold build) are kept under the commit's full SHA, the toolchain and the
      # profile: what the cache holds is what that code builds to, so a run of
      # any ref may save it, and only a run of that commit restores it. A ref
      # that is not a full SHA is built each time. The probe examples are
      # always built.
      # #1327: the MCP server (rvt-rs-mcp, a crate of its own, rustc 1.88 or
      # later) is built too when the run scores its answers, which a run that
      # names other scorers does not, and the key says which set of binaries
      # the entry holds. A ref older than the crate has none to build.
      - name: Binary cache key
        id: binaries-key
        shell: bash
        env:
          MEASURED: ${{ matrix.side == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
          SCORERS: ${{ inputs.scorers }}
        run: |
          mcp=false
          case " $SCORERS " in
            "  " | *" mcp_answers_vs_ifc "*) mcp=true ;;
          esac
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          if [[ "$MEASURED" =~ ^[0-9a-f]{40}$ ]]; then
            suffix=""
            [ "$mcp" = true ] && suffix="-mcp"
            echo "key=rvt-bin-v2-$MEASURED-$RUNNER_OS-$RUNNER_ARCH-$(rustc -vV | sha256sum | cut -c1-16)-ci$suffix" >> "$GITHUB_OUTPUT"
          else
            echo "the measured ref is not a full SHA, so its binaries are built each time"
          fi
      - name: Restore the binaries
        id: binaries
        if: steps.binaries-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            measured/target/ci/rvt-ifc
            measured/target/ci/rvt-gltf
            measured/target/ci/rvt-info
            measured/target/ci/rvt-rs-mcp
          key: ${{ steps.binaries-key.outputs.key }}
      # Builds what is missing, then copies exactly what the shards run into
      # ../bin-out: the binaries, and each probe example that exists at this
      # ref, without cargo's hashed copies and dependency files.
      - name: Build
        id: build
        working-directory: measured
        run: |
          if [ "$BINARIES_CACHED" = true ]; then
            echo "rvt-ifc, rvt-gltf and rvt-info (and rvt-rs-mcp, where the key says so) restored from the binary cache"
          else
            cargo build --profile ci --bin rvt-ifc --bin rvt-gltf --bin rvt-info
            # The server is optional: a ref without the crate, or one whose
            # server does not build, leaves the answers NOT MEASURED on this
            # side and fails no other scorer.
            if [ "$WITH_MCP" = true ]; then
              if [ ! -f rvt-mcp/Cargo.toml ]; then
                echo "::warning::the measured ref has no rvt-mcp crate: the MCP server's answers are NOT MEASURED on this side"
              elif cargo build --profile ci -p rvt-rs-mcp --bin rvt-rs-mcp; then
                echo "mcp_built=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::rvt-rs-mcp did not build at the measured ref: the MCP server's answers are NOT MEASURED on this side"
              fi
            fi
          fi
          # A base older than a probe has no such example; it is skipped there.
          # Probes live in the rvt-probes crate (probes/examples) since it was
          # split out; a ref from before that has them in examples/. Both build
          # into the workspace's target/ci/examples.
          examples=()
          probes=()
          probe_names=()
          for probe in $PROBE; do
            if [ -f "probes/examples/$probe.rs" ]; then
              probes+=(--example "$probe")
              probe_names+=("$probe")
            elif [ -f "examples/$probe.rs" ]; then
              examples+=(--example "$probe")
              probe_names+=("$probe")
            else
              echo "::notice::$probe does not exist at the measured ref: skipped on this side"
            fi
          done
          if [ "${#examples[@]}" -gt 0 ]; then
            cargo build --profile ci "${examples[@]}"
          fi
          if [ "${#probes[@]}" -gt 0 ]; then
            cargo build --profile ci -p rvt-probes "${probes[@]}"
          fi
          out=../bin-out
          mkdir -p "$out/examples"
          for bin in rvt-ifc rvt-gltf rvt-info; do
            cp "target/ci/$bin" "$out/$bin"
          done
          if [ "$WITH_MCP" = true ] && [ -f target/ci/rvt-rs-mcp ]; then
            cp target/ci/rvt-rs-mcp "$out/rvt-rs-mcp"
          fi
          for probe in "${probe_names[@]}"; do
            cp "target/ci/examples/$probe" "$out/examples/$probe"
          done
          # The commit the binaries are of, which each shard checks against its
          # own checkout of the ref (a ref that is not a full SHA can move).
          git rev-parse HEAD > "$out/built-commit.txt"
          # What compiled them, for the key of a base commit's reused results.
          rustc -vV | sha256sum | cut -c1-16 > "$out/rustc-version.txt"
          {
            echo "### Binaries of the $SIDE side"
            echo
            echo "- commit: $(git log -1 --format='%H %s')"
            echo "- rvt-ifc, rvt-gltf and rvt-info: $([ "$BINARIES_CACHED" = true ] && echo 'restored from the binary cache' || echo 'built')"
            echo "- rvt-rs-mcp: $([ -f "$out/rvt-rs-mcp" ] && echo 'in the artifact' || echo 'not in the artifact (the run does not score it, or the ref has no server that builds)')"
            echo "- probes: ${probe_names[*]:-none}"
            echo
            echo '```'
            (cd "$out" && du -a -k . | sort -k2)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PROBE: ${{ inputs.probe }}
          SIDE: ${{ matrix.side }}
          BINARIES_CACHED: ${{ steps.binaries.outputs.cache-hit }}
          WITH_MCP: ${{ steps.binaries-key.outputs.mcp }}
      # One job a side saves the key. A run from a pull request saves nothing,
      # its cache being its own. A key that says the server is in it is saved
      # only when the server was built. Head and base at one commit save the
      # same key from two jobs: the second is told it is taken.
      - name: Save the binaries
        if: ${{ success() && github.event_name == 'workflow_dispatch' && steps.binaries-key.outputs.key != '' && steps.binaries.outputs.cache-hit != 'true' && (steps.binaries-key.outputs.mcp != 'true' || steps.build.outputs.mcp_built == 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            measured/target/ci/rvt-ifc
            measured/target/ci/rvt-gltf
            measured/target/ci/rvt-info
            measured/target/ci/rvt-rs-mcp
          key: ${{ steps.binaries-key.outputs.key }}
      # Artifacts do not keep the executable bit; each shard sets it again. The
      # names match neither measure-head-* nor measure-base-*, which Compare and
      # the gates download.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-bin-${{ matrix.side }}
          path: bin-out
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  measure:
    name: Measure ${{ matrix.side }} ${{ matrix.shard }}
    needs: [plan, build]
    # Also when a Build job failed: a shard of that side then fails at the
    # artifact download, and the other side's shards still run, so its results
    # and the gates' verdict are not lost with it. The run is red either way,
    # and Compare, which needs every shard, is skipped.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
          path: measured
      # The binaries come from this side's Build job (artifacts do not keep the
      # executable bit). Downloaded after the measured checkout, which cleans
      # its path. A ref that is not a full SHA can move between the two jobs;
      # then the binaries and this source would be two commits.
      - name: Measured binaries
        id: dl_bin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: measure-bin-${{ matrix.side }}
          path: measured/target/ci
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Measured binaries
        if: steps.dl_bin.outcome == 'failure'
        run: sleep 20
      - name: Measured binaries (second attempt)
        if: steps.dl_bin.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: measure-bin-${{ matrix.side }}
          path: measured/target/ci
      - name: Check the binaries are of this source, and make them executable
        shell: bash
        run: |
          built=$(cat measured/target/ci/built-commit.txt)
          have=$(git -C measured rev-parse HEAD)
          if [ "$built" != "$have" ]; then
            echo "::error::the binaries were built at $built and this shard's source is at $have: the ref moved during the run"
            exit 1
          fi
          rm measured/target/ci/built-commit.txt
          echo "RUSTC_HASH=$(cat measured/target/ci/rustc-version.txt)" >> "$GITHUB_ENV"
          rm measured/target/ci/rustc-version.txt
          find measured/target/ci -type f -exec chmod +x {} +
          git -C measured log -1 --format='%H %s' > measured-commit.txt
      # The base side of a run measures a commit that earlier runs have often
      # measured already: 45% of Measure's runner-minutes in a sample of 40 runs.
      # Its results are reused when everything that can change them is the same:
      # the base commit, the workflow, its scorers and fetch scripts, the pins
      # under research/, the inputs and the shard, the compiler and the runner image. A run
      # with a probe, `keep_ifc` or `timing` measures afresh. What is kept is the
      # `results` directory after the scrub, which is what the artifact uploads
      # anyway, so a held-out model's cache holds no more than its public counts.
      - name: Key of this base commit's earlier results
        id: reuse-key
        if: github.event_name == 'workflow_dispatch' && matrix.side == 'base' && inputs.probe == '' && inputs.keep_ifc != true && inputs.timing != true
        shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base_sha }}
          INPUTS: ${{ toJSON(inputs) }}
          MATRIX: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          tools=$(git ls-files -s .github/workflows/measure.yml .github/actions tools/ci tools/re tools/fetch-reference-models.sh tools/fetch-autodesk-samples.sh research | sha256sum | cut -c1-32)
          options=$(jq -Sc 'del(.ref, .base, .score_cache)' <<<"$INPUTS" | sha256sum | cut -c1-16)
          shard=$(jq -Sc . <<<"$MATRIX" | sha256sum | cut -c1-16)
          echo "key=measure-results-v1-$BASE-$tools-$options-$shard-$RUSTC_HASH-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Results this base commit already has
        id: reuse
        if: steps.reuse-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: results
          key: ${{ steps.reuse-key.outputs.key }}
      - name: Say that the results are reused
        if: steps.reuse.outputs.cache-hit == 'true'
        shell: bash
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "::notice::the base side of ${SHARD} reuses earlier results of the same inputs (${KEY})"
          echo "Base side of ${SHARD}: reused earlier results, key ${KEY}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.reuse.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Install IfcOpenShell
        if: steps.reuse.outputs.cache-hit != 'true'
        run: python -m pip install --require-hashes -r tools/ci/requirements-ifc.txt
      # The score cache (tools/ci/measure-cache.py, docs/maintaining.md): a
      # scorer or schema step whose every input is as it was in an earlier run
      # takes that run's output. Every run restores the newest cache of its
      # shard; it is saved only where the Rust cache is (the workflow
      # dispatched from main and the side's commit on main's history, main's
      # tip or an ancestor of it however the run named it, so that code of
      # another ref never writes what a later main run reads), or under a name
      # of its own that `score_cache` gives a run from any ref, which main's
      # runs never read. Entries are named by what
      # they were made from, so the sides and the flags share them. Each shard
      # keeps a cache of its own, named by the shard whatever the shard is
      # called, and ends its name with a `.` that no shard name holds, so one
      # shard's prefix is never another's.
      # The held-out models, BIMcollab's, Autodesk's rac_advanced sample scored
      # against an export with no licence (racadv-*) and the pairs once held out
      # (spent-*) are never cached (RE-252).
      - name: Score cache key
        if: steps.reuse.outputs.cache-hit != 'true'
        id: score-cache-key
        shell: bash
        env:
          SCORE_CACHE: ${{ inputs.score_cache }}
          SHARD: ${{ matrix.shard }}
          SIDE: ${{ matrix.side }}
          SAVE_FROM_MAIN: ${{ github.ref == 'refs/heads/main' && (matrix.side == 'base' && needs.plan.outputs.base_on_main == 'true' || matrix.side != 'base' && needs.plan.outputs.head_on_main == 'true') }}
        run: |
          enabled=true
          save=false
          main=measure-scores-v2-main-
          case "$SCORE_CACHE" in
            off)
              enabled=false
              ;;
            "")
              own=$main
              [ "$SAVE_FROM_MAIN" = true ] && save=true
              ;;
            *)
              if ! [[ "$SCORE_CACHE" =~ ^[A-Za-z0-9._]{1,40}$ ]]; then
                echo "::error::score_cache is off, or a name of up to 40 letters, digits, dots and underscores"
                exit 1
              fi
              own="measure-scores-v2-x-$SCORE_CACHE-"
              save=true
              ;;
          esac
          {
            echo "enabled=$enabled"
            echo "save=$save"
            echo "prefix=$own$SHARD."
            echo "restore<<END"
            # A side restores its own side's newest entry first. Head and base
            # export different files wherever the measured change reaches, so
            # an entry of the other side hits only for the models both write
            # alike: a second run restored whichever side saved last, and 8%
            # of its lookups missed for that reason alone (run 42990521699).
            echo "$own$SHARD.$SIDE-"
            echo "$own$SHARD."
            if [ "$own" != "$main" ]; then
              echo "$main$SHARD.$SIDE-"
              echo "$main$SHARD."
            fi
            echo "END"
          } >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            echo "MEASURE_CACHE_DIR=$GITHUB_WORKSPACE/_score-cache" >> "$GITHUB_ENV"
            echo "MEASURE_CACHE_WORK=$RUNNER_TEMP/score-cache-work" >> "$GITHUB_ENV"
          fi
          echo "score cache: enabled=$enabled save=$save key prefix $own$SHARD."
      # No build script of the measured ref runs in a shard: the Build job
      # runs them, on a runner that holds no score cache. What the shard does
      # run is the measured ref's binaries and, for a probe, its scorers, with
      # this cache writable, so the rule on saving it (main's own code only) is
      # as it was before the build moved out of the shard.
      - name: Restore the score cache
        if: steps.reuse.outputs.cache-hit != 'true' && (steps.score-cache-key.outputs.enabled == 'true')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _score-cache
          key: ${{ steps.score-cache-key.outputs.prefix }}${{ matrix.side }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.score-cache-key.outputs.restore }}
      - name: Fetch the reference models
        if: steps.reuse.outputs.cache-hit != 'true'
        run: tools/fetch-reference-models.sh models
      # The office models' host being down is NOT MEASURED; a file that no
      # longer matches its pin fails the run.
      # The office files (VTT, CC BY-SA 4.0) and puzzbobb's R2025 models
      # (Apache-2.0) are restored from the Actions cache, as CI restores its
      # BIM4LCA models, and saved from main: with the models in shards of
      # their own, up to six jobs fetched them at once, and in run 41767184413
      # one shard waited 27 minutes on the office host before giving up
      # (#1237). A restored office file is checked against its pin like a
      # fetched one; a restored R2025 model was checked when the run that
      # saved it fetched its archive, and only a job measuring main's own code
      # saves. The held-out models carry no licence and are never cached.
      # A shard fetches and caches only the BIM4LCA pairs it measures: each
      # large model has a shard of its own (the plan job), and the rest shard
      # takes the four small terrain pairs. The files come from the table of
      # models in tools/ci/measure-reference-models.sh, by the shard's filter
      # and skip list, and the cache key names them, so a shard restores the
      # files of its own models (about 180 to 200 MB for the largest pair)
      # and never the others' (#1636).
      - name: Plan the BIM4LCA files
        id: bim4lca-files
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.nordic)
        shell: bash
        env:
          MODELS: ${{ matrix.models }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          files=()
          while IFS='|' read -r model rvt ifc; do
            keep=false
            if [ -z "$MODELS" ]; then
              keep=true
            else
              for pattern in $MODELS; do
                # The patterns are globs, as MEASURE_MODELS' are.
                # shellcheck disable=SC2254
                case "$model" in $pattern) keep=true ;; esac
              done
            fi
            for pattern in $SKIP; do
              # shellcheck disable=SC2254
              case "$model" in $pattern) keep=false ;; esac
            done
            if $keep; then files+=("$rvt" "$ifc"); fi
          done < <(grep -E '^nordic-[a-z-]+[|]' tools/ci/measure-reference-models.sh)
          echo "files=${files[*]-}" >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s\n' "${files[@]-}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the BIM4LCA models
        id: bim4lca-cache
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.nordic) && steps.bim4lca-files.outputs.files != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _bim4lca-measure
          key: bim4lca-measure-${{ steps.bim4lca-files.outputs.key }}-${{ hashFiles('research/bim4lca-measure.tsv', 'tools/ci/fetch-bim4lca.py') }}
      - name: Fetch the BIM4LCA models
        id: bim4lca
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.nordic) && steps.bim4lca-files.outputs.files != ''
        shell: bash
        env:
          FILES: ${{ steps.bim4lca-files.outputs.files }}
        run: |
          set +e
          # The names have no spaces; the shell splits them into arguments.
          # shellcheck disable=SC2086
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-measure.tsv _bim4lca-measure $FILES
          status=$?
          set -e
          case "$status" in
            0)
              # Only the pinned files this shard measures, by name, so nothing
              # else in the folder reaches the models.
              mkdir -p models
              for name in $FILES; do ln -f "_bim4lca-measure/$name" models/; done
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "::warning::BIM4LCA models NOT MEASURED: the host was unreachable" ; : > "$RUNNER_TEMP/not-measured" ;;
            *) echo "::error::the BIM4LCA models no longer match research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      - name: Save the BIM4LCA models
        # Saved only by a job that measured main's own code, as rust-cache's
        # save-if. The rule was made when a job building another ref ran that
        # ref's build scripts before the fetch, which could have written into
        # the folder; the build is a job of its own now, and the rule is kept
        # as it was.
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.nordic && github.ref == 'refs/heads/main' && steps.bim4lca-cache.outputs.cache-hit != 'true' && steps.bim4lca.outputs.ok == 'true' && (matrix.side == 'base' && (inputs.base == '' || inputs.base == 'main') || matrix.side != 'base' && inputs.ref == ''))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _bim4lca-measure
          key: ${{ steps.bim4lca-cache.outputs.cache-primary-key }}
      # The archive being unreachable is NOT MEASURED; an archive that no
      # longer matches its pin fails the run.
      - name: Restore the R2025 models
        id: r2025-cache
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.r2025)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _r2025
          key: r2025-${{ hashFiles('research/r2025-models.tsv', 'tools/ci/fetch-r2025-models.sh') }}
      - name: Fetch the R2025 models
        id: r2025
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.r2025)
        shell: bash
        env:
          HIT: ${{ steps.r2025-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != true ]; then
            set +e
            tools/ci/fetch-r2025-models.sh research/r2025-models.tsv _r2025
            status=$?
            set -e
          else
            status=0
          fi
          case "$status" in
            0) mkdir -p models/r2025 && ln -f _r2025/r2025/* models/r2025/ && echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "::warning::R2025 models NOT MEASURED: the archive could not be downloaded" ; : > "$RUNNER_TEMP/not-measured" ;;
            *) echo "::error::an R2025 archive no longer matches research/r2025-models.tsv"; exit 1 ;;
          esac
      - name: Save the R2025 models
        # Saved only by a job that measured main's own code (see above).
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.r2025 && github.ref == 'refs/heads/main' && steps.r2025-cache.outputs.cache-hit != 'true' && steps.r2025.outputs.ok == 'true' && (matrix.side == 'base' && (inputs.base == '' || inputs.base == 'main') || matrix.side != 'base' && inputs.ref == ''))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _r2025
          key: ${{ steps.r2025-cache.outputs.cache-primary-key }}
      # BIMcollab's host being unreachable is NOT MEASURED; a file that no
      # longer matches its pin fails the run.
      - name: Fetch the BIMcollab example model
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.bimcollab)
        shell: bash
        run: |
          set +e
          tools/ci/fetch-bimcollab.sh research/bimcollab-models.tsv models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIMcollab example model NOT MEASURED: an archive could not be downloaded" ; : > "$RUNNER_TEMP/not-measured" ;;
            *) echo "::error::the BIMcollab example model no longer matches research/bimcollab-models.tsv"; exit 1 ;;
          esac
      # The export's host being unreachable is NOT MEASURED; a file that no
      # longer matches its pin fails the run. Nothing is cached.
      - name: Fetch Autodesk's rac_advanced sample and its IFC2X3 export
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.racadv)
        shell: bash
        run: |
          set +e
          tools/ci/fetch-rac-advanced-pair.sh models
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::rac_advanced and its IFC2X3 export NOT MEASURED: a file could not be downloaded" ; : > "$RUNNER_TEMP/not-measured" ;;
            *) echo "::error::a rac_advanced file or its export no longer matches its pin (research/rac-advanced-export.tsv, research/autodesk-sample-projects.tsv)"; exit 1 ;;
          esac
      # A held-out model's host still unreachable after the fetchers' resumed
      # retries (tools/ci/fetch-resume.sh) fails the run with NOT MEASURED, as a
      # file that no longer matches its pin does: a run asked for the held-out
      # check that checked nothing must not read as a pass (#1392).
      - name: Fetch the held-out models
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.holdout)
        shell: bash
        run: |
          set +e
          tools/ci/fetch-holdout-models.sh research/holdout-models.tsv models
          status=$?
          if [ "$status" = 0 ]; then
            tools/ci/fetch-holdout-archives.sh research/holdout-archive-models.tsv models
            status=$?
          fi
          set -e
          case "$status" in
            0) ;;
            2) echo "::error::held-out models NOT MEASURED: a file could not be downloaded after every retry"; exit 1 ;;
            *) echo "::error::a held-out model no longer matches its pin in research/holdout-models.tsv or research/holdout-archive-models.tsv"; exit 1 ;;
          esac
      - name: Fetch the family corpus
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.families)
        uses: $/.github/actions/fetch-corpus
        with:
          repository: phi-ag/rvt
          path: _corpus
      # Families their makers publish (research/public-families.tsv, #152),
      # read with the family corpus. An unreachable host is NOT MEASURED.
      - name: Fetch the makers' public families
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.families)
        run: tools/fetch-public-families.sh _corpus/examples/Autodesk
      - name: Fetch Autodesk's sample projects
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.samples)
        env:
          SAMPLE_YEARS: ${{ matrix.years }}
        run: |
          # shellcheck disable=SC2086 # SAMPLE_YEARS is the first and last year.
          tools/fetch-autodesk-samples.sh _samples $SAMPLE_YEARS
      - name: Measure
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          PROBE: ${{ inputs.probe }}
          RVT_IFC_FLAGS: ${{ inputs.ifc_flags }}
          PROBE_SCORER: ${{ inputs.probe_scorer }}
          PROBE_PAIR_RELEASE: ${{ inputs.probe_pair_release }}
          PROBE_SCORER_DIR: measured/tools/re
          MEASURE_MODELS: ${{ matrix.models }}
          MEASURE_SKIP: ${{ matrix.skip }}
          MEASURE_SCORERS: ${{ inputs.scorers }}
          PSETS_MISSING: ${{ inputs.psets_missing }}
          KEEP_IFC: ${{ inputs.keep_ifc && '1' || '' }}
          MCP_REQUIRE_FOLDED_FIELD: ${{ matrix.side != 'base' && '1' || '' }}
          MCP_REQUIRE_SPACE_KIND: ${{ matrix.side != 'base' && '1' || '' }}
          # A run of the samples checks the Areas of rac_advanced across its
          # 2024 to 2027 saves on the head side (main writes none on 2025 to
          # 2027) whenever all four samples are in it, and its 2021 save against
          # its 2022 save (main writes none on 2021) whenever both are, and says
          # so when not.
          AREAS_ACROSS_SAVES: ${{ matrix.side != 'base' && matrix.samples && '1' || '' }}
          RVT_SCORER_FINE_MESH: ${{ inputs.fine_mesh && '1' || '' }}
          FAMILY_DIR: ${{ matrix.families && format('{0}/_corpus/examples/Autodesk', github.workspace) || '' }}
          SAMPLE_DIR: ${{ matrix.samples && format('{0}/_samples', github.workspace) || '' }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The runner's CPU and memory use every 10 s, so a run shows how much
          # of the machine it used.
          vmstat -n -t 10 > "$RUNNER_TEMP/vmstat.log" &
          sampler=$!
          tools/ci/measure-reference-models.sh measured/target/ci models results
          kill "$sampler"
          cp "$RUNNER_TEMP/vmstat.log" "results/vmstat-$SHARD.log"
          cp measured-commit.txt results/commit.txt
          # The runner's CPU, so the compare job can say which machines the
          # wall times came from.
          grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs > "results/runner-$SHARD.txt"
      # Entries not used for 21 days go, then the oldest past 256 MiB; the cache
      # is saved only if this run kept an entry, pruned one or refreshed one not
      # used for three days (tools/maintainer/clean_caches.py deletes the
      # generations it supersedes).
      - name: Finish the score cache
        id: score-cache
        if: ${{ steps.reuse.outputs.cache-hit != 'true' && (!cancelled() && steps.score-cache-key.outputs.enabled == 'true') }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p results
          python tools/ci/measure-cache.py finish --report "results/score-cache-$SHARD.log"
      - name: Save the score cache
        if: ${{ steps.reuse.outputs.cache-hit != 'true' && (!cancelled() && github.event_name == 'workflow_dispatch' && steps.score-cache.outputs.changed == 'true' && steps.score-cache-key.outputs.save == 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _score-cache
          key: ${{ steps.score-cache-key.outputs.prefix }}${{ matrix.side }}-${{ matrix.side == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The held-out models, BIMcollab's and the racadv-* models (scored against
      # an export that carries no licence) leave the runner as counts only
      # (RE-252, #1354).
      # A shard asked for the held-out check that produced no held-out result
      # (every model filtered out by `models`, or nothing scored) fails, so an
      # empty check never reads as a pass (#1392).
      - name: The held-out check measured something
        if: steps.reuse.outputs.cache-hit != 'true' && (matrix.holdout)
        shell: bash
        run: |
          measured=$(find results -maxdepth 1 -type d \( -name 'holdout-*' -o -name 'spent-*' \) | wc -l | tr -d ' ')
          echo "held-out and spent models measured: ${measured}"
          if [ "${measured}" = 0 ]; then
            echo "::error::holdout=true but no held-out model was measured: the models input excluded them (use models=\"holdout-* spent-*\" or leave it empty), or none could be scored"
            exit 1
          fi
      # Results only worth keeping if nothing was left out: a host that was down,
      # a server that did not build, or a scorer that died would otherwise stand
      # for this base commit in every later run. Read before the scrub drops them.
      - name: Whether these results are whole
        id: whole
        if: steps.reuse-key.outputs.key != '' && steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        env:
          FAMILIES: ${{ matrix.families }}
        run: |
          whole=true
          [ ! -e "$RUNNER_TEMP/not-measured" ] || { whole=false; echo "a model's host was down"; }
          [ -e measured/target/ci/rvt-rs-mcp ] || { whole=false; echo "the MCP server did not build"; }
          if grep -rlE '^exit [1-9]' results --include='*.txt' --include='*.log' --include='*.exit'; then whole=false; echo "an export or a scorer exited non-zero"; fi
          # The public families' fetch reports a host that was down only in its log.
          [ "$FAMILIES" != true ] || { whole=false; echo "a family shard is not kept"; }
          echo "whole=$whole" >> "$GITHUB_OUTPUT"
      - name: Keep only the unlicensed models' counts
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        run: tools/ci/scrub-holdout-results.sh results
      - name: Keep this base commit's scrubbed results for later runs
        if: steps.whole.outputs.whole == 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: results
          key: ${{ steps.reuse-key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.side }}-${{ matrix.shard }}
          path: results
          if-no-files-found: error
          # A re-run of all jobs uploads the same names again.
          overwrite: true
          # Compare re-uploads them merged as measure-head and measure-base.
          retention-days: 7

  # The same-project gates. No Revit export of a 2025, 2026 or 2027 sample's
  # beam, tread landing, stair run or sketch outline exists to score them
  # against (RE-341, RE-345), nor of an Area on 2025 to 2027 (#1261, #1194), so
  # each 2025, 2026 and 2027 save of rac_advanced, rac_basic and rst_basic is
  # held to the same project's earlier 2024 and 2025 saves
  # (tools/re/bodies_across_saves.py) and rac_advanced's Areas to its 2024
  # save's, its 2021 save's to its 2022 save's (#1434;
  # tools/re/areas_across_saves.py). The measuring script runs
  # both beside the samples and writes their files; this job reads the head
  # side's shards and fails on a difference, a missing file or a check that did
  # not run for want of one. It is a job of its own, with a step for each gate
  # that runs whatever the other did, so that a failure turns the run red and
  # Compare, which does not need it, still reports (a failed step in a measure
  # shard would skip Compare). The base side is not gated: its files show what
  # each check says of `main`. A check skipped on purpose (no `samples`, no 2025,
  # 2026 or 2027 sample, the `scorers` excluding it, a run without the earlier saves,
  # a run with `ifc_flags`) says so in a notice and in the run summary. Measure is not a required check:
  # the failure is read before landing, by the landing rule.
  # A failed Build job of the head side leaves no head results to read: the two
  # checks are then left out (they would fail on a missing directory, which
  # says nothing) and the verdict, written all the same, reads NOT MEASURED. A
  # failed Build job of the base side leaves the head results, which are
  # checked as always; the verdict then reads NOT MEASURED, or fails if a
  # result does, since a measure shard ended red.
  same-project-gates:
    name: Same-project gates
    needs: [plan, build, measure]
    # Also after a red shard: a difference the other shards found still has to reach
    # the verdict, which reads such a run as NOT MEASURED unless a result fails.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # the verdict, on the measured commit
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci/check-bodies-across-saves.sh
            tools/ci/check-areas-across-saves.sh
            tools/ci/same_project_verdict.py
          sparse-checkout-cone-mode: false
      # One directory for each shard: two shards write an areas_across_saves.txt.
      - id: dl_head_results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: measure-head-*
          path: measure-head
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download measure-head-*
        if: steps.dl_head_results.outcome == 'failure'
        run: sleep 20
      - name: Download measure-head-* (second attempt)
        if: steps.dl_head_results.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-head-*
          path: measure-head
      - name: Head results
        id: results
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          if [ -n "$(find measure-head -type f -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            msg="No head shard left a result (the Build jobs ended $BUILD_RESULT, the measure shards $MEASURE_RESULT): the same-project gates compared nothing, and their verdict reads NOT MEASURED."
            echo "::warning::$msg"
            printf -- '- %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bodies match the same project's earlier save
        if: ${{ steps.results.outputs.present == 'true' }}
        shell: bash
        env:
          SAMPLES: ${{ inputs.samples }}
          SAMPLE_YEARS: ${{ inputs.sample_years }}
          SCORERS: ${{ inputs.scorers }}
        run: tools/ci/check-bodies-across-saves.sh measure-head
      - name: The Areas agree across rac_advanced's saves
        if: ${{ !cancelled() && steps.results.outputs.present == 'true' }}
        shell: bash
        env:
          SAMPLES: ${{ inputs.samples }}
        run: tools/ci/check-areas-across-saves.sh measure-head
      # What the two found, as a check run on the commit Measure measured, which
      # a landing reads across a pull request's commits: Griffin chose these gates
      # to block landing, and Measure is not a required check. Only a run a
      # maintainer dispatched writes one. success needs both gates to have compared
      # every save; a run that compared less reads NOT MEASURED, never a pass.
      - name: The verdict, on the measured commit
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MEASURED: ${{ needs.plan.outputs.head_sha }}
          SAMPLES: ${{ inputs.samples }}
          SAMPLE_YEARS: ${{ inputs.sample_years }}
          SCORERS: ${{ inputs.scorers }}
          IFC_FLAGS: ${{ inputs.ifc_flags }}
          # A shard that ended red because its side's build did is told apart.
          MEASURE_RESULT: ${{ needs.build.result != 'success' && format('{0}, the Build jobs ended {1}', needs.measure.result, needs.build.result) || needs.measure.result }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$MEASURED" --jq .sha)
          # The `=` forms: `--saved-meshes` is a value ifc_flags takes.
          python3 tools/ci/same_project_verdict.py measure-head --flags="$IFC_FLAGS" --samples="$SAMPLES" \
            --sample-years="$SAMPLE_YEARS" --scorers="$SCORERS" --measure-result="$MEASURE_RESULT" > verdict.json
          cat verdict.json
          jq --arg sha "$sha" --arg from "Scored by workflow commit $GITHUB_WORKFLOW_SHA, run $GITHUB_RUN_ID" \
            '{name: "same-project gates", head_sha: $sha, status: "completed", conclusion: .conclusion,
              output: {title: .title, summary: (.summary + "\n- " + $from)}}' verdict.json \
            | gh api -X POST "repos/$REPO/check-runs" --input - --jq '"wrote check run \(.id): \(.conclusion)"'

  compare:
    name: Compare
    needs: [plan, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The semantic diff's script and the IfcSpace kinds' total (#1437), from the
      # workflow's own ref (this job holds no secret and runs no measured code).
      # First, since a checkout cleans the workspace.
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/re/semantic_diff.py
            tools/re/space_kinds_vs_ifc.py
            tools/re/cmp_measure.py
            tools/re/counted_apart.py
            tools/re/box_reasons.py
            tools/re/measure_verdict.py
          sparse-checkout-cone-mode: false
      # Each side's shards hold disjoint models; merged, they are the
      # measure-head and measure-base directories one runner used to write.
      - id: dl_head
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: measure-head-*
          path: measure-head
          merge-multiple: true
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download measure-head-*
        if: steps.dl_head.outcome == 'failure'
        run: sleep 20
      - name: Download measure-head-* (second attempt)
        if: steps.dl_head.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-head-*
          path: measure-head
          merge-multiple: true
      - id: dl_base
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        if: needs.plan.outputs.base == 'true'
        with:
          pattern: measure-base-*
          path: measure-base
          merge-multiple: true
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download measure-base-*
        if: needs.plan.outputs.base == 'true' && steps.dl_base.outcome == 'failure'
        run: sleep 20
      - name: Download measure-base-* (second attempt)
        if: needs.plan.outputs.base == 'true' && steps.dl_base.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-base-*
          path: measure-base
          merge-multiple: true
      # The head side's shards one by one, for what two shards write under one
      # name: the merged measure-head keeps one of their areas_across_saves.txt,
      # and a shard that skipped the gate must not hide the one that ran it.
      - id: dl_head_shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: measure-head-*
          path: measure-head-shards
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download measure-head-*
        if: steps.dl_head_shards.outcome == 'failure'
        run: sleep 20
      - name: Download measure-head-* (second attempt)
        if: steps.dl_head_shards.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-head-*
          path: measure-head-shards
      # The merged sides, under the names every reader downloads
      # (`gh run download -n measure-head`), uploaded before the summary so a
      # summary over GitHub's limit cannot lose them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-head
          path: measure-head
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.base == 'true'
        with:
          name: measure-base
          path: measure-base
          if-no-files-found: error
          overwrite: true
      - name: Summary
        run: |
          # The kept IFCs and GLBs are compared by hash below; diffed as
          # text they made a 3 GB summary GitHub refused (run
          # 41537426493). The whole diff is the compare-scorer-diff
          # artifact; the summary shows its start, under GitHub's 1 MiB.
          # mcp-dump.json is the MCP answers' semantic dump (#1327, read by
          # #1334's merge check), megabytes on the office: in the artifact,
          # not in this diff. Made first, for the verdict.
          if [ -d measure-base ]; then
            diff -r -U0 -x commit.txt -x 'runner*.txt' -x '*.log' -x ifc.sha256 -x diagnostics.json \
              -x mcp-dump.json -x '*.ifc' -x '*.glb' measure-base measure-head > scorer-diff.txt || true
          fi
          {
            echo "## Measured"
            echo
            echo "head: $(cat measure-head/commit.txt)"
            [ -d measure-base ] && echo "base: $(cat measure-base/commit.txt)"
            echo
            # Which exports and diagnostics moved, what the scorer diff holds
            # beyond the head side's own output, and the probe's lines, counted
            # (tools/re/measure_verdict.py): what a reader of the run looks for first.
            python3 -I tools/re/measure_verdict.py measure-head measure-base scorer-diff.txt > verdict.md 2>&1 || echo "measure_verdict.py failed (exit $?)" >> verdict.md
            head -c 60000 verdict.md
            echo
            # #1327: what the MCP server answered, per model, against the
            # model's own export. A difference is a bug in the server or in the
            # export (tools/re/mcp_answers_vs_ifc.py); it fails no job here.
            mcp_lines=()
            for f in measure-head/*/mcp_answers_vs_ifc.txt measure-head/*/counts.txt; do
              [ -f "$f" ] || continue
              # A counts.txt is a restricted model's, which may hold no MCP line at all.
              if [ "$(basename "$f")" = counts.txt ] && ! grep -qs '^mcp answers: ' "$f"; then continue; fi
              verdict=$(grep -E '^mcp answers: consistency (PASS|FAIL|NOT MEASURED)' "$f" | head -n 1 | sed -E 's/^mcp answers: consistency //')
              if [ -z "$verdict" ]; then
                # A crash leaves no verdict: told apart from a pass and a fail.
                status=$(grep -E '^(mcp answers: )?exit [0-9]+$' "$f" | sed -n '$p' | sed -E 's/^(mcp answers: )?exit //')
                verdict="no verdict, exit ${status:-unknown}: see its mcp_answers_vs_ifc.txt"
              fi
              mcp_lines+=("- $(basename "$(dirname "$f")"): $verdict")
            done
            if [ "${#mcp_lines[@]}" -gt 0 ]; then
              echo "### MCP server answers against the export"
              echo
              printf '%s\n' "${mcp_lines[@]}"
              echo
            fi
            # The gates of the Areas of Revit 2025 to 2027 and of the 2021 save:
            # counts by field, from each shard's own directory (the shard that
            # ran a gate, not one that skipped it).
            ran=0
            for f in measure-head-shards/*/areas_across_saves.txt measure-head-shards/*/areas_across_saves_2021.txt; do
              [ -s "$f" ] || continue
              grep -q '^areas across saves: skipped:' "$f" && continue
              case "$f" in
                *_2021.txt) echo "### Areas of rac_advanced on its 2021 save against its 2022 save" ;;
                *) echo "### Areas of rac_advanced across its 2024 to 2027 saves" ;;
              esac
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
              ran=1
            done
            if [ "$ran" = 0 ]; then
              echo "### Areas of rac_advanced across its saves"
              echo
              echo "No shard ran an Areas gate (the Same-project gates job says why)."
              echo
            fi
            if [ -d measure-base ]; then
              echo "### Models and samples whose IFC differs (export time ignored)"
              echo
              for d in measure-head/*/; do
                m=$(basename "$d")
                [ -f "$d/ifc.sha256" ] || continue
                if [ ! -f "measure-base/$m/ifc.sha256" ]; then echo "- $m: no base hash"
                elif cmp -s "$d/ifc.sha256" "measure-base/$m/ifc.sha256"; then echo "- $m: identical"; else echo "- $m: **differs**"; fi
              done
              echo
              echo "### Files whose rvt-info output differs (models and families)"
              echo
              for d in measure-head/*/; do
                f=$(basename "$d")
                [ -f "$d/info.json" ] || continue
                if cmp -s "$d/info.json" "measure-base/$f/info.json" && cmp -s "$d/info.exit" "measure-base/$f/info.exit"; then echo "- $f: identical ($(cat "$d/info.exit"))"; else echo "- $f: **differs**"; fi
              done
              echo
              echo "### Times"
              echo
              echo "These jobs check what the exports hold. They run exports and scorers several at once, on several runners whose speed alone differs by up to about 1.7x, so their times are not benchmarks. Dispatch with \`timing\` to time both refs' exports of each file on one runner (tools/ci/measure-timing.sh)."
              echo
              echo "### What the scorers show got worse (advisory)"
              echo
              echo "The property and quantity censuses miss a body that moved away from Revit's (an element's volume, a coverage count, the rows on a different storey); this lists them next to the census's own count."
              echo
              python3 -I tools/re/cmp_measure.py measure-base measure-head > regressions.txt 2>&1 || echo "cmp_measure.py failed (exit $?)" >> regressions.txt
              echo '```'
              head -c 60000 regressions.txt
              echo
              echo '```'
              echo
              echo "### What the censuses counted apart (head)"
              echo
              echo "The values the property and quantity censuses set aside instead of scoring, summed over each group of models. docs/counted-apart.md says what each category is and who decided it; a category with a count here is a value that \"different 0\" does not cover."
              echo
              python3 -I tools/re/counted_apart.py measure-head > counted-apart.txt 2>&1 || echo "counted_apart.py failed (exit $?)" >> counted-apart.txt
              head -c 30000 counted-apart.txt
              echo
              echo "### Why bodies are still a record box (base → head)"
              echo
              echo "How many bodies are only their element record's box, by the reason the saved-mesh pass gives for not using the element's saved mesh (exported.saved_mesh_refusals, #1645), summed over the models and samples whose diagnostics the run kept. The next decoder to write is the one whose reason clears the most."
              echo
              python3 -I tools/re/box_reasons.py measure-head measure-base > box-reasons.txt 2>&1 || echo "box_reasons.py failed (exit $?)" >> box-reasons.txt
              echo '```'
              head -c 30000 box-reasons.txt
              echo
              echo '```'
              echo
              echo "### Scorer differences (base → head)"
              echo
              limit=$((640 * 1024))
              size=$(stat -c %s scorer-diff.txt)
              echo '```diff'
              head -c "$limit" scorer-diff.txt
              echo
              echo '```'
              if [ "$size" -gt "$limit" ]; then
                echo
                echo "**Truncated:** the scorer diff is $size bytes and this shows its first $limit; the whole diff is the \`compare-scorer-diff\` artifact."
              fi
            else
              echo "No base; the scores are in the measure-head artifact."
            fi
          } > summary.md
          size=$(stat -c %s summary.md)
          if [ "$size" -gt 1000000 ]; then
            echo "::error::the summary is $size bytes, over GitHub's 1 MiB step summary limit"
            exit 1
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # In the log too, which `gh run view --log` reads where the summary
          # page cannot be.
          cat verdict.md
      # The verdict alone, a few kilobytes, for a reader that would otherwise
      # download both sides' results to learn which exports moved.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('verdict.md') != '' }}
        with:
          name: measure-verdict
          path: verdict.md
          overwrite: true
      # #1334: the semantic diff of the two sides' MCP dumps, per openly
      # licensed model. A dump in a model that is restricted or on neither list
      # (tools/re/semantic_diff.py OPEN_MODELS) fails this step. A run with no
      # dump on either side (a probe run, scorers that leave the server out)
      # writes nothing, so it gets no check; one side's dump alone is written
      # as a manifest, which the Semantic check reports as NOT MEASURED. The
      # check is written only for a run that was asked for every open model: a
      # dispatched run with no `models` filter and the office and the Revit 2025
      # models on (the manifest says so; the Semantic check does not rely on it
      # to pass anything, it compares the models it finds with its own list).
      - name: Semantic diff of the MCP dumps
        if: needs.plan.outputs.base == 'true'
        shell: bash
        env:
          REQUESTED_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.models == '' && inputs.nordic && inputs.r2025 && 'true' || 'false' }}
          # The commits the plan job resolved from the inputs, not the commit.txt of a result folder: that
          # file is written by a shard job that runs the measured code, which could name any commit.
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          status=0
          args=(--head-sha "$HEAD_SHA" --base-sha "$BASE_SHA")
          [ "$REQUESTED_ALL" = true ] && args+=(--requested-all)
          python3 tools/re/semantic_diff.py measure measure-base measure-head semantic-diff "${args[@]}" > semantic-diff.log 2>&1 || status=$?
          cat semantic-diff.log
          {
            echo "### Semantic diff of the MCP dumps"
            echo
            echo '```'
            cat semantic-diff.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.base == 'true' && hashFiles('semantic-diff/manifest.json') != ''
        with:
          name: semantic-diff
          path: semantic-diff
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the summary failed for its size: the diff is then the
        # only place the scorer differences are.
        if: ${{ !cancelled() && hashFiles('scorer-diff.txt') != '' }}
        with:
          name: compare-scorer-diff
          path: scorer-diff.txt
          overwrite: true
      # #1437: every IfcSpace of every export the head side wrote says what it
      # is (tools/re/space_kinds_vs_ifc.py). The total fails the job when a
      # model has no result or failed (judged on its counts, not its verdict
      # word), when a space has no kind or disagrees with its outline source,
      # when a model's spaces are not the number its own export counted, and
      # when a geometry export's spaces have no outline source to check, so a
      # check that looked at nothing cannot pass. A run of models that hold no
      # space, such as one filtered to two Revit 2025 roofs, passes when every
      # export agrees it holds none. Last, so the summary, the semantic diff and
      # the uploads are written first. A run that names `scorers` without this
      # one has not asked for the check and is left alone; naming it runs the
      # step that judges it. The base side is not gated: it is main, whose
      # exports have no kind to find.
      - name: Every IfcSpace says what it is
        if: ${{ !cancelled() && (inputs.scorers == '' || contains(inputs.scorers, 'space_kinds_vs_ifc')) }}
        shell: bash
        run: |
          status=0
          python3 tools/re/space_kinds_vs_ifc.py --total measure-head > space-kinds-total.txt 2>&1 || status=$?
          cat space-kinds-total.txt
          {
            echo "### IfcSpace kinds across the run (head)"
            echo
            echo '```'
            cat space-kinds-total.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # B81: the base and head jobs above run on different runners, so their wall
  # times compare machines as much as code. With `timing`, rvt-ifc is built at
  # both refs once (timing-build), and the files, models and samples, are
  # timed in shards of about equal time (the plan job splits them). A shard
  # times base and head on its one runner, in turn (tools/ci/measure-timing.sh),
  # so every ratio is a pair on the same CPU; runner CPUs differ by up to about
  # a quarter. timing-merge puts the shards' tables into the one table.
  timing-build:
    name: Timing build
    if: inputs.timing && inputs.base != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      head: ${{ steps.commits.outputs.head }}
      base: ${{ steps.commits.outputs.base }}
    steps:
      - name: Head source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          path: head
      - name: Base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.base || 'main' }}
          path: base
      - name: Install Rust stable
        uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            head
            base
          shared-key: measure
          # As in the build job: only main's own code saves the cache.
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' && (inputs.base == '' || inputs.base == 'main') }}
      - name: Build both
        id: commits
        run: |
          (cd head && cargo build --profile ci --bin rvt-ifc)
          (cd base && cargo build --profile ci --bin rvt-ifc)
          echo "head=$(cd head && git log -1 --format='%H %s')" >> "$GITHUB_OUTPUT"
          echo "base=$(cd base && git log -1 --format='%H %s')" >> "$GITHUB_OUTPUT"
      # Artifacts do not keep the executable bit; the shards set it again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-bin
          path: |
            base/target/ci/rvt-ifc
            head/target/ci/rvt-ifc
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  timing:
    name: Timing ${{ matrix.shard }} (${{ matrix.what }})
    needs: [plan, timing-build]
    if: inputs.timing && inputs.base != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.timing) }}
    steps:
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: dl_timing_bin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: timing-bin
          path: timing-bin
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download timing-bin
        if: steps.dl_timing_bin.outcome == 'failure'
        run: sleep 20
      - name: Download timing-bin (second attempt)
        if: steps.dl_timing_bin.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: timing-bin
          path: timing-bin
      - name: Make the binaries executable
        run: chmod +x timing-bin/base/target/ci/rvt-ifc timing-bin/head/target/ci/rvt-ifc
      - name: Fetch the reference models
        if: matrix.reference
        run: tools/fetch-reference-models.sh models
      # The office models land beside the reference models, so they are timed
      # with them. The host being down is NOT MEASURED, as for the other jobs.
      - name: Fetch the BIM4LCA office models
        if: matrix.offices
        shell: bash
        run: |
          mkdir -p models
          set +e
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-measure.tsv models \
            ARK_NordicLCA_Office_Concrete_As-Built.rvt ARK_NordicLCA_Office_Concrete_As-Built_Revit.ifc \
            ARK_NordicLCA_Office_Concrete_BuildingPermit.rvt ARK_NordicLCA_Office_Concrete_BuildingPermit_Revit.ifc \
            ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit.rvt ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit_Revit.ifc \
            ARK_NordicLCA_Office_Terrain_Timber_BuildingPermit.rvt ARK_NordicLCA_Office_Terrain_Timber_BuildingPermit_Revit.ifc
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIM4LCA office models NOT MEASURED: the host was unreachable" ;;
            *) echo "::error::the BIM4LCA office models no longer match research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      # The housing and the timber office, which the office step does not fetch:
      # the files a unit names, beside the others in models/.
      - name: Fetch the BIM4LCA housing and timber office models
        if: matrix.bim4lca != ''
        shell: bash
        env:
          FILES: ${{ matrix.bim4lca }}
        run: |
          mkdir -p models
          set +e
          # shellcheck disable=SC2086 # The file names are words.
          python3 tools/ci/fetch-bim4lca.py research/bim4lca-measure.tsv models $FILES
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::BIM4LCA housing and timber office models NOT MEASURED: the host was unreachable" ;;
            *) echo "::error::the BIM4LCA housing and timber office models no longer match research/bim4lca-measure.tsv"; exit 1 ;;
          esac
      - name: Fetch Autodesk's sample projects
        if: matrix.ranges != ''
        shell: bash
        env:
          RANGES: ${{ matrix.ranges }}
        run: |
          # Each range is a first and a last year, a semicolon apart.
          IFS=';' read -ra ranges <<< "$RANGES"
          for range in "${ranges[@]}"; do
            # shellcheck disable=SC2086 # A range is the first and last year.
            tools/fetch-autodesk-samples.sh _samples $range
          done
      - name: Time
        env:
          RVT_IFC_FLAGS: ${{ inputs.ifc_flags }}
          SHARD: ${{ matrix.shard }}
          WHAT: ${{ matrix.what }}
        run: |
          tools/ci/measure-timing.sh timing-bin/base/target/ci timing-bin/head/target/ci timing.md models/*.rvt _samples/*.rvt
          grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs > runner.txt
          {
            echo "### Timing shard $SHARD ($WHAT)"
            echo
            echo "runner: $(cat runner.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-timing-shard-${{ matrix.shard }}
          path: |
            timing.md
            runner.txt
          if-no-files-found: error
          overwrite: true

  # The shards' rows in one table, the format the single job wrote, ordered as
  # it did: the models, then the samples by name. A shard that left no table
  # fails this job after the others are merged.
  timing-merge:
    name: Timing
    needs: [plan, timing-build, timing]
    if: ${{ !cancelled() && inputs.timing && inputs.base != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The timing verdict's script, from the workflow's own ref (this job runs
      # no measured code). First, since a checkout cleans the workspace.
      - name: Workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/re/timing_verdict.py
          sparse-checkout-cone-mode: false
      - id: dl_timing_shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: measure-timing-shard-*
          path: shards
      # A second attempt after a transient failure (#1742): the artifacts service can reset a request.
      - name: Pause before the second attempt of Download measure-timing-shard-*
        if: steps.dl_timing_shards.outcome == 'failure'
        run: sleep 20
      - name: Download measure-timing-shard-* (second attempt)
        if: steps.dl_timing_shards.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: measure-timing-shard-*
          path: shards
      - name: Merge the shards' tables
        env:
          PLAN: ${{ needs.plan.outputs.timing }}
          HEAD_COMMIT: ${{ needs.timing-build.outputs.head }}
          BASE_COMMIT: ${{ needs.timing-build.outputs.base }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          e = os.environ
          header = None
          rows = []
          runners = []
          missing = []
          plan = json.loads(e["PLAN"])["include"]
          for shard in plan:
              directory = f"shards/measure-timing-shard-{shard['shard']}"
              # download-artifact puts the one artifact a pattern matches
              # straight into `path`, with no directory of its name, so a plan
              # of a single shard (a run with `models`, or neither `nordic`
              # nor `samples`) would leave no table.
              if len(plan) == 1 and not os.path.isdir(directory):
                  directory = "shards"
              try:
                  lines = open(f"{directory}/timing.md").read().splitlines()
                  cpu = open(f"{directory}/runner.txt").read().strip()
              except OSError:
                  missing.append(shard)
                  continue
              runners.append(f"- shard {shard['shard']} ({shard['what']}): {cpu}")
              header = header or lines[:2]
              rows += [line for line in lines[2:] if line.startswith("|")]
          # A model's row first, then a sample's: `2024_Core_Interior` is a model.
          def order(row):
              name = row.split("|")[1].strip()
              return (re.match(r"\d{4}-", name) is not None, name)
          rows.sort(key=order)
          if header:
              open("timing.md", "w").write("\n".join(header + rows) + "\n")
          open("timing-runners.txt", "w").write("\n".join(runners) + "\n")
          with open(e["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## rvt-ifc time, base → head, each file on one runner\n\n")
              summary.write(f"head: {e['HEAD_COMMIT']}\nbase: {e['BASE_COMMIT']}\n\n")
              summary.write("Median of three exports each, in turn on the same runner, with each export's peak resident memory. ")
              summary.write("The files were timed in shards, each on a runner of its own with base and head together: compare ratios, not times, between rows, since runner CPUs differ by up to about a quarter.\n\n")
              summary.write("Runners:\n\n" + "\n".join(runners) + "\n\n")
              for shard in missing:
                  summary.write(f"No table from shard {shard['shard']} ({shard['what']}).\n\n")
              if header:
                  # The ratios performance rows are judged on, above the table
                  # they come from (tools/re/timing_verdict.py).
                  verdict = subprocess.run(["python3", "-I", "tools/re/timing_verdict.py", "timing.md"],
                                           capture_output=True, text=True)
                  text = (verdict.stdout[:60000] if verdict.returncode == 0
                          else f"timing_verdict.py failed (exit {verdict.returncode}): {verdict.stderr[:2000]}\n\n")
                  open("timing-verdict.md", "w").write(text)
                  print(text)
                  summary.write(text)
                  summary.write("\n".join(header + rows) + "\n")
          for shard in missing:
              print(f"::error::timing shard {shard['shard']} ({shard['what']}) left no table")
          raise SystemExit(1 if missing or not header else 0)
          PY
      # timing-build checks out `inputs.base || 'main'` and `inputs.ref ||
      # github.sha` as given, when it starts, while the shards of the measuring
      # jobs use the commits the plan job resolved once. If a branch (main, for
      # the base) moved in between, this table times a commit those jobs did
      # not score; say so, in the log and under the table.
      - name: The timed commits are the measured ones
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PLAN_HEAD: ${{ needs.plan.outputs.head_sha }}
          PLAN_BASE: ${{ needs.plan.outputs.base_sha }}
          TIMED_HEAD: ${{ needs.timing-build.outputs.head }}
          TIMED_BASE: ${{ needs.timing-build.outputs.base }}
        run: |
          compare() { # side planned timed: the timed value is "<sha> <subject>"
            local timed=${3%% *}
            if [ -z "$timed" ]; then
              echo "::notice::timing-build left no $1 commit to compare with the measured one"
            elif [[ ! "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::notice::the $1 ref was not resolved to a full SHA ($2), so the timed commit $timed cannot be compared with the measured one"
            elif [ "$timed" != "$2" ]; then
              msg="the timing table's $1 is $timed, not $2, the commit the measuring jobs scored: the ref moved after the plan job resolved it"
              echo "::warning::$msg"
              printf -- '\n**Warning:** %s.\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          compare head "$PLAN_HEAD" "$TIMED_HEAD"
          compare base "$PLAN_BASE" "$TIMED_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-timing
          path: |
            timing.md
            timing-runners.txt
            timing-verdict.md
          if-no-files-found: error
          overwrite: true
