# Claude Code on a thread of this repository, when the maintainer asks for it by
# writing @claude (Griffin, 2026-11-05). Only his account can start it, so nobody
# else's comment reaches the token or spends a run, and a reply goes up only when
# he asked for one. The job reads the repository and its CI; the action's own app
# token writes the reply.
#
# CLAUDE_CODE_OAUTH_TOKEN is a repository secret, and this is the one workflow that
# reads it. A pull request from a fork gets no secrets. An issue_comment run always
# takes this file from main, so a branch cannot change it for a comment.

name: Claude Code

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] only the maintainer's account gets past the job's `if`, and it checks out main, not a pull request's head
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'DrunkOnJava' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action exchanges it for its app token
      actions: read # CI results on a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
