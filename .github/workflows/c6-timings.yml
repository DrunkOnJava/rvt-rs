name: C6 timings (scratch)

on:
  push:
    branches: [scratch/c6-timings]

permissions:
  contents: read

# The same as ci.yml, so rust-cache restores the ci-release key.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: ci-release
      # Does ifc_synthetic_project fail as its own binary too, or only as a
      # module of the merged one?
      - name: ifc_synthetic_project as its own binary
        run: cargo test --profile ci --test ifc_synthetic_project -- --nocapture
