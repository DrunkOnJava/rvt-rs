# OpenSSF Scorecard (C10): scores the repository's supply-chain practices
# (pinned dependencies, token permissions, branch protection, signed
# releases, fuzzing, SAST) and reports them to code scanning and the public
# Scorecard API. scorecard-action restricts this workflow: no top-level env
# or defaults, and only the scorecard job may hold id-token: write.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays at 06:07 UTC.
    - cron: "7 6 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
