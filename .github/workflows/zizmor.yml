# zizmor: static analysis of the workflows themselves (C10). It finds
# template injection (an input expanded into a shell), checkouts that keep
# the token, over-broad permissions and unpinned actions. Its findings go to
# the repository's code scanning alerts; it is not part of `CI passed`, so a
# finding is fixed rather than blocking unrelated pull requests.

name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    # Mondays at 05:53 UTC: new audits arrive with new zizmor releases.
    - cron: "53 5 * * 1"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
