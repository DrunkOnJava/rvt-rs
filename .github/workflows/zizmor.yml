# zizmor: static analysis of the workflows themselves (C10). It finds
# template injection (an input expanded into a shell), checkouts that keep
# the token, over-broad permissions and unpinned actions. Its findings go to
# the repository's code scanning alerts; it is not part of `CI passed`, so a
# finding is fixed rather than blocking unrelated pull requests.

name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    # Mondays at 05:53 UTC: new audits arrive with new zizmor releases.
    - cron: "53 5 * * 1"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action uploads its SARIF to code scanning itself, as its last
      # step, and that upload failed once with zizmor having exited 0 and no
      # finding (2026-11-05, run 42061129888, attempt 1); the job passed when
      # rerun. The upload cannot be retried apart from the action, and with
      # `advanced-security: false` the action writes no SARIF at all, so the
      # whole action is run once more after a failure: zizmor takes about 6
      # seconds, and a zizmor error or a rejected upload fails both times and
      # fails the job. (Findings alone do not fail it: in SARIF mode zizmor
      # exits 0 and they become code scanning alerts.)
      - name: zizmor
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.30.1"
      - name: zizmor (retry)
        if: steps.zizmor.outcome == 'failure'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.30.1"
