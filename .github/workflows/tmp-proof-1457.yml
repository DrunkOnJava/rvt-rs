# TEMPORARY (#1457): proofs for the speed items, removed before the pull request leaves draft.
name: tmp proofs 1457

on:
  push:
    branches: [ci/speed-wheels-codeql-re1-sarif]
    paths:
      - ".github/workflows/tmp-proof-1457.yml"

permissions: {}

jobs:
  wheel-linux-env:
    name: tmp wheel on Linux, cargo verbose
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TERM_VERBOSE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist

  wheel-cache:
    name: tmp wheel on ${{ matrix.os }} with a wheel-only rust-cache
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-wheel-proof
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist

  fetch-re1:
    name: tmp fetch-re1 failure modes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cold, all eight files
        uses: $/.github/actions/fetch-re1
        with:
          path: _proof/cold
      - name: Same job again, two files; the store already holds all eight
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Architecture.rvt RE1-Mechanical.ifc
          path: _proof/warm
      - name: A comment in the pin list, so that the cache key is one nothing has saved
        shell: bash
        run: |
          echo "# ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT}" >> research/re1-models.tsv
      - name: Empty one file in the store
        shell: bash
        run: |
          : > "${RUNNER_TEMP}/re1-models/RE1-Plumbing.rvt"
          ls -l "${RUNNER_TEMP}/re1-models/RE1-Plumbing.rvt"
      - name: Ask for it; only that file is downloaded again
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Plumbing.rvt
          path: _proof/repair
      - name: Break one hash in the pin list
        shell: bash
        run: |
          sed -i 's/^\(file\tRE1-Mechanical.ifc\t\)[0-9a-f]\{64\}/\1deadbeef00000000000000000000000000000000000000000000000000000000/' research/re1-models.tsv
          grep -c deadbeef research/re1-models.tsv
      - name: A pin neither host satisfies
        id: broken
        continue-on-error: true
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Mechanical.ifc
          path: _proof/broken
      - name: That step failed, and nothing was placed
        shell: bash
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          echo "outcome: ${OUTCOME}"
          test "${OUTCOME}" = failure
          test ! -e _proof/broken/RE1-Mechanical.ifc
          ls _proof/*

  sarif-retry:
    name: tmp upload-sarif retry shape
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A SARIF with no results
        shell: bash
        run: |
          printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"tmp-1457-retry-proof","rules":[]}},"results":[]}]}' > empty.sarif
      - name: Upload the results to code scanning (forced to fail)
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: missing.sarif
      - name: Upload the results to code scanning (retry)
        if: steps.sarif.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: empty.sarif
          category: tmp-1457-sarif-retry

  zizmor-retry:
    name: tmp zizmor retry shape
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (forced to fail with a version that does not exist)
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "0.0.1"
          advanced-security: false
          inputs: .github/workflows/tmp-proof-1457.yml
      - name: zizmor (retry)
        if: steps.zizmor.outcome == 'failure'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.30.1"
          advanced-security: false
          inputs: .github/workflows/tmp-proof-1457.yml
