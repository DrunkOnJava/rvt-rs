# TEMPORARY (#1457): proofs for the speed items, removed before the pull request leaves draft.
name: tmp proofs 1457

on:
  push:
    branches: [ci/speed-wheels-codeql-re1-sarif]
    paths:
      - ".github/workflows/tmp-proof-1457.yml"

permissions: {}

jobs:
  wheel-cache:
    name: tmp wheel on ${{ matrix.os }}, ${{ matrix.cache }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        cache: [none, rust-cache]
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
          rustc --version
      - name: A wheel-only rust-cache
        if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-wheel-proof
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist

  fetch-re1:
    name: tmp fetch-re1 failure modes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All eight files; a cache saved by an earlier run of this workflow is restored
        uses: $/.github/actions/fetch-re1
        with:
          path: _proof/cold
      - name: Same job again, two files
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Architecture.rvt RE1-Mechanical.ifc
          path: _proof/warm
      - name: A comment in the pin list, so that the cache key is one nothing has saved
        shell: bash
        run: |
          echo "# ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT}" >> research/re1-models.tsv
      - name: Empty one file in the store
        shell: bash
        run: |
          : > "${RUNNER_TEMP}/re1-models/RE1-Plumbing.rvt"
          ls -l "${RUNNER_TEMP}/re1-models/RE1-Plumbing.rvt"
      - name: Ask for it; only that file is downloaded again
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Plumbing.rvt
          path: _proof/repair
      - name: Break one hash in the pin list
        shell: bash
        run: |
          sed -i 's/^\(file\tRE1-Mechanical.ifc\t\)[0-9a-f]\{64\}/\1deadbeef00000000000000000000000000000000000000000000000000000000/' research/re1-models.tsv
          grep -c deadbeef research/re1-models.tsv
      - name: A pin neither host satisfies
        id: broken
        continue-on-error: true
        uses: $/.github/actions/fetch-re1
        with:
          files: RE1-Mechanical.ifc
          path: _proof/broken
      - name: That step failed, and nothing was placed
        shell: bash
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          echo "outcome: ${OUTCOME}"
          test "${OUTCOME}" = failure
          test ! -e _proof/broken/RE1-Mechanical.ifc
          ls _proof/*

  same-job-control:
    name: tmp the old shape, a second upload in the same job
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A SARIF with no results
        shell: bash
        run: |
          printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"tmp-1457-same-job","rules":[]}},"results":[]}]}' > empty.sarif
      - name: First upload, with a token GitHub refuses
        id: first
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: empty.sarif
          category: tmp-1457-same-job
          token: not-a-token
      - name: Second upload in the same job, with the real token
        id: second
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: empty.sarif
          category: tmp-1457-same-job
      - name: The first failed after validation, and the second was refused
        shell: bash
        env:
          FIRST: ${{ steps.first.outcome }}
          SECOND: ${{ steps.second.outcome }}
        run: |
          echo "first: ${FIRST}, second: ${SECOND}"
          test "${FIRST}" = failure
          test "${SECOND}" = failure

  scorecard-shape:
    name: tmp the Scorecard shape, first upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    outputs:
      upload: ${{ steps.sarif.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A SARIF of two runs, each with a category of its own
        shell: bash
        run: |
          printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"tmp-1457-scorecard","rules":[]}},"automationDetails":{"id":"tmp-1457/one/"},"results":[]},{"tool":{"driver":{"name":"tmp-1457-scorecard","rules":[]}},"automationDetails":{"id":"tmp-1457/two/"},"results":[]}]}' > results.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-scorecard-results
          path: results.sarif
          retention-days: 1
      - name: Upload the results to code scanning, with a token GitHub refuses
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          token: not-a-token

  scorecard-shape-retry:
    name: tmp the Scorecard shape, retry job
    needs: scorecard-shape
    if: needs.scorecard-shape.outputs.upload == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Say that the first upload failed
        run: echo "::warning::the first upload failed; trying once more"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tmp-scorecard-results
      - name: Upload the results to code scanning (retry)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/scorecard.yml:analysis
        with:
          sarif_file: results.sarif

  zizmor-shape:
    name: tmp the zizmor shape, first upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    outputs:
      attempt: ${{ steps.sarif.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A SARIF that zizmor's upload would carry, with the category and tool it uses
        shell: bash
        run: |
          printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"zizmor","rules":[]}},"results":[]}]}' > zizmor.sarif
      - name: Upload with a token GitHub refuses
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          token: not-a-token

  zizmor-shape-retry:
    name: tmp the zizmor shape, retry job
    needs: zizmor-shape
    if: needs.zizmor-shape.outputs.attempt == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Say that the first run failed
        run: echo "::warning::the first run failed; running it once more"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (retry)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/zizmor.yml:zizmor
        with:
          version: "1.30.1"
