# Temporary (#827): regenerates tests/fixtures/synthetic-project.ifc from
# the never-run generator test and checks it. Closed unmerged.
name: dump synthetic fixture
on: pull_request
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          DUMP_IFC=1 cargo test --profile ci --test integration ifc_synthetic_project:: -- --nocapture || true
          git diff --stat
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check
        run: |
          python -m pip install --require-hashes -r tools/ci/requirements-ifc.txt
          python tools/ci/ifc4_property_sets.py tests/fixtures/synthetic-project.ifc || true
          grep -o "IFCPROPERTYSET([^;]*" tests/fixtures/synthetic-project.ifc
          python -m ifcopenshell.validate tests/fixtures/synthetic-project.ifc
          python tools/ci/ifc_schema_arity.py tests/fixtures/synthetic-project.ifc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-project
          path: tests/fixtures/synthetic-project.ifc
