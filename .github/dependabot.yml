version: 2
updates:
  - package-ecosystem: cargo
    # The fuzz workspace has its own lockfile, so a bump to the crate's
    # dependencies has to reach it too.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    labels:
      - dependencies
      - viewer
      - javascript
    commit-message:
      prefix: deps
      include: scope
