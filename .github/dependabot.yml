version: 2
updates:
  - package-ecosystem: cargo
    # The fuzz workspace has its own lockfile, so a bump to the crate's
    # dependencies has to reach it too.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one pull request a week; a major
    # update stays its own pull request, since it needs its own migration.
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    groups:
      viewer-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - viewer
      - javascript
    commit-message:
      prefix: deps
      include: scope
