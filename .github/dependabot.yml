version: 2
# Commit titles read `build(deps): ...` (Conventional Commits), and a release
# waits three days before Dependabot proposes it (a week for a major Cargo or
# npm one), so a version pulled soon after publication never lands (C10).
updates:
  - package-ecosystem: cargo
    # The fuzz workspace and the IFClite witness have their own lockfiles,
    # so a bump to their dependencies has to reach them too.
    directories:
      - /
      - /fuzz
      - /tools/ci/witness-ifc-lite
    # The witness pins ifc-lite-core exactly (`=7.1.1`): a different version is a
    # different witness, recorded in research/witness-registry.json, so it
    # moves by hand, never by Dependabot.
    ignore:
      - dependency-name: ifc-lite-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one pull request a week; a major
    # update stays its own pull request, since it needs its own migration.
    # pyo3 and pyo3-build-config (rvt-py's build script) move together: a
    # pull request that moves one alone leaves two pyo3-build-config versions
    # in the lockfile (#777). A dependency joins the first group it matches.
    groups:
      pyo3:
        patterns:
          - pyo3
          - pyo3-*
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: github-actions
    # The workflows, and the composite actions under .github/actions, which pin
    # actions of their own.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build
      include: scope
    # No semver cooldowns for this ecosystem: Dependabot accepts only
    # default-days here.
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    groups:
      viewer-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - viewer
      - javascript
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: docker
    # The release container image's base, pinned by digest in docker/Dockerfile.
    directory: /docker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: build
      include: scope
    # No semver cooldowns for this ecosystem: Dependabot accepts only
    # default-days here.
    cooldown:
      default-days: 3
  - package-ecosystem: pip
    # The Python packages CI installs: tools/ci/requirements-*.in name them,
    # and requirements-*.txt pin them and their dependencies with hashes.
    directory: /tools/ci
    # IfcOpenShell is a witness and Measure's scorers run on it: an update
    # lands as tools/ci/requirements-ifc.in says (#773).
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - area:python
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
