[package]
name = "stream-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Reusable stream-evidence harness for Discussion #112 / issue #151 checksum-paged inflate probes (control vs experimental page stripping)."
authors = ["Griffin Long <151978260+DrunkOnJava@users.noreply.github.com>"]

[[bin]]
name = "stream-evidence"
path = "src/main.rs"

[dependencies]
rvt = { path = "../.." }
flate2 = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
